<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAS × Eco — Performance Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased">

  <!-- Login / Workspace Gate Overlay -->
  <div id="auth-gate" class="fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-7 space-y-5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-base shadow-md">M×E</div>
        <div>
          <h2 class="text-base font-extrabold">MAS × Eco Command Center</h2>
          <p class="text-xs text-slate-500">Đăng nhập bằng từ khóa Web App URL &amp; mật khẩu cá nhân</p>
        </div>
      </div>

      <div id="auth-gate-body"></div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="flex min-h-screen w-full">
    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden" onclick="toggleMobileSidebar(false)"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between transition-transform duration-200 -translate-x-full lg:translate-x-0 shrink-0">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-xs shadow-sm">M×E</div>
          <div>
            <div class="text-xs font-extrabold tracking-tight">MAS × Eco</div>
            <div class="text-[10px] text-slate-400">Command Center</div>
          </div>
        </div>
        <button onclick="toggleMobileSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Navigation -->
      <nav id="sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>

      <!-- Bottom Utilities -->
      <div class="p-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div id="cloud-sync-badge" class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 text-[10px] text-slate-500 flex items-center justify-between">
          <span>Cloud Auto-Save</span>
          <span id="cloud-sync-time" class="font-semibold text-emerald-600 dark:text-emerald-400">Sẵn sàng</span>
        </div>
        <button onclick="openReportModal()" class="w-full px-3 py-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold hover:opacity-90 flex items-center justify-center gap-2">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 1-Click Report
        </button>
        <div class="grid grid-cols-2 gap-1.5">
          <button id="btn-cloud-save" onclick="backupEcoToGoogleSheet()" class="px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold flex items-center justify-center gap-1" title="Lưu toàn bộ data Eco, Target, Tier Matrix & Task lên tab Workspace_Backup trên Google Sheet">
            <i data-lucide="cloud-upload" class="w-3 h-3"></i> Cloud Save
          </button>
          <button id="btn-cloud-load" onclick="restoreEcoFromGoogleSheet()" class="px-2.5 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold hover:bg-emerald-50 dark:hover:bg-emerald-950/40 flex items-center justify-center gap-1" title="Khôi phục toàn bộ data Eco & Workspace từ Google Sheet">
            <i data-lucide="cloud-download" class="w-3 h-3"></i> Restore
          </button>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="exportJson()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[11px] font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center gap-1">
            <i data-lucide="download" class="w-3 h-3"></i> Export
          </button>
          <label class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[11px] font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center gap-1 cursor-pointer">
            <i data-lucide="upload" class="w-3 h-3"></i> Import
            <input type="file" accept=".json" onchange="importJson(event)" class="hidden" />
          </label>
        </div>
        <div class="flex items-center justify-between pt-1">
          <button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5">
            <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5"></i>
            <span id="theme-label">Dark Mode</span>
          </button>
          <div class="flex items-center gap-1">
            <button onclick="openAuthSettingsModal()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40" title="Đổi từ khóa URL / Mật khẩu">
              Tài khoản
            </button>
            <button onclick="logoutWorkspace()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" title="Khóa màn hình">
              Khóa
            </button>
            <button id="btn-clear-mock" onclick="confirmClearMock()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">
              Xóa mẫu
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top Header -->
      <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-base sm:text-lg font-bold truncate">Command Center</h1>
            <p id="page-subtitle" class="text-xs text-slate-500 truncate">Tổng quan vận hành song song MAS & Eco</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="openQuickTaskModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-xs">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Thêm Task</span>
          </button>
        </div>
      </header>

      <!-- Dynamic Workspace Root -->
      <main id="app-main" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto"></main>
    </div>
  </div>

  <!-- Custom Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[60] space-y-2 max-w-sm"></div>

  <script>
    // =========================================================================
    // 1. CONSTANTS, AUTH & CORE STATE MANAGEMENT
    // =========================================================================
    const STORAGE_KEY = 'mas_eco_command_center_v3';
    const AUTH_KEY = 'mas_eco_auth_v1';
    const SAVED_URL_KEY = 'mas_eco_saved_webapp_url';
    const DEFAULT_WEB_APP_URL = '';

    const FLIGHTING_STREAMS = [
      { id: 'oap_skin_live', brand: 'OAP Skin', format: 'Livestream', isLive: true },
      { id: 'lifebuoy_live', brand: 'Lifebuoy', format: 'Livestream', isLive: true },
      { id: 'mny_cpd', brand: 'MNY', format: 'Video CPD', isLive: false },
      { id: 'oap_cpd', brand: 'OAP', format: 'Video CPD', isLive: false }
    ];

    const TIER_META = {
      BAU: { short: 'B', label: 'BAU', cls: 'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200', badge: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' },
      Campaign: { short: 'C', label: 'Campaign', cls: 'bg-sky-500 text-white', badge: 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300' },
      Mega: { short: 'M', label: 'Mega', cls: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300' },
      SMG: { short: 'S', label: 'SMG', cls: 'bg-rose-600 text-white', badge: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300' },
      Off: { short: '—', label: 'Off', cls: 'bg-slate-100 text-slate-400 dark:bg-slate-800/50 dark:text-slate-600', badge: 'bg-slate-100 text-slate-400 dark:bg-slate-800 dark:text-slate-500' }
    };

    let isPaintingTier = false;
    let ecoLiveCsvState = {
      brand: 'OAP Skin',
      tierFilter: 'ALL',
      filename: '',
      rows: [],
      benchmarks: {},
      trafficImg: '',
      trafficOcrStatus: '',
      trafficInsights: [],
      productImg: '',
      productOcrStatus: '',
      productInsights: []
    };

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function offsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateISO(d) {
      if (!(d instanceof Date) || isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function normalizeDateToISO(raw) {
      if (!raw) return '';
      const s = String(raw).trim().split(' ')[0];
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) {
        const dd = m[1].padStart(2, '0');
        const mm = m[2].padStart(2, '0');
        return `${m[3]}-${mm}-${dd}`;
      }
      return '';
    }

    function parseCsvNumber(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (!val) return 0;
      let s = String(val).trim().replace(/[₫$%\s]/g, '');
      if (!s || s === '—' || s === '-') return 0;
      if (s.includes('.') && s.includes(',')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) {
          s = s.replace(/\./g, '').replace(',', '.');
        } else {
          s = s.replace(/,/g, '');
        }
      } else if (s.includes('.')) {
        if (/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        if (/^\d{1,3}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g, '');
        else s = s.replace(',', '.');
      }
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function formatVnd(n) {
      const num = Number(n) || 0;
      if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(2) + ' tỷ';
      if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(1) + ' tr';
      return Math.round(num).toLocaleString('vi-VN') + ' đ';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseDelimitedLine(line, sep) {
      if (sep === '\t') return line.split('\t').map((c) => c.trim());
      const out = [];
      let cur = '';
      let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') inQ = !inQ;
        else if (ch === sep && !inQ) { out.push(cur.trim()); cur = ''; }
        else cur += ch;
      }
      out.push(cur.trim());
      return out;
    }

    function createDefaultState(withSample = true) {
      const mk = getCurrentMonthKey();
      const savedUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
      return {
        theme: 'light',
        activeTab: 'overview',
        masSubTab: 'perf',
        ecoSubTab: 'live_deepdive',
        liveViewDate: offsetDate(0),
        ecoTrackingMonth: mk,
        ecoMonthlyTargets: {},
        ecoDailyActuals: {},
        ecoPlanShots: {},
        ecoLiveSaved: { brand: 'OAP Skin', byBrand: {} },
        lastCloudBackup: '',
        masSheetConfig: {
          sheetUrl: 'https://docs.google.com/spreadsheets/d/1ZJMMM1XWIQvBzMzha3qMEJgU0QaTpf6FWf1s5BUBDRk/edit',
          webAppUrl: savedUrl,
          lastSync: '',
          summaryRows: [],
          deepdive: {}
        },
        tasks: withSample ? [
          { id: 't1', title: 'Review FB & Google Ads Intraday Today', project: 'MAS', tag: 'Ads', status: 'Doing', priority: 'High', due: offsetDate(0), focus: true, done: false },
          { id: 't2', title: 'Chốt budget rephasing OAP Skin & Lifebuoy', project: 'Eco', tag: 'Live', status: 'To Do', priority: 'High', due: offsetDate(0), focus: true, done: false }
        ] : [],
        masContent: withSample ? [
          { id: 'c1', title: 'Angle: Live Arrival Guarantee 100% AU', channel: 'FB Ads', status: 'In Production', deadline: offsetDate(2), link: '' }
        ] : [],
        ecoTracking: [
          { id: 'et1', brand: 'OAP Skin', format: 'Livestream', target: 792356008, spend: 0, revenue: 0, maxCir: 14.6 },
          { id: 'et2', brand: 'Lifebuoy', format: 'Livestream', target: 3245884902, spend: 0, revenue: 0, maxCir: 13.5 },
          { id: 'et3', brand: 'MNY', format: 'Video CPD', target: 2153742912, spend: 0, revenue: 0, maxCir: 7.3 },
          { id: 'et4', brand: 'OAP', format: 'Video CPD', target: 2333699391, spend: 0, revenue: 0, maxCir: 7.3 }
        ],
        ecoLiveSnapshots: [],
        ecoLiveLogs: [],
        ecoIssues: withSample ? [
          { id: 'ei1', channel: 'Lifebuoy — Livestream', issue: 'Pacing 47.4% & CIR 14.7% (> Trần 13.5%)', rootCause: 'CPM ngày BAU tăng, CTOR khung chiều thấp', nextAction: 'Dồn budget vào ngày Mega/SMG & ghim Hero SKU', pic: 'Squad Ads', status: 'Open' }
        ] : [],
        flighting: {
          monthKey: mk,
          activeBrush: 'Mega',
          grid: {},
          liveHours: {
            oap_skin_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' },
            lifebuoy_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' }
          },
          customHours: {}
        },
        scheduleBlocks: [
          { id: 'sb1', day: 1, project: 'MAS', time: '09:00 - 11:00', title: 'Check MER, FB/GG ROAS & Search Terms' },
          { id: 'sb2', day: 1, project: 'Eco', time: '14:00 - 16:00', title: 'Review Live CSV & Rephase Budget' }
        ],
        recurringTasks: [
          { id: 'rt1', title: 'Sync MAS Summary & kiểm tra Keyword lỗ', schedule: 'Hàng ngày', done: false },
          { id: 'rt2', title: 'Cập nhật CSV Livestream & đối soát CIR trần', schedule: 'Hàng ngày', done: false }
        ]
      };
    }

    let state = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const base = createDefaultState(false);
          const merged = { ...base, ...parsed };
          if (!merged.masSheetConfig.webAppUrl) {
            merged.masSheetConfig.webAppUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
          }
          return merged;
        }
      } catch (e) {}
      return createDefaultState(true);
    })();

    if (state.ecoLiveSaved) {
      ecoLiveCsvState.brand = state.ecoLiveSaved.brand || 'OAP Skin';
      const bSaved = state.ecoLiveSaved.byBrand?.[ecoLiveCsvState.brand] || state.ecoLiveSaved;
      ecoLiveCsvState.filename = bSaved.filename || '';
      ecoLiveCsvState.rows = bSaved.rows || [];
      ecoLiveCsvState.benchmarks = bSaved.benchmarks || {};
      ecoLiveCsvState.trafficInsights = bSaved.trafficInsights || [];
      ecoLiveCsvState.productInsights = bSaved.productInsights || [];
    }

    function updateCloudSyncBadge(text, busy = false) {
      const el = document.getElementById('cloud-sync-time');
      if (!el) return;
      el.textContent = text;
      el.className = busy
        ? 'font-semibold text-amber-600 dark:text-amber-400'
        : 'font-semibold text-emerald-600 dark:text-emerald-400';
    }

    function saveState(skipCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (state.masSheetConfig?.webAppUrl) {
          localStorage.setItem(SAVED_URL_KEY, state.masSheetConfig.webAppUrl);
        }
      } catch (e) {}
      if (!skipCloud && typeof autoCloudSaveSilent === 'function') {
        autoCloudSaveSilent();
      }
    }

    function getTierForDate(streamId, dateIso) {
      const custom = state.flighting?.grid?.[streamId]?.[dateIso];
      if (custom) return custom;
      const day = Number((dateIso || '').slice(8, 10));
      if (!day) return 'BAU';
      if ([21, 22, 23].includes(day)) return 'SMG';
      if ([9, 10, 11, 24, 25, 26, 27].includes(day)) return 'Mega';
      if ([6, 7, 8, 12, 13, 14, 15].includes(day)) return 'Campaign';
      return 'BAU';
    }

    // =========================================================================
    // 2. AUTH GATE (KEYWORD ALIAS + PASSWORD) & UI HELPERS
    // =========================================================================
    let isSessionUnlocked = false;

    function getAuthConfig() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      } catch (e) {
        return null;
      }
    }

    function renderAuthGate() {
      const gate = document.getElementById('auth-gate');
      const body = document.getElementById('auth-gate-body');
      if (!gate || !body) return;

      const cfg = getAuthConfig();
      if (isSessionUnlocked) {
        gate.classList.add('hidden');
        return;
      }
      gate.classList.remove('hidden');

      if (!cfg) {
        const preUrl = state.masSheetConfig?.webAppUrl || localStorage.getItem(SAVED_URL_KEY) || '';
        body.innerHTML = `
          <form onsubmit="setupWorkspaceAuth(event)" class="space-y-3 text-xs">
            <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-indigo-800 dark:text-indigo-200 leading-relaxed">
              Thiết lập lần đầu: Gán <strong>Từ khóa ngắn</strong> (VD: <code>tue</code>) cho link <strong>Web App URL</strong> và đặt mật khẩu cá nhân của bạn.
            </div>
            <div>
              <label class="font-bold block mb-1">Từ khóa đăng nhập (User Alias)</label>
              <input id="auth-setup-alias" required placeholder="VD: tue" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
            </div>
            <div>
              <label class="font-bold block mb-1">Google Apps Script Web App URL</label>
              <input id="auth-setup-url" value="${escapeHtml(preUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-[11px]" />
            </div>
            <div>
              <label class="font-bold block mb-1">Mật khẩu tự đặt (Password)</label>
              <input id="auth-setup-pass" type="password" required placeholder="Nhập mật khẩu..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow-sm">Lưu &amp; Vào Workspace</button>
          </form>
        `;
      } else {
        body.innerHTML = `
          <form onsubmit="submitWorkspaceLogin(event)" class="space-y-3 text-xs">
            <div>

    function setupWorkspaceAuth(e) {
      e.preventDefault();
      const alias = document.getElementById('auth-setup-alias').value.trim();
      const url = document.getElementById('auth-setup-url').value.trim();
      const pass = document.getElementById('auth-setup-pass').value;
      localStorage.setItem(AUTH_KEY, JSON.stringify({ alias, url, pass }));
      if (url) {
        state.masSheetConfig.webAppUrl = url;
        localStorage.setItem(SAVED_URL_KEY, url);
      }
      isSessionUnlocked = true;
      saveState(true);
      renderAuthGate();
      render();
      if (url) {
        syncMasFromGoogleSheet(true).then(() => backupEcoToGoogleSheet(true));
      }
    }

    async function submitWorkspaceLogin(e) {
      e.preventDefault();
      const cfg = getAuthConfig();
      const userVal = document.getElementById('auth-login-user').value.trim();
      const passVal = document.getElementById('auth-login-pass').value;
      const isUrl = userVal.startsWith('https://script.google.com/');

      // Nếu thiết bị mới (chưa có cfg) nhưng dán Web App URL -> kiểm tra trực tiếp mật khẩu từ Cloud Backup
      if (!cfg && isUrl) {
        try {
          const sep = userVal.includes('?') ? '&' : '?';
          const bRes = await fetch(`${userVal}${sep}sheet=Workspace_Backup`).then((r) => r.json());
          const cloudAuth = bRes?.payload?.__auth;
          if (cloudAuth && cloudAuth.pass && cloudAuth.pass !== passVal) {
            showToast('Sai mật khẩu của tài khoản trên Cloud!', 'error');
            return;
          }
          localStorage.setItem(AUTH_KEY, JSON.stringify({
            alias: cloudAuth?.alias || 'mas_eco',
            url: userVal,
            pass: passVal
          }));
          state.masSheetConfig.webAppUrl = userVal;
          localStorage.setItem(SAVED_URL_KEY, userVal);
          isSessionUnlocked = true;
          saveState(true);
          renderAuthGate();
          render();
          await syncMasFromGoogleSheet(true);
          showToast('Đã đăng nhập & đồng bộ toàn bộ dữ liệu từ Cloud!', 'success');
          return;
        } catch (err) {
          showToast('Không kết nối được Web App URL này!', 'error');
          return;
        }
      }

      const userOk = isUrl || (cfg && userVal.toLowerCase() === String(cfg.alias || '').toLowerCase());
      const passOk = cfg && passVal === cfg.pass;

      if (!userOk || !passOk) {
        showToast('Sai từ khóa đăng nhập hoặc mật khẩu!', 'error');
        return;
      }
      const targetUrl = isUrl ? userVal : (cfg.url || state.masSheetConfig.webAppUrl);
      if (targetUrl) {
        state.masSheetConfig.webAppUrl = targetUrl;
        localStorage.setItem(SAVED_URL_KEY, targetUrl);
      }
      isSessionUnlocked = true;
      saveState(true);
      renderAuthGate();
      render();
      if (targetUrl) syncMasFromGoogleSheet(true);
    }

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const el = document.createElement('div');
      const cls = type === 'success'
        ? 'bg-emerald-600 text-white'
        : type === 'error'
          ? 'bg-rose-600 text-white'
          : 'bg-slate-900 text-white dark:bg-white dark:text-slate-900';
      el.className = `px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold ${cls} transition-opacity`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3200);
    }

    function copyTextToClipboard(text, toastMsg = 'Đã copy!') {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(toastMsg, 'success'); } catch (e) {}
      ta.remove();

    function saveMasWebAppUrl(val) {

    async function syncMasFromGoogleSheet(silent = false) {
      const webAppUrl = (state.masSheetConfig?.webAppUrl || '').trim();
      if (!webAppUrl) {
        if (!silent) showToast('Vui lòng dán Google Apps Script Web App URL trước!', 'error');
        return;
      }
      const btn = document.getElementById('btn-sync-mas');
      if (btn) { btn.disabled = true; btn.textContent = 'Đang đồng bộ...'; }
      try {
        const sep = webAppUrl.includes('?') ? '&' : '?';
        const tabs = ['MAS_Summary', 'FB_Ads', 'FB_Ads_Audience', 'FB_Ads_Demo', 'FB_Ads_Product', 'GG_Ads_Creative', 'GG_Ads_PMax', 'GG_Ads_Keyword', 'GG_Ads_Product', 'Shopify_Orders'];
        const results = await Promise.all(
          tabs.map((t) => fetch(`${webAppUrl}${sep}sheet=${encodeURIComponent(t)}`).then((r) => r.json()).catch(() => null))
        );
        if (results[0] && Array.isArray(results[0].rows)) {
          state.masSheetConfig.summaryRows = results[0].rows;
          state.masSheetConfig.lastSync = results[0].updatedAt || new Date().toLocaleTimeString('vi-VN');
        }
        ['FB_Ads', 'FB_Ads_Audience', 'FB_Ads_Demo', 'FB_Ads_Product', 'GG_Ads_Creative', 'GG_Ads_PMax', 'GG_Ads_Keyword', 'GG_Ads_Product', 'Shopify_Orders'].forEach((tab, idx) => {
          const res = results[idx + 1];
          if (res && Array.isArray(res.rows)) {
            state.masSheetConfig.deepdive[tab] = res.rows;
          }
        });

        // Tự động Restore luôn bản Workspace_Backup mới nhất khi sync
        try {
          const bRes = await fetch(`${webAppUrl}${sep}sheet=Workspace_Backup`).then((r) => r.json());
          if (bRes && bRes.payload && typeof bRes.payload === 'object') {
            applyCloudPayloadToState(bRes.payload, bRes.savedAt);
          }
        } catch (e) {}

        saveState(true);
        render();
        if (!silent) showToast('Đã đồng bộ MAS & khôi phục bản Backup mới nhất!', 'success');
      } catch (err) {
        if (!silent) showToast(`Lỗi Sync MAS: ${err.message}`, 'error');
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Sync Data MAS ngay'; }
      }
    }

                        <td class="px-3 py-2.5 text-right">${escapeHtml(r[4] || '')}</td>
                        <td class="px-3 py-2.5 text-right">${escapeHtml(r[5] || '')}</td>
                        <td class="px-4 py-2.5 text-slate-400">${escapeHtml(r[6] || '')}</td>
                      </tr>
                    `;
                  }).join('') || '<tr><td colspan="7" class="px-4 py-8 text-center text-slate-400">Dán Web App URL và bấm "Sync Data MAS ngay" để tải bảng tổng hợp.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    let masDeepdiveState = {
      source: 'FB_Ads',
      range: 'L7D',
      from: offsetDate(-7),
      to: offsetDate(-1),
      filter: 'ALL',
      sortBy: 'spend',
      sortDir: 'desc',
      search: '',
      rules: {
        minSpend: 15,
        scaleRoas: 3.5,
        cutRoas: 1.8,
        zeroOrderCutSpend: 20
      }
    };

    function renderMasDeepdive() {
      const cfg = state.masSheetConfig || {};
      const rawRows = (cfg.deepdive && cfg.deepdive[masDeepdiveState.source]) || [];
      const headers = rawRows[0] || [];
      const dataRows = rawRows.slice(1);

      const todayIso = offsetDate(0);
      const yestIso = offsetDate(-1);
      let dFrom = masDeepdiveState.from;
      let dTo = masDeepdiveState.to;
      if (masDeepdiveState.range === 'TODAY') { dFrom = todayIso; dTo = todayIso; }
      else if (masDeepdiveState.range === 'YEST') { dFrom = yestIso; dTo = yestIso; }
      else if (masDeepdiveState.range === 'L7D') { dFrom = offsetDate(-7); dTo = yestIso; }
      else if (masDeepdiveState.range === 'L30D') { dFrom = offsetDate(-30); dTo = yestIso; }
      else if (masDeepdiveState.range === 'ALL') { dFrom = '2000-01-01'; dTo = '2099-12-31'; }

      const daySpan = Math.max(1, Math.round((new Date(dTo) - new Date(dFrom)) / 86400000) + 1);
      const prevTo = formatDateISO(new Date(new Date(dFrom).getTime() - 86400000));
      const prevFrom = formatDateISO(new Date(new Date(prevTo).getTime() - (daySpan - 1) * 86400000));

      const is3ColDim = masDeepdiveState.source === 'GG_Ads_Product' || masDeepdiveState.source === 'FB_Ads_Product';
      const dimIdx = is3ColDim ? 2 : 3;
      const spendIdx = is3ColDim ? 3 : 4;
      const impIdx = is3ColDim ? 4 : 5;
      const clickIdx = is3ColDim ? 5 : 6;
      const convIdx = is3ColDim ? 6 : 7;
      const gmvIdx = is3ColDim ? 7 : 8;

      const curMap = {};
      const prevMap = {};

      dataRows.forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        if (!dt) return;
        const isDemo = masDeepdiveState.source === 'FB_Ads_Demo';
        const isAud = masDeepdiveState.source === 'FB_Ads_Audience';
        const rawDim = isDemo
          ? `${r[2] || 'All'} → ${r[3] || '(Ad)'}`
          : String(r[dimIdx] || r[1] || '(Unknown)').trim();
        const campName = String(r[1] || '').trim();
        const subMeta = isAud
          ? `${r[2] || ''} • ${campName}`
          : isDemo
            ? `Campaign: ${campName}`
            : campName;

        const groupKey = `${campName} ||| ${rawDim}`;
        const rowDedupKey = `${dt} ||| ${groupKey}`;
        if (!curMap.__seen) curMap.__seen = new Set();

        const spend = parseCsvNumber(r[spendIdx]);
        const imp = parseCsvNumber(r[impIdx]);
        const clicks = parseCsvNumber(r[clickIdx]);
        const conv = parseCsvNumber(r[convIdx]);
        const gmv = parseCsvNumber(r[gmvIdx]);

        if (dt >= dFrom && dt <= dTo) {
          if (curMap.__seen.has(rowDedupKey)) return;
          curMap.__seen.add(rowDedupKey);
          if (!curMap[groupKey]) curMap[groupKey] = { name: rawDim, camp: subMeta, spend: 0, imp: 0, clicks: 0, conv: 0, gmv: 0 };
          curMap[groupKey].spend += spend;
          curMap[groupKey].imp += imp;
          curMap[groupKey].clicks += clicks;
          curMap[groupKey].conv += conv;
          curMap[groupKey].gmv += gmv;
        } else if (masDeepdiveState.range !== 'ALL' && dt >= prevFrom && dt <= prevTo) {
          if (!prevMap.__seen) prevMap.__seen = new Set();
          if (prevMap.__seen.has(rowDedupKey)) return;
          prevMap.__seen.add(rowDedupKey);
          if (!prevMap[groupKey]) prevMap[groupKey] = { spend: 0, gmv: 0 };
          prevMap[groupKey].spend += spend;
          prevMap[groupKey].gmv += gmv;
        }
      });
      delete curMap.__seen;
      delete prevMap.__seen;

      const rules = masDeepdiveState.rules;
      let items = Object.entries(curMap).map(([gKey, it]) => {
        const roas = it.spend > 0 ? it.gmv / it.spend : 0;
        const cpm = it.imp > 0 ? (it.spend / it.imp) * 1000 : 0;
        const ctr = it.imp > 0 ? (it.clicks / it.imp) * 100 : 0;
        const cvr = it.clicks > 0 ? (it.conv / it.clicks) * 100 : 0;
        const prev = prevMap[gKey];
        const prevRoas = prev && prev.spend > 0 ? prev.gmv / prev.spend : null;
        const roasDelta = prevRoas && prevRoas > 0 ? ((roas - prevRoas) / prevRoas) * 100 : null;

        let badge = { text: 'TEST • Đang học', cls: 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300', type: 'TEST' };
        if (it.spend >= rules.zeroOrderCutSpend && it.conv === 0) {
          badge = { text: 'CUT • 0 đơn', cls: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300', type: 'CUT' };
        } else if (it.spend >= rules.minSpend && roas < rules.cutRoas) {
          badge = { text: `CUT • ROAS < ${rules.cutRoas}x`, cls: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300', type: 'CUT' };
        } else if (it.spend >= rules.minSpend && roas >= rules.scaleRoas) {
          badge = { text: 'SCALE • +25% Budget', cls: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300', type: 'SCALE' };
        }

        return { ...it, roas, cpm, ctr, cvr, prevRoas, roasDelta, badge };
      });

      const counts = {
        ALL: items.length,
        SCALE: items.filter((i) => i.badge.type === 'SCALE').length,
        CUT: items.filter((i) => i.badge.type === 'CUT').length,
        TEST: items.filter((i) => i.badge.type === 'TEST').length
      };

      if (masDeepdiveState.search) {
        const q = masDeepdiveState.search.toLowerCase();
        items = items.filter((i) => i.name.toLowerCase().includes(q) || i.camp.toLowerCase().includes(q));
      }
      if (masDeepdiveState.filter !== 'ALL') {
        items = items.filter((i) => i.badge.type === masDeepdiveState.filter);
      }

      const sKey = masDeepdiveState.sortBy;
      const sDir = masDeepdiveState.sortDir === 'asc' ? 1 : -1;
      items.sort((a, b) => ((a[sKey] || 0) - (b[sKey] || 0)) * sDir);

      const totSpend = items.reduce((s, i) => s + i.spend, 0);
      const totGmv = items.reduce((s, i) => s + i.gmv, 0);
      const totConv = items.reduce((s, i) => s + i.conv, 0);
      const totRoas = totSpend > 0 ? totGmv / totSpend : 0;

      const sortTh = (key, label) => {
        const active = masDeepdiveState.sortBy === key;
        const arrow = active ? (masDeepdiveState.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
        return `<th onclick="if(masDeepdiveState.sortBy==='${key}'){masDeepdiveState.sortDir=masDeepdiveState.sortDir==='desc'?'asc':'desc';}else{masDeepdiveState.sortBy='${key}';masDeepdiveState.sortDir='desc';} render();" class="px-3 py-3 text-right cursor-pointer hover:text-indigo-600 select-none">${label}${arrow}</th>`;
      };

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-1.5">
                ${[
                  { id: 'FB_Ads', label: 'FB (Creative)' },
                  { id: 'FB_Ads_Audience', label: 'FB (LAL / Custom / Interest)' },
                  { id: 'FB_Ads_Demo', label: 'FB (Tuổi × Giới × Content)' },
                  { id: 'FB_Ads_Product', label: 'FB (Catalog Product)' },
                  { id: 'GG_Ads_Creative', label: 'GG (Creative)' },
                  { id: 'GG_Ads_PMax', label: 'GG (PMax Assets)' },
                  { id: 'GG_Ads_Keyword', label: 'GG (Keyword)' },
                  { id: 'GG_Ads_Product', label: 'GG (Product)' }
                ].map((src) => `
                  <button onclick="masDeepdiveState.source='${src.id}'; render();" class="px-3 py-1.5 rounded-xl font-bold transition ${masDeepdiveState.source === src.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${src.label}</button>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                ${[
                  { id: 'TODAY', label: 'Today' },
                  { id: 'YEST', label: 'Yesterday' },
                  { id: 'L7D', label: 'Last 7D' },
                  { id: 'L30D', label: 'Last 30D' },
                  { id: 'ALL', label: 'All-Time' },
                  { id: 'CUSTOM', label: 'Chọn ngày' }
                ].map((rg) => `
                  <button onclick="masDeepdiveState.range='${rg.id}'; render();" class="px-2.5 py-1.5 rounded-lg font-bold transition ${masDeepdiveState.range === rg.id ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}">${rg.label}</button>
                `).join('')}
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-slate-500">Rule tự động:</span>
                <label class="flex items-center gap-1 bg-slate-50 dark:bg-slate-800 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700">
                  <span>Min Spend $</span>
                  <input type="number" step="1" value="${rules.minSpend}" onchange="masDeepdiveState.rules.minSpend=Number(this.value)||0; render();" class="w-12 bg-transparent font-bold text-right" />
                </label>
                <label class="flex items-center gap-1 bg-emerald-50 dark:bg-emerald-950/40 px-2 py-1 rounded-lg border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300">
                  <span>Scale ROAS ≥</span>
                  <input type="number" step="0.1" value="${rules.scaleRoas}" onchange="masDeepdiveState.rules.scaleRoas=Number(this.value)||0; render();" class="w-12 bg-transparent font-bold text-right" />x
                </label>
                <label class="flex items-center gap-1 bg-rose-50 dark:bg-rose-950/40 px-2 py-1 rounded-lg border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300">
                  <span>Cut ROAS &lt;</span>
                  <input type="number" step="0.1" value="${rules.cutRoas}" onchange="masDeepdiveState.rules.cutRoas=Number(this.value)||0; render();" class="w-12 bg-transparent font-bold text-right" />x
                </label>
                <label class="flex items-center gap-1 bg-rose-50 dark:bg-rose-950/40 px-2 py-1 rounded-lg border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300">
                  <span>0 đơn Cut ≥ $</span>
                  <input type="number" step="1" value="${rules.zeroOrderCutSpend}" onchange="masDeepdiveState.rules.zeroOrderCutSpend=Number(this.value)||0; render();" class="w-12 bg-transparent font-bold text-right" />
                </label>
              </div>
              <input value="${escapeHtml(masDeepdiveState.search)}" oninput="masDeepdiveState.search=this.value; render();" placeholder="Tìm creative / tệp / product..." class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 w-60" />
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
              <div class="flex flex-wrap items-center gap-1.5">
                ${[
                  { id: 'ALL', label: `Tất cả (${counts.ALL})`, cls: 'bg-slate-200 text-slate-800 dark:bg-slate-700 dark:text-white' },
                  { id: 'SCALE', label: `SCALE (${counts.SCALE})`, cls: 'bg-emerald-600 text-white' },
                  { id: 'CUT', label: `CUT (${counts.CUT})`, cls: 'bg-rose-600 text-white' },
                  { id: 'TEST', label: `TEST (${counts.TEST})`, cls: 'bg-sky-600 text-white' }
                ].map((fl) => `
                  <button onclick="masDeepdiveState.filter='${fl.id}'; render();" class="px-3 py-1 rounded-lg font-bold transition ${masDeepdiveState.filter === fl.id ? fl.cls : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">${fl.label}</button>
                `).join('')}
              </div>

              <div>
                ${masDeepdiveState.range === 'CUSTOM' ? `
                  <div class="flex items-center gap-1.5">
                    <input type="date" value="${dFrom}" onchange="masDeepdiveState.from=this.value; render();" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                    <span>→</span>
                    <input type="date" value="${dTo}" onchange="masDeepdiveState.to=this.value; render();" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                  </div>
                ` : `<span class="text-slate-500">Kỳ: <strong>${dFrom}</strong> → <strong>${dTo}</strong></span>`}
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
            <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="text-slate-400">Tổng Spend (đã lọc)</div>
              <div class="text-base font-extrabold text-indigo-600 mt-0.5">$${totSpend.toFixed(2)}</div>
            </div>
            <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="text-slate-400">Tổng GMV</div>
              <div class="text-base font-extrabold text-emerald-600 mt-0.5">$${totGmv.toFixed(2)}</div>
            </div>
            <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="text-slate-400">Blended ROAS</div>
              <div class="text-base font-extrabold mt-0.5">${totRoas.toFixed(2)}x</div>
            </div>
            <div class="p-3.5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
              <div class="text-slate-400">Tổng Đơn / Conversions</div>
              <div class="text-base font-extrabold mt-0.5">${Math.round(totConv).toLocaleString('en-US')}</div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-3">${is3ColDim ? 'Product' : masDeepdiveState.source === 'FB_Ads_Audience' ? 'Chi tiết Tệp / Interest / Demo' : masDeepdiveState.source === 'FB_Ads_Demo' ? 'Độ tuổi × Giới tính → Content' : masDeepdiveState.source === 'GG_Ads_PMax' ? 'PMax Asset (Text / Image / Video) & Rating' : 'Creative / Keyword'}</th>
                    ${sortTh('spend', 'Spend ($)')}
                    ${sortTh('gmv', 'GMV ($)')}
                    ${sortTh('roas', 'ROAS')}
                    <th class="px-3 py-3 text-right">vs Prev</th>
                    ${sortTh('cpm', 'CPM ($)')}
                    ${sortTh('ctr', 'CTR')}
                    ${sortTh('cvr', 'CVR')}
                    ${sortTh('conv', 'Orders')}
                    <th class="px-3 py-3">Rule Action</th>
                    <th class="px-4 py-3 text-right">Giao việc</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${items.slice(0, 80).map((it) => `
                    <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 align-top">
                      <td class="px-4 py-2.5 min-w-[260px] max-w-[380px] whitespace-normal break-words">
                        <div class="font-bold leading-snug">${escapeHtml(it.name)}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5 leading-snug">${escapeHtml(it.camp)}</div>
                      </td>
                      <td class="px-3 py-2.5 text-right font-semibold whitespace-nowrap">$${it.spend.toFixed(2)}</td>
                      <td class="px-3 py-2.5 text-right font-bold text-emerald-600">$${it.gmv.toFixed(2)}</td>
                      <td class="px-3 py-2.5 text-right font-extrabold ${it.roas >= rules.scaleRoas ? 'text-emerald-600' : it.roas < rules.cutRoas ? 'text-rose-600' : ''}">${it.roas.toFixed(2)}x</td>
                      <td class="px-3 py-2.5 text-right text-[11px] ${it.roasDelta === null ? 'text-slate-400' : it.roasDelta >= 0 ? 'text-emerald-600 font-semibold' : 'text-rose-600 font-semibold'}">${it.roasDelta === null ? '—' : `${it.roasDelta >= 0 ? '+' : ''}${it.roasDelta.toFixed(0)}%`}</td>
                      <td class="px-3 py-2.5 text-right">$${it.cpm.toFixed(2)}</td>
                      <td class="px-3 py-2.5 text-right">${it.ctr.toFixed(2)}%</td>
                      <td class="px-3 py-2.5 text-right">${it.cvr.toFixed(2)}%</td>
                      <td class="px-3 py-2.5 text-right">${Math.round(it.conv)}</td>
                      <td class="px-3 py-2.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${it.badge.cls}">${it.badge.text}</span></td>
                      <td class="px-4 py-2.5 text-right whitespace-nowrap space-x-1">
                        <button onclick="openPushMasTaskModal('${escapeHtml(it.name)}', '${escapeHtml(it.badge.text)}', ${it.spend.toFixed(2)}, ${it.roas.toFixed(2)})" class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 dark:bg-indigo-950/50 dark:text-indigo-300 text-[10px] font-bold hover:bg-indigo-100">+ Task</button>
                        <button onclick="openPushMasContentModal('${escapeHtml(it.name)}', ${it.roas.toFixed(2)})" class="px-2 py-1 rounded-lg bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 text-[10px] font-bold hover:bg-slate-200">+ Brief</button>
                      </td>
                    </tr>
                  `).join('') || `<tr><td colspan="11" class="px-4 py-8 text-center text-slate-400">${headers.length ? 'Không có bản ghi khớp bộ lọc.' : 'Chưa có dữ liệu tab này. Hãy cập nhật Apps Script & bấm "Sync Data MAS ngay".'}</td></tr>`}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function openPushMasTaskModal(name, reason, spend, roas) {
      openModal(`
        <h3 class="text-base font-bold mb-3">Tùy chỉnh Task từ Deepdive</h3>
        <form onsubmit="submitPushMasTask(event)" class="space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Nội dung Task</label>
            <input id="pmt-title" required value="[${reason}] ${escapeHtml(name)} (Spend $${spend} • ROAS ${roas}x)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-semibold" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-bold block mb-1">Mức ưu tiên</label>
              <select id="pmt-prio" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                <option value="High" selected>High (Gấp)</option>
                <option value="Medium">Medium</option>
              </select>
            </div>
            <div>
              <label class="font-bold block mb-1">Deadline</label>
              <input id="pmt-due" type="date" value="${offsetDate(0)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Lưu vào Task Manager</button>
          </div>
        </form>
      `);
    }

    function submitPushMasTask(e) {
      e.preventDefault();
      state.tasks.unshift({
        id: 't_' + Date.now(),
        title: document.getElementById('pmt-title').value.trim(),
        project: 'MAS',
        tag: 'Ads',
        status: 'To Do',
        priority: document.getElementById('pmt-prio').value,
        due: document.getElementById('pmt-due').value,
        focus: true,
        done: false
      });
      saveState();
      closeModal();
      showToast('Đã tạo Focus Task MAS!', 'success');
    }

    function openPushMasContentModal(name, roas) {
      const defChannel = masDeepdiveState.source.startsWith('FB') ? 'FB Ads' : 'Google Ads';
      openModal(`
        <h3 class="text-base font-bold mb-3">Tùy chỉnh Order Content từ Deepdive</h3>
        <form onsubmit="submitPushMasContent(event)" class="space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Angle / Đề bài Creative</label>
            <input id="pmc-title" required value="Biến thể mới từ: ${escapeHtml(name)} (ROAS ${roas}x)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-semibold" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-bold block mb-1">Kênh</label>
              <select id="pmc-channel" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                <option ${defChannel === 'FB Ads' ? 'selected' : ''}>FB Ads</option>
                <option ${defChannel === 'Google Ads' ? 'selected' : ''}>Google Ads</option>
                <option>TikTok / Live</option>
              </select>
            </div>

              <label class="font-bold block mb-1">Deadline</label>

    let shopifyMixState = {
      range: 'ALL',
      channelFilter: 'ALL'
    };

    function renderMasShopifyMix() {
      const rawRows = (state.masSheetConfig?.deepdive?.Shopify_Orders) || [];
      const dataRows = rawRows.slice(1);
      let dFrom = '2000-01-01';
      let dTo = '2099-12-31';
      if (shopifyMixState.range === 'L7D') { dFrom = offsetDate(-7); dTo = offsetDate(0); }
      else if (shopifyMixState.range === 'L30D') { dFrom = offsetDate(-30); dTo = offsetDate(0); }

      const prodMap = {};
      const ordersMap = {};

      dataRows.forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        if (!dt || dt < dFrom || dt > dTo) return;
        const oid = String(r[1] || '').trim();
        const ch = String(r[4] || '').trim();
        if (shopifyMixState.channelFilter !== 'ALL' && ch !== shopifyMixState.channelFilter) return;

        const prod = String(r[6] || '').trim();
        const qty = parseCsvNumber(r[7]);
        const netSales = parseCsvNumber(r[8]);
        const orderGmv = parseCsvNumber(r[9]);
        const seg = String(r[11] || '').includes('LTV') ? 'LTV' : 'CAC';

        if (!prod) return;
        if (!prodMap[prod]) {
          prodMap[prod] = {
            name: prod,
            cacQty: 0,
            cacRev: 0,
            cacOrders: new Set(),
            ltvQty: 0,
            ltvRev: 0,
            ltvOrders: new Set()
          };
        }
        if (seg === 'CAC') {
          prodMap[prod].cacQty += qty;
          prodMap[prod].cacRev += netSales;
          if (oid) prodMap[prod].cacOrders.add(oid);
        } else {
          prodMap[prod].ltvQty += qty;
          prodMap[prod].ltvRev += netSales;
          if (oid) prodMap[prod].ltvOrders.add(oid);
        }

        if (oid) {
          if (!ordersMap[oid]) ordersMap[oid] = { oid, seg, gmv: 0, items: new Set() };
          ordersMap[oid].gmv += orderGmv;
          ordersMap[oid].items.add(prod);
        }
      });

      const products = Object.values(prodMap).map((p) => {
        const totQty = p.cacQty + p.ltvQty;
        const totRev = p.cacRev + p.ltvRev;
        const ltvShare = totRev > 0 ? (p.ltvRev / totRev) * 100 : 0;
        return {
          ...p,
          cacOrderCnt: p.cacOrders.size,
          ltvOrderCnt: p.ltvOrders.size,
          totQty,
          totRev,
          ltvShare
        };
      });

      const topCac = products.slice().filter((p) => p.cacQty > 0).sort((a, b) => b.cacQty - a.cacQty);
      const topLtv = products.slice().filter((p) => p.ltvQty > 0).sort((a, b) => b.ltvQty - a.ltvQty);

      // Market Basket Analysis (Mix Cart Pairs)
      const pairMap = {};
      let multiItemOrders = 0;
      Object.values(ordersMap).forEach((ord) => {
        const arr = Array.from(ord.items).sort();
        if (arr.length < 2) return;
        multiItemOrders++;
        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            const key = `${arr[i]} ||| ${arr[j]}`;
            if (!pairMap[key]) pairMap[key] = { prodA: arr[i], prodB: arr[j], count: 0, cacCount: 0, ltvCount: 0, totalCartGmv: 0 };
            pairMap[key].count++;
            if (ord.seg === 'CAC') pairMap[key].cacCount++;
            else pairMap[key].ltvCount++;
            pairMap[key].totalCartGmv += ord.gmv;
          }
        }
      });
      const topPairs = Object.values(pairMap).sort((a, b) => b.count - a.count);

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="font-bold text-slate-500 mr-1">Khoảng thời gian:</span>
              ${[
                { id: 'L7D', label: 'Last 7D' },
                { id: 'L30D', label: 'Last 30D' },
                { id: 'ALL', label: 'Toàn bộ lịch sử Sheet' }
              ].map((rg) => `
                <button onclick="shopifyMixState.range='${rg.id}'; render();" class="px-3 py-1.5 rounded-xl font-bold ${shopifyMixState.range === rg.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${rg.label}</button>
              `).join('')}
            </div>

            <div class="flex items-center gap-2">
              <span class="text-slate-400">Kênh:</span>
              <select onchange="shopifyMixState.channelFilter=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                <option value="ALL" ${shopifyMixState.channelFilter === 'ALL' ? 'selected' : ''}>Tất cả kênh Shopify</option>
                <option value="Facebook" ${shopifyMixState.channelFilter === 'Facebook' ? 'selected' : ''}>Facebook</option>
                <option value="Google" ${shopifyMixState.channelFilter === 'Google' ? 'selected' : ''}>Google</option>
                <option value="Email" ${shopifyMixState.channelFilter === 'Email' ? 'selected' : ''}>Email</option>
                <option value="Direct / Unknown" ${shopifyMixState.channelFilter === 'Direct / Unknown' ? 'selected' : ''}>Direct / Unknown</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 text-xs">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-indigo-50/50 dark:bg-indigo-950/20">
                <div>
                  <h3 class="font-extrabold text-indigo-700 dark:text-indigo-300">Top Product CAC (Khách mua lần đầu)</h3>
                  <p class="text-[11px] text-slate-500">Hero SKU kéo khách mới tốt nhất → Ưu tiên chạy Ads Acquisition</p>
                </div>
                <span class="px-2.5 py-1 rounded-lg bg-indigo-100 text-indigo-700 font-bold">${topCac.length} SKU</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                    <tr>
                      <th class="px-4 py-2.5">Sản phẩm</th>
                      <th class="px-3 py-2.5 text-right">SL Bán (Lần 1)</th>
                      <th class="px-3 py-2.5 text-right">Số đơn</th>
                      <th class="px-4 py-2.5 text-right">Doanh thu CAC</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    ${topCac.slice(0, 12).map((p) => `
                      <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 align-top">
                        <td class="px-4 py-2.5 font-bold min-w-[200px] max-w-[300px] whitespace-normal break-words leading-snug">${escapeHtml(p.name)}</td>
                        <td class="px-3 py-2.5 text-right font-extrabold text-indigo-600">${p.cacQty}</td>
                        <td class="px-3 py-2.5 text-right">${p.cacOrderCnt}</td>
                        <td class="px-4 py-2.5 text-right font-semibold">$${p.cacRev.toFixed(2)}</td>
                      </tr>
                    `).join('') || '<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Chưa có dữ liệu đơn hàng lần đầu. Hãy chạy Sync Shopify trên Sheet!</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-emerald-50/50 dark:bg-emerald-950/20">
                <div>
                  <h3 class="font-extrabold text-emerald-700 dark:text-emerald-300">Top Product LTV (Khách mua từ lần 2+)</h3>
                  <p class="text-[11px] text-slate-500">Sản phẩm giữ chân khách quay lại → Đẩy Retargeting &amp; Email Flow</p>
                </div>
                <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700 font-bold">${topLtv.length} SKU</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left">
                  <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                    <tr>
                      <th class="px-4 py-2.5">Sản phẩm</th>
                      <th class="px-3 py-2.5 text-right">SL Bán (Lần 2+)</th>
                      <th class="px-3 py-2.5 text-right">% Tỷ trọng LTV</th>
                      <th class="px-4 py-2.5 text-right">Doanh thu LTV</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    ${topLtv.slice(0, 12).map((p) => `
                      <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 align-top">
                        <td class="px-4 py-2.5 font-bold min-w-[200px] max-w-[300px] whitespace-normal break-words leading-snug">${escapeHtml(p.name)}</td>
                        <td class="px-3 py-2.5 text-right font-extrabold text-emerald-600">${p.ltvQty}</td>
                        <td class="px-3 py-2.5 text-right font-semibold">${p.ltvShare.toFixed(0)}%</td>
                        <td class="px-4 py-2.5 text-right font-semibold">$${p.ltvRev.toFixed(2)}</td>
                      </tr>
                    `).join('') || '<tr><td colspan="4" class="px-4 py-8 text-center text-slate-400">Chưa có dữ liệu đơn hàng lặp lại (Lần 2+).</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden text-xs">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 class="font-extrabold">Mix Cart Analysis — Cặp sản phẩm hay mua cùng nhau (Upsell &amp; Cross-sell)</h3>
                <p class="text-[11px] text-slate-500">Quét từ <strong>${multiItemOrders}</strong> giỏ hàng có từ 2 sản phẩm trở lên để tìm combo tăng AOV</p>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-2.5">Sản phẩm A</th>
                    <th class="px-3 py-2.5">Mua kèm Sản phẩm B</th>
                    <th class="px-3 py-2.5 text-right">Số giỏ mua chung</th>
                    <th class="px-3 py-2.5 text-right">Đơn CAC / LTV</th>

                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${topPairs.slice(0, 15).map((pair) => {
                    const avgCart = pair.count > 0 ? pair.totalCartGmv / pair.count : 0;
                    const suggest = pair.ltvCount > pair.cacCount
                      ? 'Post-purchase Upsell / Email Bundle'
                      : 'In-Cart Cross-sell / Combo lần đầu';
                    return `
                      <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 align-top">
                        <td class="px-4 py-2.5 font-bold min-w-[220px] max-w-[320px] whitespace-normal break-words leading-snug">${escapeHtml(pair.prodA)}</td>

    function getEcoMonthRows(mk) {
      if (state.ecoMonthlyTargets && Array.isArray(state.ecoMonthlyTargets[mk]) && state.ecoMonthlyTargets[mk].length) {
        return state.ecoMonthlyTargets[mk];
      }
      return state.ecoTracking;
    }

    function syncEcoTrackingFromDailyActuals(mk) {
      const rows = getEcoMonthRows(mk);
      const monthDaily = (state.ecoDailyActuals && state.ecoDailyActuals[mk]) || {};
      rows.forEach((r) => {
        const key = `${r.brand} — ${r.format}`;
        const list = monthDaily[key];
        if (Array.isArray(list) && list.length) {
          r.spend = list.reduce((s, d) => s + (Number(d.spend) || 0), 0);
          r.revenue = list.reduce((s, d) => s + (Number(d.revenue) || 0), 0);
        }
      });
      if (!state.ecoMonthlyTargets) state.ecoMonthlyTargets = {};
      state.ecoMonthlyTargets[mk] = rows;
      state.ecoTracking = rows;
    }

    function changeEcoTrackingMonth(mk) {
      state.ecoTrackingMonth = mk;
      if (!state.ecoMonthlyTargets) state.ecoMonthlyTargets = {};

    function submitDailyActualPaste(e) {
      e.preventDefault();

        else if (rawT === 'MG' || rawT === 'MEGA') tier = 'Mega';

          parsedDays.push({ date: dt, tier, spend, revenue });

    let ecoRephaseState = {
      channel: 'OAP Skin — Livestream',
      mode: 'balanced',
      customBudget: null,
      customSpent: null
    };

    function getRephasingBaseline(channel, mk) {
      const rows = getEcoMonthRows(mk);
      const [brand, format] = channel.split(' — ');
      const targetRow = rows.find((r) => r.brand === brand && r.format === format) || rows[0];
      const streamObj = FLIGHTING_STREAMS.find((s) => s.brand === brand && s.format === format) || FLIGHTING_STREAMS[0];

      const totalBudget = targetRow ? (targetRow.target * (targetRow.maxCir / 100)) : 0;
      const actualSpent = targetRow ? targetRow.spend : 0;
      const actualRev = targetRow ? targetRow.revenue : 0;
      const maxCir = targetRow ? targetRow.maxCir : 14.0;
      const targetGmv = targetRow ? targetRow.target : 0;

      const dailyList = (state.ecoDailyActuals?.[mk]?.[channel]) || [];
      const tiers = ['BAU', 'Campaign', 'Mega', 'SMG'];
      const tierStats = {};

      let numWithin = 0;
      let denWithin = 0;
      tiers.forEach((t) => {
        const sub = dailyList.filter((d) => (d.tier || getTierForDate(streamObj.id, d.date)) === t && d.spend > 0 && d.revenue > 0);
        if (sub.length >= 2) {
          const lnS = sub.map((d) => Math.log(d.spend));
          const lnG = sub.map((d) => Math.log(d.revenue));
          const mS = lnS.reduce((a, b) => a + b, 0) / lnS.length;
          const mG = lnG.reduce((a, b) => a + b, 0) / lnG.length;
          for (let i = 0; i < sub.length; i++) {
            numWithin += (lnS[i] - mS) * (lnG[i] - mG);
            denWithin += (lnS[i] - mS) * (lnS[i] - mS);
          }
        }
      });
      const rawBeta = denWithin > 0 ? numWithin / denWithin : 0.76;
      const baseBeta = Math.max(0.55, Math.min(0.88, rawBeta));

      const defaultMultipliers = { BAU: 1.0, Campaign: 1.5, Mega: 2.2, SMG: 3.0 };
      const fallbackDailySpend = totalBudget > 0 ? totalBudget / 35 : 5000000;
      const fallbackRoas = actualSpent > 0 && actualRev > 0 ? actualRev / actualSpent : (maxCir > 0 ? 100 / maxCir : 7);

      tiers.forEach((t, idx) => {
        const sub = dailyList.filter((d) => (d.tier || getTierForDate(streamObj.id, d.date)) === t && d.spend > 0);
        const beta = Math.max(0.52, Math.min(0.88, baseBeta + (idx - 1) * 0.02));
        if (sub.length) {
          const avgSpend = sub.reduce((s, d) => s + d.spend, 0) / sub.length;
          const avgGmv = sub.reduce((s, d) => s + d.revenue, 0) / sub.length;
          const cir = avgGmv > 0 ? (avgSpend / avgGmv) * 100 : maxCir;
          const roas = avgSpend > 0 ? avgGmv / avgSpend : fallbackRoas;
          const sortedSpends = sub.map((d) => d.spend).sort((a, b) => a - b);
          const p80 = sortedSpends[Math.min(sortedSpends.length - 1, Math.floor(sortedSpends.length * 0.8))];
          const feasibleCap = Math.min(avgSpend * 1.30, p80 * 1.15);
          tierStats[t] = {
            count: sub.length,
            isEstimated: false,
            avgSpend,
            avgGmv,
            cir,
            roas,
            beta,
            mRoas: beta * roas,
            feasibleCap
          };
        } else {
          const mult = defaultMultipliers[t];
          const avgSpend = fallbackDailySpend * mult;
          const avgGmv = avgSpend * fallbackRoas;
          tierStats[t] = {
            count: 0,
            isEstimated: true,
            avgSpend,
            avgGmv,
            cir: fallbackRoas > 0 ? 100 / fallbackRoas : maxCir,
            roas: fallbackRoas,
            beta,
            mRoas: beta * fallbackRoas,
            feasibleCap: avgSpend * 1.25
          };
        }
      });

      const bauBase = tierStats.BAU.avgSpend * Math.max(0.5, tierStats.BAU.mRoas);
      tiers.forEach((t) => {
        const cur = tierStats[t];
        const rawW = bauBase > 0 ? (cur.avgSpend * Math.max(0.5, cur.mRoas)) / bauBase : defaultMultipliers[t];
        cur.normWeight = t === 'BAU' ? 1.0 : Math.max(1.1, rawW);
      });

      return { targetRow, streamObj, totalBudget, actualSpent, actualRev, maxCir, targetGmv, dailyList, baseBeta, tierStats };
    }

    function renderEcoRephasing() {
      const mk = state.ecoTrackingMonth || getCurrentMonthKey();
      syncEcoTrackingFromDailyActuals(mk);
      const info = getRephasingBaseline(ecoRephaseState.channel, mk);

      const budget = ecoRephaseState.customBudget !== null ? ecoRephaseState.customBudget : Math.round(info.totalBudget);
      const spent = ecoRephaseState.customSpent !== null ? ecoRephaseState.customSpent : Math.round(info.actualSpent);

      const [yy, mm] = mk.split('-').map(Number);
      const daysInMonth = new Date(yy, mm, 0).getDate();
      const lastActualDay = info.dailyList.length
        ? Math.max(...info.dailyList.map((d) => Number(d.date.slice(8, 10))))
        : 23;

      const remDays = [];
      for (let d = lastActualDay + 1; d <= daysInMonth; d++) {
        const dt = `${mk}-${String(d).padStart(2, '0')}`;
        const tier = getTierForDate(info.streamObj.id, dt);
        remDays.push({ date: dt, tier });
      }

      const rawRemBudget = Math.max(0, budget - spent);
      const curCir = info.actualRev > 0 ? (spent / info.actualRev) * 100 : 0;
      let targetRemBudget = rawRemBudget;
      let gamma = 1.0;

      if (ecoRephaseState.mode === 'max_gmv') {
        gamma = 2.0;
        if (curCir > 0 && curCir < info.maxCir) {
          targetRemBudget = rawRemBudget * 1.15;
        }
      } else if (ecoRephaseState.mode === 'strict_cir') {
        gamma = 1.8;
        if (curCir > info.maxCir) {
          targetRemBudget = rawRemBudget * 0.72;
        } else {
          targetRemBudget = rawRemBudget * 0.92;
        }
      }

      const dayWeights = remDays.map((rd) => {
        const st = info.tierStats[rd.tier] || info.tierStats.BAU;
        const cirFactor = st.cir > 0 ? Math.pow(info.maxCir / st.cir, gamma) : 1;
        return st.normWeight * Math.max(0.45, Math.min(2.2, cirFactor));
      });
      const sumW = dayWeights.reduce((a, b) => a + b, 0) || 1;

      let totalAllocRem = 0;
      let totalProjRemGmv = 0;
      const planRows = remDays.map((rd, idx) => {
        const st = info.tierStats[rd.tier] || info.tierStats.BAU;
        const rawAlloc = targetRemBudget * (dayWeights[idx] / sumW);
        const capped = rawAlloc > st.feasibleCap;
        const alloc = Math.min(rawAlloc, st.feasibleCap);
        const projGmv = st.avgSpend > 0 ? st.avgGmv * Math.pow(alloc / st.avgSpend, st.beta) : 0;
        const projCir = projGmv > 0 ? (alloc / projGmv) * 100 : 0;
        totalAllocRem += alloc;
        totalProjRemGmv += projGmv;
        return { ...rd, weight: st.normWeight, alloc, capped, projGmv, projCir };
      });

      const eomSpend = spent + totalAllocRem;
      const eomGmv = info.actualRev + totalProjRemGmv;
      const eomCir = eomGmv > 0 ? (eomSpend / eomGmv) * 100 : 0;
      const eomPacing = info.targetGmv > 0 ? (eomGmv / info.targetGmv) * 100 : 0;
      const unspentDueToCap = Math.max(0, targetRemBudget - totalAllocRem);

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="text-slate-500">
                Nguồn: <strong>${info.dailyList.length} ngày Actual</strong> (${mk}) • Ad Elasticity: <strong class="text-indigo-600">β = ${info.baseBeta.toFixed(2)}</strong> • Trần CIR: <strong>${info.maxCir}%</strong>
              </div>
              <div class="flex items-center gap-2">
                <select onchange="ecoRephaseState.mode=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                  <option value="balanced" ${ecoRephaseState.mode === 'balanced' ? 'selected' : ''}>Chế độ: Cân bằng GMV &amp; Trần CIR</option>
                  <option value="max_gmv" ${ecoRephaseState.mode === 'max_gmv' ? 'selected' : ''}>Chế độ: Tối đa hóa GMV</option>
                  <option value="strict_cir" ${ecoRephaseState.mode === 'strict_cir' ? 'selected' : ''}>Chế độ: Khống chế chặt Trần CIR (${info.maxCir}%)</option>
                </select>
                <button onclick="ecoRephaseState.customBudget=null; ecoRephaseState.customSpent=null; render();" class="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 font-bold">Đồng bộ lại từ Target</button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <div>
                <label class="text-slate-400 block mb-1">Kênh / Brand</label>

    function submitNewIssue(e) {
      e.preventDefault();
      state.ecoIssues.unshift({
        id: 'ei_' + Date.now(),
        channel: document.getElementById('ni-ch').value.trim(),
        issue: document.getElementById('ni-issue').value.trim(),
        rootCause: document.getElementById('ni-rc').value.trim(),
        nextAction: document.getElementById('ni-act').value.trim(),
        pic: 'Squad Eco',
        status: 'Open'
      });
      saveState();
      closeModal();
      render();
      showToast('Đã thêm Issue mới!', 'success');
    }

    function updateIssueStatus(id, val) {
      const it = state.ecoIssues.find((i) => i.id === id);
      if (it) { it.status = val; saveState(); }
    }

    // =========================================================================
    // 6. MA TRẬN TIER THÁNG & KHUNG GIỜ LIVE
    // =========================================================================
    function paintTierCell(streamId, dateIso) {
      if (!state.flighting.grid) state.flighting.grid = {};
      if (!state.flighting.grid[streamId]) state.flighting.grid[streamId] = {};
      state.flighting.grid[streamId][dateIso] = state.flighting.activeBrush || 'Mega';
      saveState();
      render();
    }

    function updateDefaultLiveHours(streamId, tier, val) {
      if (!state.flighting.liveHours) state.flighting.liveHours = {};
      if (!state.flighting.liveHours[streamId]) state.flighting.liveHours[streamId] = {};
      state.flighting.liveHours[streamId][tier] = val.trim();
      saveState();
      showToast(`Đã cập nhật giờ Live ${tier}!`, 'success');
    }

    function openCustomDayLiveHoursModal() {
      const mk = state.flighting?.monthKey || state.ecoTrackingMonth || getCurrentMonthKey();
      openModal(`
        <h3 class="text-base font-bold mb-3">Chỉnh khung giờ Live ngày lẻ (${mk})</h3>
        <form onsubmit="saveCustomDayLiveHours(event)" class="space-y-3 text-xs">

                <option value="lifebuoy_live">Lifebuoy — Livestream</option>
              </select>

              <label class="font-bold block mb-1">Ngày cụ thể</label>
              <input id="cdh-date" type="date" value="${mk}-11" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
          </div>

            <input id="cdh-hours" placeholder="VD: 8h-14h, 19h-24h (11 tiếng)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />

          <div class="flex justify-end gap-2 pt-2">

            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Lưu giờ Live</button>
          </div>
        </form>
      `);
    }

    function saveCustomDayLiveHours(e) {
      e.preventDefault();
      const sid = document.getElementById('cdh-stream').value;
      const dt = document.getElementById('cdh-date').value;
      const hrs = document.getElementById('cdh-hours').value.trim();
      if (!state.flighting.customHours) state.flighting.customHours = {};
      if (!state.flighting.customHours[sid]) state.flighting.customHours[sid] = {};
      if (hrs) state.flighting.customHours[sid][dt] = hrs;
      else delete state.flighting.customHours[sid][dt];
      saveState();
      closeModal();
      render();
      showToast(`Đã lưu giờ Live riêng cho ngày ${dt}!`, 'success');
    }

    function renderFlighting() {
      const mk = state.flighting?.monthKey || state.ecoTrackingMonth || getCurrentMonthKey();
      const [yy, mm] = mk.split('-').map(Number);
      const daysInMonth = new Date(yy, mm, 0).getDate();

      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">

              <span class="font-bold">Tháng Ma trận:</span>
              <input type="month" value="${mk}" onchange="state.flighting.monthKey=this.value; state.ecoTrackingMonth=this.value; saveState(); render();" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
              <span class="text-slate-400 ml-2">Chọn cọ tô:</span>
              ${['BAU', 'Campaign', 'Mega', 'SMG', 'Off'].map((t) => `
                <button onclick="state.flighting.activeBrush='${t}'; render();" class="px-3 py-1.5 rounded-xl font-bold transition ${brush === t ? TIER_META[t].cls + ' ring-2 ring-offset-1 ring-indigo-500' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${t}</button>
              `).join('')}
            </div>
            <button onclick="openCustomDayLiveHoursModal()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white font-semibold">Chỉnh giờ Live ngày lẻ</button>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto no-select" onmouseup="isPaintingTier=false" onmouseleave="isPaintingTier=false">
              <table class="w-full text-center text-[11px] border-collapse">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-3 py-2.5 text-left sticky left-0 bg-slate-50 dark:bg-slate-800 z-10 min-w-[140px]">Brand / Kênh</th>
                    ${days.map((d) => `<th class="px-1.5 py-2.5 min-w-[28px]">${d}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${FLIGHTING_STREAMS.map((st) => `
                    <tr>
                      <td class="px-3 py-2.5 text-left font-bold sticky left-0 bg-white dark:bg-slate-900 z-10 border-r border-slate-100 dark:border-slate-800">
                        <div>${st.brand}</div>
                        <div class="text-[10px] font-normal text-slate-400">${st.format}</div>
                      </td>
                      ${days.map((d) => {
                        const dt = `${mk}-${String(d).padStart(2, '0')}`;
                        const tier = getTierForDate(st.id, dt);
                        const meta = TIER_META[tier] || TIER_META.BAU;
                        const customH = state.flighting?.customHours?.[st.id]?.[dt];
                        const defaultH = state.flighting?.liveHours?.[st.id]?.[tier] || '';
                        const tip = `${dt} • ${tier}${st.isLive ? ' • Giờ Live: ' + (customH || defaultH) : ''}`;
                        return `
                          <td onmousedown="isPaintingTier=true; paintTierCell('${st.id}', '${dt}')" onmouseenter="if(isPaintingTier) paintTierCell('${st.id}', '${dt}')" title="${escapeHtml(tip)}" class="p-0.5 cursor-pointer">
                            <div class="w-6 h-6 mx-auto rounded-md flex items-center justify-center font-extrabold text-[10px] ${meta.cls} ${customH ? 'ring-2 ring-indigo-500' : ''}">${meta.short}</div>

              ${FLIGHTING_STREAMS.filter((s) => s.isLive).map((st) => `
                <div class="p-3 rounded-xl border border-slate-100 dark:border-slate-800 space-y-2">
