<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAS × Eco — Performance Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }
    .no-select { user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased">

  <!-- Login / Workspace Gate Overlay -->
  <div id="auth-gate" class="fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-7 space-y-5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-base shadow-md">M×E</div>
        <div>
          <h2 class="text-base font-extrabold">MAS × Eco Command Center</h2>
          <p class="text-xs text-slate-500">Đăng nhập bằng từ khóa Web App URL &amp; mật khẩu cá nhân</p>
        </div>
      </div>
      <div id="auth-gate-body"></div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="flex min-h-screen w-full">
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden" onclick="toggleMobileSidebar(false)"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between transition-transform duration-200 -translate-x-full lg:translate-x-0 shrink-0">
      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-xs shadow-sm">M×E</div>
          <div>
            <div class="text-xs font-extrabold tracking-tight">MAS × Eco</div>
            <div class="text-[10px] text-slate-400">Command Center</div>
          </div>
        </div>
        <button onclick="toggleMobileSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <nav id="sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>

      <div class="p-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div id="cloud-sync-badge" class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 text-[10px] text-slate-500 flex items-center justify-between">
          <span>Cloud Auto-Save</span>
          <span id="cloud-sync-time" class="font-semibold text-emerald-600 dark:text-emerald-400">Sẵn sàng</span>
        </div>
        <button onclick="openReportModal()" class="w-full px-3 py-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold hover:opacity-90 flex items-center justify-center gap-2">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 1-Click Report
        </button>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="backupEcoToGoogleSheet()" class="px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold flex items-center justify-center gap-1">
            <i data-lucide="cloud-upload" class="w-3 h-3"></i> Cloud Save
          </button>
          <button onclick="restoreEcoFromGoogleSheet()" class="px-2.5 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold hover:bg-emerald-50 dark:hover:bg-emerald-950/40 flex items-center justify-center gap-1">
            <i data-lucide="cloud-download" class="w-3 h-3"></i> Restore
          </button>
        </div>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="exportJson()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[11px] font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center gap-1">
            <i data-lucide="download" class="w-3 h-3"></i> Export
          </button>
          <label class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-[11px] font-medium hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center gap-1 cursor-pointer">
            <i data-lucide="upload" class="w-3 h-3"></i> Import
            <input type="file" accept=".json" onchange="importJson(event)" class="hidden" />
          </label>
        </div>
        <div class="flex items-center justify-between pt-1">
          <button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5">
            <i id="theme-icon" data-lucide="moon" class="w-3.5 h-3.5"></i>
            <span id="theme-label">Dark Mode</span>
          </button>
          <div class="flex items-center gap-1">
            <button onclick="openAuthSettingsModal()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40">Tài khoản</button>
            <button onclick="logoutWorkspace()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Khóa</button>
            <button onclick="confirmClearMock()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">Xóa mẫu</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-base sm:text-lg font-bold truncate">Command Center</h1>
            <p id="page-subtitle" class="text-xs text-slate-500 truncate">Tổng quan vận hành song song MAS &amp; Eco</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="openQuickTaskModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-xs">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Thêm Task</span>
          </button>
        </div>
      </header>

      <main id="app-main" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto"></main>
    </div>
  </div>

  <!-- Custom Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[60] space-y-2 max-w-sm"></div>

  <script>
    // =========================================================================
    // 1. CONSTANTS, AUTH & CORE STATE MANAGEMENT
    // =========================================================================
    const STORAGE_KEY = 'mas_eco_command_center_v3';
    const AUTH_KEY = 'mas_eco_auth_v1';
    const SAVED_URL_KEY = 'mas_eco_saved_webapp_url';
    const DEFAULT_WEB_APP_URL = '';

    const TIER_META = {
      BAU: { label: 'BAU', short: 'B', cls: 'bg-slate-200 text-slate-800 dark:bg-slate-700 dark:text-slate-100', badge: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' },
      Campaign: { label: 'Campaign', short: 'C', cls: 'bg-sky-500 text-white', badge: 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300' },
      Mega: { label: 'Mega', short: 'M', cls: 'bg-indigo-600 text-white', badge: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-300' },
      SMG: { label: 'Super Mega', short: 'S', cls: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' },
      Off: { label: 'Off', short: '—', cls: 'bg-rose-100 text-rose-600 dark:bg-rose-950/50 dark:text-rose-300', badge: 'bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-300' }
    };

    const FLIGHTING_STREAMS = [
      { id: 'oap_skin_live', brand: 'OAP Skin', format: 'Livestream', isLive: true },
      { id: 'lifebuoy_live', brand: 'Lifebuoy', format: 'Livestream', isLive: true },
      { id: 'mny_cpd', brand: 'MNY', format: 'Video CPD', isLive: false },
      { id: 'oap_cpd', brand: 'OAP', format: 'Video CPD', isLive: false }
    ];

    let isPaintingTier = false;
    let ecoLiveCsvState = {
      brand: 'OAP Skin',
      tierFilter: 'ALL',
      filename: '',
      rows: [],
      benchmarks: {}
    };

    function parseDelimitedLine(line, sep) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === sep && !inQuotes) {
          out.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    }

    function normalizeDateToISO(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (m) {
        const p1 = Number(m[1]), p2 = Number(m[2]), y = m[3];
        if (p1 > 12) return `${y}-${String(p2).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
        return `${y}-${String(p1).padStart(2, '0')}-${String(p2).padStart(2, '0')}`;
      }
      return '';
    }

    function getDefaultTierForDate(streamId, dateIso) {
      const day = Number(dateIso.split('-')[2] || 1);
      if (day === 11 || day === 12 || day === 25) return 'Mega';
      if (day === 15 || day === 20) return 'Campaign';
      if (day === 1) return 'SMG';
      return 'BAU';
    }

    function getTierForDate(streamId, dateIso) {
      const custom = state.flighting?.grid?.[streamId]?.[dateIso];
      if (custom) return custom;
      const day = Number((dateIso || '').slice(8, 10));
      if (!day) return 'BAU';
      if ([21, 22, 23].includes(day)) return 'SMG';
      if ([9, 10, 11, 24, 25, 26, 27].includes(day)) return 'Mega';
      if ([6, 7, 8, 12, 13, 14, 15].includes(day)) return 'Campaign';
      return 'BAU';
    }

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function offsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseCsvNumber(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (!val) return 0;
      let s = String(val).trim().replace(/[₫$%\s]/g, '');
      if (!s || s === '—' || s === '-') return 0;
      if (s.includes('.') && s.includes(',')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
        else s = s.replace(/,/g, '');
      } else if (s.includes('.')) {
        if (/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        if (/^\d{1,3}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g, '');
        else s = s.replace(',', '.');
      }
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function formatVnd(n) {
      const num = Number(n) || 0;
      if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(2) + ' tỷ';
      if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(1) + ' tr';
      return Math.round(num).toLocaleString('vi-VN') + ' đ';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function createDefaultState(withSample = true) {
      const mk = getCurrentMonthKey();
      const savedUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
      return {
        theme: 'light',
        activeTab: 'overview',
        masSubTab: 'perf',
        ecoSubTab: 'live_deepdive',
        ecoTrackingMonth: mk,
        ecoMonthlyTargets: {},
        ecoDailyActuals: {},
        liveViewDate: offsetDate(0),
        lastCloudBackup: '',
        masRules: {
          scaleMinRoas: 2.5,
          scaleMinOrders: 1,
          scaleLabel: '+25% Budget',
          cutMinSpend: 15,
          cutMaxRoas: 1.8,
          cutLabel: 'ROAS thấp'
        },
        masSheetConfig: {
          sheetUrl: 'https://docs.google.com/spreadsheets/d/1ZJMMM1XWIQvBzMzha3qMEJgU0QaTpf6FWf1s5BUBDRk/edit',
          webAppUrl: savedUrl,
          lastSync: '',
          summaryRows: [],
          deepdive: {}
        },
        tasks: withSample ? [
          { id: 't1', title: 'Review FB & Google Ads Intraday Today', project: 'MAS', due: offsetDate(0), done: false },
          { id: 't2', title: 'Chốt budget rephasing OAP Skin & Lifebuoy', project: 'Eco', due: offsetDate(0), done: false }
        ] : [],
        ecoTracking: [
          { id: 'et1', brand: 'OAP Skin', format: 'Livestream', target: 792356008, spend: 0, revenue: 0, maxCir: 14.6 },
          { id: 'et2', brand: 'Lifebuoy', format: 'Livestream', target: 3245884902, spend: 0, revenue: 0, maxCir: 13.5 },
          { id: 'et3', brand: 'MNY', format: 'Video CPD', target: 2153742912, spend: 0, revenue: 0, maxCir: 7.3 },
          { id: 'et4', brand: 'OAP', format: 'Video CPD', target: 2333699391, spend: 0, revenue: 0, maxCir: 7.3 }
        ],
        ecoLiveSaved: { brand: 'OAP Skin', byBrand: {} },
        ecoIssues: [
          { id: 'ei1', channel: 'Lifebuoy — Livestream', issue: 'Pacing 47.4% & CIR 14.7% (> Trần 13.5%)', rootCause: 'CPM ngày BAU tăng, CTOR khung chiều thấp', nextAction: 'Dồn budget vào ngày Mega/SMG & ghim Hero SKU', pic: 'Squad Ads', status: 'Open' }
        ],
        flighting: {
          monthKey: mk,
          activeBrush: 'Mega',
          grid: {},
          liveHours: {
            oap_skin_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' },
            lifebuoy_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' }
          },
          customHours: {}
        },
        scheduleBlocks: [
          { id: 'sb1', day: 1, project: 'MAS', time: '09:00 - 11:00', title: 'Check MER, FB/GG ROAS & Search Terms' },
          { id: 'sb2', day: 1, project: 'Eco', time: '14:00 - 16:00', title: 'Review Live CSV & Rephase Budget' }
        ],
        recurringTasks: [
          { id: 'rt1', title: 'Sync MAS Summary & kiểm tra Keyword lỗ', schedule: 'Hàng ngày', done: false },
          { id: 'rt2', title: 'Cập nhật CSV Livestream & đối soát CIR trần', schedule: 'Hàng ngày', done: false }
        ]
      };
    }

    let state = (() => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const base = createDefaultState(false);
          const merged = {
            ...base,
            ...parsed,
            flighting: { ...base.flighting, ...(parsed.flighting || {}) },
            ecoLiveSaved: { ...base.ecoLiveSaved, ...(parsed.ecoLiveSaved || {}) }
          };
          if (!merged.masSheetConfig.webAppUrl) {
            merged.masSheetConfig.webAppUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
          }
          return merged;
        }
      } catch (e) {}
      return createDefaultState(true);
    })();

    if (state.ecoLiveSaved) {
      ecoLiveCsvState.brand = state.ecoLiveSaved.brand || 'OAP Skin';
      const bSaved = state.ecoLiveSaved.byBrand?.[ecoLiveCsvState.brand] || state.ecoLiveSaved;
      ecoLiveCsvState.filename = bSaved.filename || '';
      ecoLiveCsvState.rows = bSaved.rows || [];
      ecoLiveCsvState.benchmarks = bSaved.benchmarks || {};
    }

    function updateCloudSyncBadge(text, busy = false) {
      const el = document.getElementById('cloud-sync-time');
      if (!el) return;
      el.textContent = text;
      el.className = busy
        ? 'font-semibold text-amber-600 dark:text-amber-400'
        : 'font-semibold text-emerald-600 dark:text-emerald-400';
    }

    function saveState(skipCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (state.masSheetConfig?.webAppUrl) {
          localStorage.setItem(SAVED_URL_KEY, state.masSheetConfig.webAppUrl);
        }
      } catch (e) {}
      if (!skipCloud) autoCloudSaveSilent();
    }

    // =========================================================================
    // 2. AUTH GATE & UI HELPERS
    // =========================================================================
    let isSessionUnlocked = sessionStorage.getItem('mas_eco_unlocked') === '1';
    let lastAutoPullTs = 0;

    function getAuthConfig() {
      try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
    }

    function renderAuthGate() {
      const gate = document.getElementById('auth-gate');
      const body = document.getElementById('auth-gate-body');
      if (!gate || !body) return;
      if (isSessionUnlocked) { gate.classList.add('hidden'); return; }

      gate.classList.remove('hidden');
      const cfg = getAuthConfig();
      const savedUrl = (cfg && cfg.url) || state.masSheetConfig?.webAppUrl || localStorage.getItem(SAVED_URL_KEY) || '';

      if (!cfg) {
        body.innerHTML = `
          <form onsubmit="submitFirstTimeSetup(event)" class="space-y-3.5">
            <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 text-xs text-indigo-800 dark:text-indigo-200 leading-relaxed">
              Thiết lập khóa bảo mật cho thiết bị này. Nhập đúng <b>Web App URL</b> và <b>Mật khẩu</b> cũ để tự động tải dữ liệu Cloud.
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Từ khóa đăng nhập (Alias)</label>
              <input id="setup-alias" type="text" required placeholder="VD: mas_eco_admin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Google Apps Script Web App URL</label>
              <input id="setup-url" type="url" value="${escapeHtml(savedUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold mb-1">Mật khẩu truy cập</label>
              <input id="setup-pass" type="password" required placeholder="Nhập mật khẩu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md">Lưu &amp; Mở khóa Workspace</button>
          </form>
        `;
      } else {
        body.innerHTML = `
          <form onsubmit="submitWorkspaceLogin(event)" class="space-y-3.5">
            <div>
              <label class="block text-xs font-semibold mb-1">Từ khóa đăng nhập hoặc Web App URL</label>

    async function submitWorkspaceLogin(e) {
      e.preventDefault();
      const userVal = document.getElementById('login-user').value.trim();
      const passVal = document.getElementById('login-pass').value;
      const cfg = getAuthConfig();
      const isUrl = /^https:\/\/script\.google\.com\//i.test(userVal);

      if (isUrl && (!cfg || !cfg.pass)) {
        try {
          const res = await fetch(`${userVal}?sheet=Workspace_Backup`);
          const json = await res.json();
          const cloudAuth = json?.payload?.authConfig;
          if (cloudAuth && cloudAuth.pass && cloudAuth.pass !== passVal) { showToast('Mật khẩu không khớp!', 'error'); return; }
          localStorage.setItem(AUTH_KEY, JSON.stringify({ alias: (cloudAuth && cloudAuth.alias) || 'mas_eco', url: userVal, pass: passVal }));
          state.masSheetConfig.webAppUrl = userVal;
          localStorage.setItem(SAVED_URL_KEY, userVal);
          isSessionUnlocked = true;
          sessionStorage.setItem('mas_eco_unlocked', '1');
          lastAutoPullTs = Date.now();
          saveState(true);
          renderAuthGate();
          render();
          await syncMasFromGoogleSheet(true);
          showToast('Đã đăng nhập & đồng bộ Cloud!', 'success');
          return;
        } catch (err) { showToast('Không kết nối được Web App URL!', 'error'); return; }
      }

      const userOk = isUrl || (cfg && userVal.toLowerCase() === String(cfg.alias || '').toLowerCase());
      const passOk = cfg && passVal === cfg.pass;
      if (!userOk || !passOk) { showToast('Sai từ khóa hoặc mật khẩu!', 'error'); return; }

      const targetUrl = isUrl ? userVal : (cfg.url || state.masSheetConfig.webAppUrl);
      if (targetUrl) { state.masSheetConfig.webAppUrl = targetUrl; localStorage.setItem(SAVED_URL_KEY, targetUrl); }
      isSessionUnlocked = true;
      sessionStorage.setItem('mas_eco_unlocked', '1');
      saveState(true);
      renderAuthGate();
      render();

    async function backupEcoToGoogleSheet(silent = false) {
      const url = state.masSheetConfig?.webAppUrl;
      if (!url) { if (!silent) showToast('Chưa cấu hình Web App URL!', 'error'); return; }
      try {
        updateCloudSyncBadge('Đang lưu...', true);
        const payloadState = {
          ...state,
          masSheetConfig: { sheetUrl: state.masSheetConfig.sheetUrl, webAppUrl: url, lastSync: state.masSheetConfig.lastSync },
          authConfig: getAuthConfig()
        };
        const res = await fetch(url, { method: 'POST', body: JSON.stringify({ note: 'Auto Backup', state: payloadState }) });
        const json = await res.json();
        if (json.ok) {
          state.lastCloudBackup = json.savedAt;
          updateCloudSyncBadge(json.savedAt.slice(11, 16), false);
          if (!silent) showToast('Đã lưu lên Google Sheet!', 'success');
        }
      } catch (err) {

    }

    }

    async function syncMasFromGoogleSheet(silent = false) {
      const url = state.masSheetConfig?.webAppUrl;
      if (!url) { if (!silent) showToast('Vui lòng nhập Google Apps Script Web App URL!', 'error'); return; }
      const tabs = [
        'MAS_Summary',
        'FB_Ads',
        'FB_Ads_Audience',
        'FB_Ads_Demo',
        'FB_Ads_Product',
        'GG_Ads_Creative',
        'GG_Ads_PMax',
        'GG_Ads_Keyword',
        'GG_Ads_Search_Term',
        'GG_Ads_Product',
        'Shopify_Orders',
        'GA4_Australia',
        'Workspace_Backup'
      ];
      try {
        if (!silent) showToast('Đang đồng bộ dữ liệu từ Google Sheet...', 'info');
        const results = await Promise.all(
          tabs.map((t) => fetch(`${url}?sheet=${encodeURIComponent(t)}`).then((r) => r.json()).catch(() => ({ sheet: t, rows: [] })))
        );
        const deepdive = {};
        let sheetLastSync = '';
        results.forEach((res) => {
          if (res.lastSuccessfulSync && !sheetLastSync) sheetLastSync = res.lastSuccessfulSync;
          if (res.sheet === 'MAS_Summary' && Array.isArray(res.rows)) {
            state.masSheetConfig.summaryRows = res.rows;
          } else if (res.sheet === 'Workspace_Backup' && res.payload) {
            const p = res.payload;
            if (Array.isArray(p.tasks)) state.tasks = p.tasks;
            if (p.ecoTrackingMonth) state.ecoTrackingMonth = p.ecoTrackingMonth;
            if (p.ecoMonthlyTargets) state.ecoMonthlyTargets = p.ecoMonthlyTargets;
            if (p.ecoDailyActuals) state.ecoDailyActuals = p.ecoDailyActuals;
            if (Array.isArray(p.ecoTracking)) state.ecoTracking = p.ecoTracking;
            if (p.ecoLiveSaved) {
              state.ecoLiveSaved = p.ecoLiveSaved;
              const b = p.ecoLiveSaved.brand || 'OAP Skin';
              const bData = p.ecoLiveSaved.byBrand?.[b] || p.ecoLiveSaved;
              ecoLiveCsvState.brand = b;
              ecoLiveCsvState.rows = bData.rows || [];
              ecoLiveCsvState.filename = bData.filename || '';
              ecoLiveCsvState.benchmarks = bData.benchmarks || {};
            }
            if (Array.isArray(p.ecoIssues)) state.ecoIssues = p.ecoIssues;
            if (p.flighting) state.flighting = { ...state.flighting, ...p.flighting };
            if (Array.isArray(p.scheduleBlocks)) state.scheduleBlocks = p.scheduleBlocks;
            if (Array.isArray(p.recurringTasks)) state.recurringTasks = p.recurringTasks;
            syncEcoTrackingFromDailyActuals(state.ecoTrackingMonth || getCurrentMonthKey());
          } else if (res.sheet && Array.isArray(res.rows)) {
            deepdive[res.sheet] = res.rows;
          }
        });
        state.masSheetConfig.deepdive = deepdive;
        state.masSheetConfig.lastSync = sheetLastSync || new Date().toLocaleString('vi-VN');
        saveState(true);
        render();
        if (!silent) showToast('Đồng bộ MAS & Cloud hoàn tất!', 'success');
      } catch (err) {
        if (!silent) showToast('Lỗi đồng bộ: ' + err.message, 'error');
      }
    }

      const rows = state.masSheetConfig?.summaryRows || [];

    function computeShopifyOnlineStoreRow() {
      const shopRows = (state.masSheetConfig?.deepdive?.Shopify_Orders || []).slice(1);
      if (!shopRows.length) return null;

      const dates = shopRows
        .map((r) => String(r[0] || '').trim().slice(0, 10))
        .filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort();
      const todayStr = dates.length ? dates[dates.length - 1] : offsetDate(0);
      let todayObj = new Date(todayStr + 'T12:00:00Z');
      if (isNaN(todayObj.getTime())) todayObj = new Date();
      const yestStr = new Date(todayObj.getTime() - 1 * 86400000).toISOString().slice(0, 10);
      const d7Str = new Date(todayObj.getTime() - 7 * 86400000).toISOString().slice(0, 10);
      const d30Str = new Date(todayObj.getTime() - 30 * 86400000).toISOString().slice(0, 10);

      const sum = { TODAY: 0, YESTERDAY: 0, L7D: 0, L30D: 0, ALL: 0 };
      shopRows.forEach((r) => {
        const dt = String(r[0] || '').trim().slice(0, 10);
        if (!dt) return;
        const src = String(r[3] || r[5] || '').toLowerCase();
        const isOnlineStore = src.includes('online store') || src === 'web' || src.includes('online_store');
        if (!isOnlineStore) return;
        const gmv = parseCsvNumber(r[9]);
        if (!gmv) return;
        sum.ALL += gmv;
        if (dt === todayStr) sum.TODAY += gmv;
        if (dt === yestStr) sum.YESTERDAY += gmv;
        if (dt >= d7Str && dt <= yestStr) sum.L7D += gmv;
        if (dt >= d30Str && dt <= yestStr) sum.L30D += gmv;
      });

      const fmtUsd = (v) => '$' + (Math.round(v * 100) / 100).toLocaleString('en-US');
      return [
        '  ↳ Shopify Online Store GMV',
        fmtUsd(sum.TODAY),
        fmtUsd(sum.YESTERDAY),
        fmtUsd(sum.L7D),
        fmtUsd(sum.L30D),
        fmtUsd(sum.ALL),
        'Kênh Online Store (Web)'
      ];
    }

              <div class="text-[11px] font-semibold text-slate-400">Shopify Orders (L7D)</div>
              <div class="text-xl font-extrabold mt-1">${escapeHtml(orders7d)}</div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold">Focus Tasks hôm nay (${focusTasks.length})</h2>
                <button onclick="openQuickTaskModal()" class="text-xs font-semibold text-indigo-600 hover:underline">+ Thêm Task</button>
              </div>
              <div class="divide-y divide-slate-100 dark:divide-slate-800">
                ${focusTasks.length ? focusTasks.map((t) => `
                  <div class="py-2.5 flex items-center justify-between gap-2">
                    <label class="flex items-center gap-2.5 cursor-pointer min-w-0">
                      <input type="checkbox" onchange="toggleTaskDone('${t.id}')" class="w-4 h-4 rounded accent-indigo-600" />
                      <span class="text-xs font-medium truncate">${escapeHtml(t.title)}</span>
                    </label>
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${t.project === 'MAS' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">${escapeHtml(t.project)}</span>
                  </div>
                `).join('') : '<p class="text-xs text-slate-400 py-4 text-center">Không có task tồn đọng.</p>'}
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold">Tiến độ Pacing Mảng Eco</h2>
                <button onclick="switchTab('eco')" class="text-xs font-semibold text-emerald-600 hover:underline">Mở Workspace Eco →</button>
              </div>
              <div class="space-y-2.5">
                ${getEcoMonthRows(state.ecoTrackingMonth || getCurrentMonthKey()).map((row) => {
                  const pct = row.target > 0 ? Math.min(100, Math.round((row.revenue / row.target) * 100)) : 0;
                  const cir = row.revenue > 0 ? (row.spend / row.revenue) * 100 : 0;
                  return `
                    <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 space-y-1.5">
                      <div class="flex justify-between text-xs font-semibold">
                        <span>${escapeHtml(row.brand)} (${escapeHtml(row.format)})</span>
                        <span>${pct}% • CIR ${cir.toFixed(1)}%</span>
                      </div>
                      <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                        <div class="h-full bg-emerald-500 rounded-full" style="width:${pct}%"></div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderMas() {
      const sub = state.masSubTab || 'perf';
      const url = state.masSheetConfig?.webAppUrl || '';
      const lastSync = state.masSheetConfig?.lastSync || 'Chưa đồng bộ';

      return `
        <div class="space-y-5">
          <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-2">
              <button onclick="setMasSubTab('perf')" class="px-3.5 py-2 rounded-xl text-xs font-semibold ${sub === 'perf' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Executive Summary</button>
              <button onclick="setMasSubTab('deepdive')" class="px-3.5 py-2 rounded-xl text-xs font-semibold ${sub === 'deepdive' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Deepdive &amp; Optimize</button>
              <button onclick="setMasSubTab('shopify')" class="px-3.5 py-2 rounded-xl text-xs font-semibold ${sub === 'shopify' ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Shopify Product &amp; Mix Cart</button>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-[11px] text-slate-400">Sync: ${escapeHtml(lastSync)}</span>
              <button onclick="syncMasFromGoogleSheet(false)" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold flex items-center gap-1.5">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Sync Data MAS ngay
              </button>
            </div>
          </div>

          ${!url ? `
            <div class="bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-3">
              <div class="text-xs text-amber-800 dark:text-amber-200">Chưa kết nối Google Apps Script Web App URL.</div>
              <button onclick="openAuthSettingsModal()" class="px-3.5 py-2 rounded-xl bg-amber-600 text-white text-xs font-semibold">Cấu hình URL ngay</button>
            </div>
          ` : ''}

          ${sub === 'perf' ? renderMasSummaryTable() : sub === 'deepdive' ? renderMasDeepdive() : renderMasShopifyMix()}
        </div>
      `;
    }

    function setMasSubTab(t) { state.masSubTab = t; saveState(true); render(); }

    function renderMasSummaryTable() {
      const rows = state.masSheetConfig?.summaryRows || [];
      if (rows.length < 4) {
        return `<div class="bg-white dark:bg-slate-900 p-8 rounded-2xl border border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">Chưa có dữ liệu MAS_Summary. Hãy bấm <b>Sync Data MAS ngay</b>.</div>`;
      }
      const header = rows[3] || [];
      const rawBodyRows = rows.slice(4);
      const hasOnlineStoreRow = rawBodyRows.some((r) => String(r[0] || '').toLowerCase().includes('shopify online store gmv'));
      const bodyRows = [];

      rawBodyRows.forEach((r) => {
        bodyRows.push(r);
        if (!hasOnlineStoreRow && String(r[0] || '').toLowerCase().includes('total shopify gmv')) {
          const onlineRow = computeShopifyOnlineStoreRow();
          if (onlineRow) bodyRows.push(onlineRow);
        }
      });

      return `
        <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-x-auto">
          <table class="w-full text-left border-collapse text-xs">
            <thead>
              <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800">
                ${header.map((h, i) => `<th class="py-3 px-4 font-bold ${i > 0 && i < 6 ? 'text-right' : ''}">${escapeHtml(h)}</th>`).join('')}
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
              ${bodyRows.map((r) => {
                const isSection = !r[1] && !r[2] && !r[3];
                if (isSection) {
                  return `<tr class="bg-indigo-50/70 dark:bg-indigo-950/30"><td colspan="7" class="py-2.5 px-4 font-extrabold text-indigo-900 dark:text-indigo-200">${escapeHtml(r[0])}</td></tr>`;
                }
                return `
                  <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                    ${r.map((cell, i) => `<td class="py-2.5 px-4 ${i > 0 && i < 6 ? 'text-right font-semibold' : ''}">${escapeHtml(cell)}</td>`).join('')}
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderMasDeepdive() {
      const dd = state.masSheetConfig?.deepdive || {};
      const sources = [
        { key: 'FB_Ads', label: 'FB Creative (Overall)' },
        { key: 'FB_Ads_Audience', label: 'FB Placement × Audience (Real)' },
        { key: 'FB_Ads_Demo', label: 'FB Age × Gender (Real)' },
        { key: 'FB_Ads_Product', label: 'FB Catalog SKU' },
        { key: 'GG_Ads_Creative', label: 'GG Search Creative' },
        { key: 'GG_Ads_PMax', label: 'GG (PMax Assets)' },
        { key: 'GG_Ads_Keyword', label: 'GG Keywords (Bidded)' },
        { key: 'GG_Ads_Search_Term', label: 'GG Search Terms (Queries)' },
        { key: 'GG_Ads_Product', label: 'GG Shopping SKU' }
      ];

      if (!sources.some((s) => s.key === ddState.source)) {
        ddState.source = 'FB_Ads';
      }

      const dataRows = (dd[ddState.source] || []).slice(1);

      // Xác định khoảng ngày lọc (chuẩn hóa YYYY-MM-DD an toàn tránh lỗi Invalid time value)
      const allDates = dataRows
        .map((r) => String(r[0] || '').trim().slice(0, 10))
        .filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort();
      const maxDate = allDates.length ? allDates[allDates.length - 1] : offsetDate(0);
      let maxDateObj = new Date(maxDate + 'T12:00:00Z');
      if (isNaN(maxDateObj.getTime())) maxDateObj = new Date();
      const yestStr = new Date(maxDateObj.getTime() - 1 * 86400000).toISOString().slice(0, 10);
      const d7Str = new Date(maxDateObj.getTime() - 7 * 86400000).toISOString().slice(0, 10);
      const d30Str = new Date(maxDateObj.getTime() - 30 * 86400000).toISOString().slice(0, 10);

      // Thu thập danh sách giá trị duy nhất cho bộ lọc chéo
      const campaignsSet = new Set();
      const audiencesSet = new Set();
      const gendersSet = new Set();
      const agesSet = new Set();
      const placementsSet = new Set();
      const creativesSet = new Set();

      const isFbPlacement = ddState.source === 'FB_Ads_Audience';
      const isFbDemo = ddState.source === 'FB_Ads_Demo';
      const isFbOverall = ddState.source === 'FB_Ads';

      // Parse thuộc tính độc lập từ từng bảng chuẩn của Meta
      const parsedRows = dataRows.map((r) => {
        const dt = String(r[0] || '').slice(0, 10);
        const camp = String(r[1] || '').trim();
        const col2 = String(r[2] || '').trim();
        const col3 = String(r[3] || '').trim();

        let age = '', gender = '', placement = '', creative = '', audience = '';

        if (isFbPlacement) {
          placement = String(r[13] || '').trim() || (col3.match(/\[([^\]]+)\]/)?.[1] || '');
          creative = String(r[14] || '').trim() || col3.replace(/\s*\[.*?\]\s*$/, '');
          audience = String(r[15] || '').trim() || (col2.match(/\(([^)]+)\)/)?.[1] || 'Broad / Adv+');
        } else if (isFbDemo) {
          age = String(r[13] || '').trim() || (col2.match(/^([^\s(]+)/)?.[1] || '');
          gender = String(r[14] || '').trim() || (col2.match(/\(([^)]+)\)/)?.[1] || '');
          creative = String(r[15] || '').trim() || (col3.split(' — ')[1] || col3);
        } else if (isFbOverall) {
          creative = col3;
          audience = String(r[17] || '').trim();
        }

        if (camp) campaignsSet.add(camp);
        if (audience) audiencesSet.add(audience);
        if (gender) gendersSet.add(gender);
        if (age) agesSet.add(age);
        if (placement) placementsSet.add(placement);
        if (creative) creativesSet.add(creative);

        return {
          dt,
          camp,
          groupLabel: col2,
          mainName: col3 || col2,
          audience,
          age,
          gender,
          placement,
          creative,
          spend: parseCsvNumber(r[4]),
          imp: parseCsvNumber(r[5]),
          clicks: parseCsvNumber(r[6]),
          conv: parseCsvNumber(r[7]),
          gmv: parseCsvNumber(r[8])
        };
      });

      // Lọc theo thời gian & các chiều độc lập
      const filtered = parsedRows.filter((r) => {
        if (ddState.period === 'TODAY' && r.dt !== maxDate) return false;
        if (ddState.period === 'YESTERDAY' && r.dt !== yestStr) return false;
        if (ddState.period === 'L7D' && (r.dt < d7Str || r.dt > maxDate)) return false;
        if (ddState.period === 'L30D' && (r.dt < d30Str || r.dt > maxDate)) return false;

        if (ddState.campaign !== 'ALL' && r.camp !== ddState.campaign) return false;
        if (isFbPlacement && ddState.audience !== 'ALL' && r.audience !== ddState.audience) return false;
        if (isFbPlacement && ddState.placement !== 'ALL' && r.placement !== ddState.placement) return false;
        if (isFbDemo && ddState.gender !== 'ALL' && r.gender !== ddState.gender) return false;
        if (isFbDemo && ddState.age !== 'ALL' && r.age !== ddState.age) return false;
        if ((isFbPlacement || isFbDemo || isFbOverall) && ddState.creative !== 'ALL' && r.creative !== ddState.creative) return false;

        if (ddState.search) {
          const q = ddState.search.toLowerCase();
          const hay = `${r.mainName} ${r.groupLabel} ${r.camp} ${r.gender} ${r.age} ${r.placement} ${r.creative}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      // Tổng hợp dữ liệu cho 2 chart tròn liên kết (Spend vs GMV) + Ma trận bong bóng
      const sliceMap = {};
      let totSpend = 0, totGmv = 0, totConv = 0;

      filtered.forEach((r) => {
        totSpend += r.spend;
        totGmv += r.gmv;
        totConv += r.conv;

        let dimKey = r.camp || r.mainName || 'Other';
        if (isFbPlacement) {
          dimKey = ddState.chartDim === 'audience' ? (r.audience || 'Broad / Adv+') : (r.placement || 'Other');
        } else if (isFbDemo) {
          dimKey = `${r.age || 'All'} (${r.gender || 'all'})`;
        } else if (isFbOverall) {
          dimKey = ddState.chartDim === 'creative' ? (r.creative || r.mainName) : (r.camp || 'Other');
        }
        if (!sliceMap[dimKey]) sliceMap[dimKey] = { label: dimKey, spend: 0, gmv: 0, conv: 0 };
        sliceMap[dimKey].spend += r.spend;
        sliceMap[dimKey].gmv += r.gmv;
        sliceMap[dimKey].conv += r.conv;
      });

      const sortedSlices = Object.values(sliceMap).sort((a, b) => b.spend - a.spend);
      const topSlices = sortedSlices.filter((x) => x.spend > 0 || x.gmv > 0);

      window.__ddChartData = {
        slices: topSlices,
        totSpend,
        totGmv
      };

      // Gom nhóm theo tổ hợp cột hiển thị
      const agg = {};
      filtered.forEach((r) => {
        const key = `${r.mainName}__${r.camp}`;
        if (!agg[key]) {
          agg[key] = {
            name: r.mainName,
            groupLabel: r.groupLabel,
            camp: r.camp,
            gender: r.gender,
            age: r.age,
            placement: r.placement,
            audience: r.audience,
            creative: r.creative,
            spend: 0,
            imp: 0,
            clicks: 0,
            conv: 0,
            gmv: 0
          };
        }
        agg[key].spend += r.spend;
        agg[key].imp += r.imp;
        agg[key].clicks += r.clicks;
        agg[key].conv += r.conv;
        agg[key].gmv += r.gmv;
      });

      let list = Object.values(agg).map((it) => {
        const roas = it.spend > 0 ? it.gmv / it.spend : 0;
        const cpm = it.imp > 0 ? (it.spend / it.imp) * 1000 : 0;
        const ctr = it.imp > 0 ? (it.clicks / it.imp) * 100 : 0;
        const cvr = it.clicks > 0 ? (it.conv / it.clicks) * 100 : 0;
        const rules = state.masRules || { scaleMinRoas: 2.5, scaleMinOrders: 1, scaleLabel: '+25% Budget', cutMinSpend: 15, cutMaxRoas: 1.8, cutLabel: 'ROAS thấp' };
        let rule = 'TEST';
        let ruleLabel = 'TEST • Đang học';
        if (roas >= Number(rules.scaleMinRoas) && it.conv >= Number(rules.scaleMinOrders)) {
          rule = 'SCALE';
          ruleLabel = `SCALE • ${rules.scaleLabel || '+25% Budget'}`;
        } else if (it.spend >= Number(rules.cutMinSpend) && roas < Number(rules.cutMaxRoas)) {
          rule = 'CUT';
          ruleLabel = `CUT • ${rules.cutLabel || `< ${rules.cutMaxRoas}x`}`;
        }
        return { ...it, roas, cpm, ctr, cvr, rule, ruleLabel };
      });

      if (ddState.rule !== 'ALL') {
        list = list.filter((it) => it.rule === ddState.rule);
      }

      list.sort((a, b) => {
        const dir = ddState.sortDir === 'asc' ? 1 : -1;
        return ((a[ddState.sortBy] || 0) - (b[ddState.sortBy] || 0)) * dir;
      });

      const sortIcon = (col) => ddState.sortBy === col ? (ddState.sortDir === 'desc' ? ' ↓' : ' ↑') : '';
      const totRoas = totSpend > 0 ? (totGmv / totSpend) : 0;
      const isCompact = !!ddState.compactBar;
      const rules = state.masRules || { scaleMinRoas: 2.5, scaleMinOrders: 1, scaleLabel: '+25% Budget', cutMinSpend: 15, cutMaxRoas: 1.8, cutLabel: 'ROAS thấp' };

      return `
        <div class="space-y-3">
          <!-- Nguồn dữ liệu -->
          <div class="flex flex-wrap gap-1.5">
            ${sources.map((s) => `
              <button onclick="setDdFilter('source', '${s.key}')" class="px-3 py-1.5 rounded-xl text-xs font-semibold transition-colors ${ddState.source === s.key ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs' : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50'}">${s.label}</button>
            `).join('')}
          </div>

          <!-- Thanh lọc siêu gọn (Sticky Bar có nút Thu gọn/Mở rộng để không che nội dung) -->
          <div class="sticky top-[57px] z-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-800 shadow-xs space-y-2">
            <div class="flex flex-wrap items-center justify-between gap-1.5">
              <div class="flex flex-wrap items-center gap-1">
                ${[
                  { id: 'TODAY', lbl: `Today (${maxDate.slice(5)})` },
                  { id: 'YESTERDAY', lbl: 'Yesterday' },
                  { id: 'L7D', lbl: '7D' },
                  { id: 'L30D', lbl: '30D' },
                  { id: 'ALL', lbl: 'All' }
                ].map((p) => `
                  <button onclick="setDdFilter('period', '${p.id}')" class="px-2 py-1 rounded-lg text-[11px] font-semibold ${ddState.period === p.id ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${p.lbl}</button>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <div class="hidden xl:flex items-center gap-2.5 text-[11px] px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-200/70 dark:border-slate-700/70">
                  <span>Spend: <b class="text-indigo-600">$${totSpend.toFixed(0)}</b></span>
                  <span>GMV: <b class="text-emerald-600">$${totGmv.toFixed(0)}</b></span>
                  <span>ROAS: <b>${totRoas.toFixed(2)}x</b></span>
                  <span>Ord: <b>${Math.round(totConv)}</b></span>
                </div>

                <input type="text" value="${escapeHtml(ddState.search)}" oninput="setDdFilter('search', this.value)" placeholder="Tìm nhanh..." class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-[11px] w-36 sm:w-44 outline-none focus:ring-1 focus:ring-indigo-500" />
                
                <select onchange="setDdFilter('rule', this.value)" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-[11px] font-semibold">
                  <option value="ALL" ${ddState.rule === 'ALL' ? 'selected' : ''}>Rule: Tất cả</option>
                  <option value="SCALE" ${ddState.rule === 'SCALE' ? 'selected' : ''}>SCALE • ≥ ${rules.scaleMinRoas}x (${rules.scaleMinOrders}+ ord)</option>
                  <option value="CUT" ${ddState.rule === 'CUT' ? 'selected' : ''}>CUT • Spend ≥ $${rules.cutMinSpend} &amp; &lt; ${rules.cutMaxRoas}x</option>
                  <option value="TEST" ${ddState.rule === 'TEST' ? 'selected' : ''}>TEST • Đang học</option>
                </select>

                <button onclick="openMasRuleModal()" class="px-2 py-1 rounded-lg border border-indigo-200 dark:border-indigo-800 bg-indigo-50/70 dark:bg-indigo-950/40 text-indigo-700 dark:text-indigo-300 text-[11px] font-semibold hover:bg-indigo-100" title="Tùy chỉnh ngưỡng SCALE / CUT / TEST">
                  ⚙ Set Rule
                </button>

                ${(ddState.campaign !== 'ALL' || ddState.audience !== 'ALL' || ddState.placement !== 'ALL' || ddState.gender !== 'ALL' || ddState.age !== 'ALL' || ddState.creative !== 'ALL' || ddState.search || ddState.rule !== 'ALL') ? `
                  <button onclick="setDdFilter('source', ddState.source); ddState.search=''; ddState.rule='ALL'; render();" class="px-2 py-1 rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-950/40 text-[11px] font-semibold">Xóa lọc</button>
                ` : ''}

                <button onclick="ddState.compactBar=!ddState.compactBar;render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800" title="Thu gọn / Mở rộng bộ lọc chi tiết">
                  ${isCompact ? 'Mở lọc ▾' : 'Thu gọn ▴'}
                </button>
              </div>
            </div>

            ${!isCompact ? `
              <!-- Bộ lọc độc lập theo từng Breakdown của Meta (không trộn chéo Joint Breakdown) -->
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 pt-1.5 border-t border-slate-100 dark:border-slate-800">
                <select onchange="setDdFilter('campaign', this.value)" class="w-full px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-[11px] truncate">
                  <option value="ALL">Campaign (${campaignsSet.size})</option>
                  ${Array.from(campaignsSet).sort().map((c) => `<option value="${escapeHtml(c)}" ${ddState.campaign === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
                </select>

                ${(isFbPlacement || isFbDemo || isFbOverall) ? `
                  <select onchange="setDdFilter('creative', this.value)" class="w-full px-2 py-1 rounded-lg border border-amber-200 dark:border-amber-800 bg-amber-50/40 dark:bg-amber-950/30 text-[11px] font-semibold truncate">
                    <option value="ALL">Creative (${creativesSet.size})</option>

                ${isFbPlacement ? `
                  <select onchange="setDdFilter('placement', this.value)" class="w-full px-2 py-1 rounded-lg border border-emerald-200 dark:border-emerald-800 bg-emerald-50/40 dark:bg-emerald-950/30 text-[11px] font-semibold truncate">
                    <option value="ALL">Placement (${placementsSet.size})</option>

                  <select onchange="setDdFilter('audience', this.value)" class="w-full px-2 py-1 rounded-lg border border-purple-200 dark:border-purple-800 bg-purple-50/40 dark:bg-purple-950/30 text-[11px] font-semibold truncate">
                    <option value="ALL">Audience (${audiencesSet.size})</option>
                    ${Array.from(audiencesSet).sort().map((au) => `<option value="${escapeHtml(au)}" ${ddState.audience === au ? 'selected' : ''}>${escapeHtml(au)}</option>`).join('')}
                  </select>
                ` : ''}

                ${isFbDemo ? `
                  <select onchange="setDdFilter('gender', this.value)" class="w-full px-2 py-1 rounded-lg border border-indigo-200 dark:border-indigo-800 bg-indigo-50/40 dark:bg-indigo-950/30 text-[11px] font-semibold truncate">
                    <option value="ALL">Giới tính (${gendersSet.size})</option>
                    ${Array.from(gendersSet).sort().map((g) => `<option value="${escapeHtml(g)}" ${ddState.gender === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join('')}
                  </select>

                  <select onchange="setDdFilter('age', this.value)" class="w-full px-2 py-1 rounded-lg border border-indigo-200 dark:border-indigo-800 bg-indigo-50/40 dark:bg-indigo-950/30 text-[11px] font-semibold truncate">
                    <option value="ALL">Độ tuổi (${agesSet.size})</option>
                    ${Array.from(agesSet).sort().map((a) => `<option value="${escapeHtml(a)}" ${ddState.age === a ? 'selected' : ''}>Tuổi: ${escapeHtml(a)}</option>`).join('')}
                  </select>
                ` : ''}
              </div>
            ` : ''}
          </div>

          <!-- Khu vực Visual Analytics -->
          <div class="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <div class="text-xs font-extrabold">Đối chiếu Tỷ trọng Spend vs GMV &amp; Ma trận Hiệu suất Quy mô (100% Meta Reported Data)</div>
                <div class="text-[11px] text-slate-400">Di chuột hoặc bấm chọn 1 phần trên biểu đồ tròn hoặc bong bóng để đối chiếu toàn diện</div>
              </div>
              ${isFbPlacement ? `
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                  <button onclick="ddState.chartDim='placement';ddState.selectedSlice=null;render();" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${ddState.chartDim !== 'audience' ? 'bg-white dark:bg-slate-900 shadow-xs text-indigo-600' : 'text-slate-500'}">Placement</button>
                  <button onclick="ddState.chartDim='audience';ddState.selectedSlice=null;render();" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${ddState.chartDim === 'audience' ? 'bg-white dark:bg-slate-900 shadow-xs text-indigo-600' : 'text-slate-500'}">Audience Group</button>
                </div>
              ` : isFbOverall ? `
                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
                  <button onclick="ddState.chartDim='campaign';ddState.selectedSlice=null;render();" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${ddState.chartDim !== 'creative' ? 'bg-white dark:bg-slate-900 shadow-xs text-indigo-600' : 'text-slate-500'}">Campaign</button>
                  <button onclick="ddState.chartDim='creative';ddState.selectedSlice=null;render();" class="px-2.5 py-1 rounded-lg text-[11px] font-semibold ${ddState.chartDim === 'creative' ? 'bg-white dark:bg-slate-900 shadow-xs text-indigo-600' : 'text-slate-500'}">Creative</button>
                </div>
              ` : ''}
            </div>

            <!-- Thanh Spotlight đối chiếu khi chọn/hover 1 lát cắt -->
            <div id="dd-slice-spotlight" class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/70 dark:border-slate-700/70 flex flex-wrap items-center justify-between gap-3 text-xs">
              <span class="text-slate-500">💡 Di chuột hoặc click vào một phân khúc trên biểu đồ để xem chi tiết đối chiếu Spend → GMV → ROAS.</span>
            </div>

            <!-- Hàng 1: 2 Chart Tròn xếp cạnh nhau (50% - 50%) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="flex flex-col items-center p-3.5 rounded-2xl bg-slate-50/60 dark:bg-slate-800/30 border border-slate-100 dark:border-slate-800">
                <div class="text-xs font-bold text-indigo-600 mb-2">1. Tỷ trọng Chi tiêu (Spend $)</div>
                <div class="h-56 w-full relative"><canvas id="dd-donut-spend"></canvas></div>
              </div>

              <div class="flex flex-col items-center p-3.5 rounded-2xl bg-slate-50/60 dark:bg-slate-800/30 border border-slate-100 dark:border-slate-800">
                <div class="text-xs font-bold text-emerald-600 mb-2">2. Tỷ trọng Doanh thu (GMV $)</div>
                <div class="h-56 w-full relative"><canvas id="dd-donut-gmv"></canvas></div>
              </div>
            </div>

            <!-- Hàng 2: Ma trận Bong bóng 3 chiều (Trục X = Spend $, Trục Y = ROAS x, Kích thước bóng = GMV $) -->
            <div class="p-3.5 rounded-2xl bg-slate-50/60 dark:bg-slate-800/30 border border-slate-100 dark:border-slate-800 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div>
                  <span class="text-xs font-bold">3. Ma trận Quyết định: Quy mô Spend ($) × Hiệu suất ROAS (x) × Độ lớn GMV ($)</span>
                  <div class="text-[11px] text-slate-400">Trục ngang: Mức chi Spend ($) • Trục dọc: ROAS (x) • Độ to bong bóng: Doanh thu GMV ($)</div>
                </div>
                <div class="flex items-center gap-3 text-[11px]">
                  <span class="flex items-center gap-1 text-emerald-600 font-semibold"><span class="w-3 h-0.5 bg-emerald-500 inline-block"></span> Mốc Scale (${rules.scaleMinRoas}x)</span>
                  <span class="flex items-center gap-1 text-rose-600 font-semibold"><span class="w-3 h-0.5 bg-rose-500 inline-block"></span> Mốc Cut (${rules.cutMaxRoas}x)</span>
                </div>
              </div>
              <div class="h-64 w-full relative"><canvas id="dd-bubble-matrix"></canvas></div>
            </div>
          </div>

          <!-- Bảng kết quả chia cột rõ ràng theo từng Breakdown thực tế -->
          <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-x-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead>
                <tr class="bg-slate-50 dark:bg-slate-800/70 border-b border-slate-200 dark:border-slate-800">
                  ${isFbDemo ? `
                    <th class="py-3 px-3 font-bold">Giới tính</th>
                    <th class="py-3 px-3 font-bold">Độ tuổi</th>
                    <th class="py-3 px-3 font-bold">Creative (Ad Name) &amp; Campaign</th>
                  ` : isFbPlacement ? `
                    <th class="py-3 px-3 font-bold">Placement &amp; Audience</th>
                    <th class="py-3 px-3 font-bold">Creative (Ad Name) &amp; Campaign</th>
                  ` : `
                    <th class="py-3 px-4 font-bold">Chi tiết Creative / Keyword / SKU</th>
                  `}
                  <th class="py-3 px-3 font-bold">Action</th>
                  <th onclick="toggleDdSort('spend')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">Spend ($)${sortIcon('spend')}</th>
                  <th onclick="toggleDdSort('gmv')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">GMV ($)${sortIcon('gmv')}</th>
                  <th onclick="toggleDdSort('roas')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">ROAS${sortIcon('roas')}</th>
                  <th onclick="toggleDdSort('cpm')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">CPM${sortIcon('cpm')}</th>
                  <th onclick="toggleDdSort('ctr')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">CTR${sortIcon('ctr')}</th>
                  <th onclick="toggleDdSort('cvr')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">CVR${sortIcon('cvr')}</th>
                  <th onclick="toggleDdSort('conv')" class="py-3 px-3 font-bold text-right cursor-pointer hover:text-indigo-600">Orders${sortIcon('conv')}</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${list.length ? list.slice(0, 120).map((it) => {
                  const badgeCls = it.rule === 'SCALE'
                    ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300'
                    : it.rule === 'CUT'
                      ? 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300'
                      : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
                  const gLow = (it.gender || '').toLowerCase();
                  const genderBadge = gLow === 'female'
                    ? 'bg-pink-100 text-pink-700 dark:bg-pink-950/60 dark:text-pink-300'
                    : gLow === 'male'
                      ? 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300'
                      : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
                  return `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40">
                      ${isFbDemo ? `
                        <td class="py-3 px-3 whitespace-nowrap">
                          <span class="px-2 py-0.5 rounded-md text-[11px] font-bold capitalize ${genderBadge}">${escapeHtml(it.gender || 'All')}</span>
                        </td>
                        <td class="py-3 px-3 whitespace-nowrap font-bold text-slate-700 dark:text-slate-200">${escapeHtml(it.age || 'All')}</td>
                        <td class="py-3 px-3 min-w-[230px] max-w-[360px] whitespace-normal break-words">
                          <div class="font-bold leading-snug">${escapeHtml(it.creative || it.name)}</div>
                          <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(it.camp)}</div>
                        </td>
                      ` : isFbPlacement ? `
                        <td class="py-3 px-3 min-w-[170px]">
                          <div class="font-semibold text-emerald-700 dark:text-emerald-300">${escapeHtml(it.placement || 'all')}</div>
                          <div class="text-[10px] text-purple-600 dark:text-purple-400 font-medium mt-0.5">${escapeHtml(it.audience || '')}</div>
                        </td>
                        <td class="py-3 px-3 min-w-[230px] max-w-[360px] whitespace-normal break-words">
                          <div class="font-bold leading-snug">${escapeHtml(it.creative || it.name)}</div>
                          <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(it.camp)}</div>
                        </td>
                      ` : `
                        <td class="py-3 px-4 min-w-[260px] max-w-[420px] whitespace-normal break-words">
                          <div class="font-bold leading-snug">${escapeHtml(it.name)}</div>
                          <div class="text-[11px] text-slate-400 mt-0.5">${escapeHtml(it.camp)}</div>
                        </td>
                      `}
                      <td class="py-3 px-3 whitespace-nowrap">
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold ${badgeCls}">${escapeHtml(it.ruleLabel)}</span>
                      </td>
                      <td class="py-3 px-3 text-right font-bold">$${it.spend.toFixed(2)}</td>
                      <td class="py-3 px-3 text-right font-bold text-emerald-600">$${it.gmv.toFixed(2)}</td>
                      <td class="py-3 px-3 text-right font-extrabold ${it.roas >= 2.5 ? 'text-emerald-600' : it.roas > 0 && it.roas < 1.8 ? 'text-rose-600' : ''}">${it.roas.toFixed(2)}x</td>
                      <td class="py-3 px-3 text-right">$${it.cpm.toFixed(2)}</td>
                      <td class="py-3 px-3 text-right">${it.ctr.toFixed(2)}%</td>
                      <td class="py-3 px-3 text-right">${it.cvr.toFixed(2)}%</td>
                      <td class="py-3 px-3 text-right font-semibold">${Math.round(it.conv)}</td>
                    </tr>
                  `;
                }).join('') : `<tr><td colspan="${isFbDemo ? 11 : isFbPlacement ? 10 : 9}" class="py-8 text-center text-slate-400">Không có dữ liệu khớp bộ lọc.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    let ddChart1Instance = null;
    let ddChart2Instance = null;
    let ddBubbleInstance = null;

    const SLICE_PALETTE = [
      '#6366f1', '#10b981', '#f59e0b', '#ec4899', '#0ea5e9',
      '#8b5cf6', '#f97316', '#14b8a6', '#e11d48', '#84cc16',
      '#3b82f6', '#d946ef', '#eab308', '#06b6d4', '#a855f7',
      '#ef4444', '#22c55e', '#f43f5e', '#64748b', '#0284c7'
    ];

    function updateSliceSpotlight(idx) {
      const box = document.getElementById('dd-slice-spotlight');
      const data = window.__ddChartData;
      if (!box || !data || !data.slices[idx]) return;
      const item = data.slices[idx];
      const rules = state.masRules || { scaleMinRoas: 2.5, cutMaxRoas: 1.8 };
      const color = SLICE_PALETTE[idx % SLICE_PALETTE.length];
      const spPct = data.totSpend > 0 ? ((item.spend / data.totSpend) * 100).toFixed(1) : '0.0';
      const gmvPct = data.totGmv > 0 ? ((item.gmv / data.totGmv) * 100).toFixed(1) : '0.0';
      const roas = item.spend > 0 ? (item.gmv / item.spend) : 0;
      const diffPct = (Number(gmvPct) - Number(spPct)).toFixed(1);
      const diffBadge = Number(diffPct) >= 0
        ? `<span class="px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300 font-bold">+${diffPct}% hiệu suất đóng góp</span>`
        : `<span class="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 dark:bg-amber-950/60 dark:text-amber-300 font-bold">${diffPct}% hiệu suất đóng góp</span>`;

      box.innerHTML = `
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full shrink-0" style="background:${color}"></span>
          <span class="font-extrabold text-sm">${escapeHtml(item.label)}</span>
          ${diffBadge}
        </div>
        <div class="flex flex-wrap items-center gap-4">
          <span>Chi tiêu Spend: <b class="text-indigo-600">$${item.spend.toFixed(2)}</b> <span class="text-slate-400">(${spPct}%)</span></span>
          <span>Mang về GMV: <b class="text-emerald-600">$${item.gmv.toFixed(2)}</b> <span class="text-slate-400">(${gmvPct}%)</span></span>
          <span>ROAS đạt: <b class="text-sm ${roas >= Number(rules.scaleMinRoas) ? 'text-emerald-600' : roas > 0 && roas < Number(rules.cutMaxRoas) ? 'text-rose-600' : 'text-amber-600'}">${roas.toFixed(2)}x</b></span>
          <span>Orders: <b>${Math.round(item.conv)}</b></span>
        </div>
      `;
    }

    function syncHighlightDonuts(idx) {
      updateSliceSpotlight(idx);
      [ddChart1Instance, ddChart2Instance].forEach((chart) => {
        if (!chart) return;
        chart.setActiveElements([{ datasetIndex: 0, index: idx }]);
        if (chart.tooltip) {
          chart.tooltip.setActiveElements([{ datasetIndex: 0, index: idx }], { x: 0, y: 0 });
        }
        chart.update('none');
      });
      if (ddBubbleInstance) {
        ddBubbleInstance.setActiveElements([{ datasetIndex: 0, index: idx }]);
        ddBubbleInstance.update('none');
      }
    }

    function renderDeepdiveCharts() {
      if (typeof Chart === 'undefined' || !window.__ddChartData) return;
      const { slices, totSpend, totGmv } = window.__ddChartData;
      const isDark = state.theme === 'dark';
      const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.22)';
      const tickColor = isDark ? '#94a3b8' : '#64748b';
      const labels = slices.map((s) => s.label);
      const colors = slices.map((_, i) => SLICE_PALETTE[i % SLICE_PALETTE.length]);

      const makeDonutConfig = (values, total, prefix) => ({
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: values.map((v) => Number(v.toFixed(2))),
            backgroundColor: colors,
            borderColor: isDark ? '#0f172a' : '#ffffff',
            borderWidth: 2,
            hoverOffset: 10
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '62%',
          onHover: (_, elements) => {
            if (elements && elements.length > 0) {
              syncHighlightDonuts(elements[0].index);
            }
          },
          onClick: (_, elements) => {
            if (elements && elements.length > 0) {
              ddState.selectedSlice = elements[0].index;
              syncHighlightDonuts(elements[0].index);
            }
          },
          plugins: {
            legend: {
              display: true,
              position: 'right',
              labels: {
                color: tickColor,
                boxWidth: 10,
                padding: 8,
                font: { size: 10, weight: '600' },
                generateLabels: (chart) => {
                  const data = chart.data;
                  return (data.labels || []).slice(0, 12).map((lbl, i) => ({
                    text: lbl.length > 34 ? lbl.slice(0, 32) + '…' : lbl,
                    fillStyle: data.datasets[0].backgroundColor[i],
                    strokeStyle: data.datasets[0].borderColor,
                    lineWidth: 1,
                    index: i
                  }));
                }
              }
            },
            tooltip: {
              callbacks: {
                label: (ctx) => {
                  const val = Number(ctx.raw || 0);
                  const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0.0';
                  return ` ${ctx.label}: ${prefix}${val.toFixed(2)} (${pct}%)`;
                }
              }
            }
          }
        }
      });

      const c1 = document.getElementById('dd-donut-spend');
      const c2 = document.getElementById('dd-donut-gmv');
      const c3 = document.getElementById('dd-bubble-matrix');

      if (ddChart1Instance) { ddChart1Instance.destroy(); ddChart1Instance = null; }
      if (ddChart2Instance) { ddChart2Instance.destroy(); ddChart2Instance = null; }
      if (ddBubbleInstance) { ddBubbleInstance.destroy(); ddBubbleInstance = null; }

      if (c1) {
        ddChart1Instance = new Chart(c1, makeDonutConfig(slices.map((s) => s.spend), totSpend, '$'));
      }
      if (c2) {
        ddChart2Instance = new Chart(c2, makeDonutConfig(slices.map((s) => s.gmv), totGmv, '$'));
      }

      if (c3) {
        const rules = state.masRules || { scaleMinRoas: 2.5, cutMaxRoas: 1.8 };
        const scaleRoas = Number(rules.scaleMinRoas) || 2.5;
        const cutRoas = Number(rules.cutMaxRoas) || 1.8;

        const maxSpend = Math.max(10, ...slices.map((s) => s.spend));
        const maxGmv = Math.max(10, ...slices.map((s) => s.gmv));
        const roasList = slices.map((s) => (s.spend > 0 ? s.gmv / s.spend : 0));
        const maxRoas = Math.max(scaleRoas + 1, ...roasList);

        const bubblePoints = slices.map((s, i) => {
          const roas = s.spend > 0 ? s.gmv / s.spend : 0;
          const rSize = Math.max(7, Math.min(28, Math.sqrt(s.gmv / maxGmv) * 26));
          return {
            x: Number(s.spend.toFixed(2)),
            y: Number(roas.toFixed(2)),
            r: rSize,
            label: s.label,
            gmv: s.gmv,
            conv: s.conv,
            idx: i
          };
        });

        const refLinePlugin = {
          id: 'roasRefLines',
          afterDatasetsDraw(chart) {
            const { ctx, chartArea: { left, right }, scales: { y } } = chart;
            if (!y) return;
            const drawLine = (val, color, text) => {
              const yPos = y.getPixelForValue(val);
              if (yPos < chart.chartArea.top || yPos > chart.chartArea.bottom) return;
              ctx.save();
              ctx.beginPath();
              ctx.setLineDash([5, 5]);
              ctx.lineWidth = 1.5;
              ctx.strokeStyle = color;
              ctx.moveTo(left, yPos);
              ctx.lineTo(right, yPos);
              ctx.stroke();
              ctx.fillStyle = color;
              ctx.font = 'bold 10px Inter, sans-serif';
              ctx.textAlign = 'right';
              ctx.fillText(text, right - 6, yPos - 4);
              ctx.restore();
            };
            drawLine(scaleRoas, '#10b981', `Scale ≥ ${scaleRoas}x`);
            drawLine(cutRoas, '#f43f5e', `Cut < ${cutRoas}x`);
          }
        };

        ddBubbleInstance = new Chart(c3, {
          type: 'bubble',
          data: {
            datasets: [{
              label: 'Phân khúc',
              data: bubblePoints,
              backgroundColor: colors.map((hex) => hex + 'aa'),
              borderColor: colors,
              borderWidth: 2,
              hoverRadius: 4
            }]
          },
          plugins: [refLinePlugin],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            onHover: (_, elements) => {
              if (elements && elements.length > 0) {
                const pt = bubblePoints[elements[0].index];
                if (pt) syncHighlightDonuts(pt.idx);
              }
            },
            onClick: (_, elements) => {
              if (elements && elements.length > 0) {
                const pt = bubblePoints[elements[0].index];
                if (pt) {
                  ddState.selectedSlice = pt.idx;
                  syncHighlightDonuts(pt.idx);
                }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) => {
                    const raw = ctx.raw;
                    return [
                      ` ${raw.label}`,
                      ` • Spend: $${raw.x.toFixed(2)}`,
                      ` • GMV: $${raw.gmv.toFixed(2)}`,
                      ` • ROAS: ${raw.y.toFixed(2)}x (${Math.round(raw.conv)} orders)`

                title: { display: true, text: 'Ads Spend ($)', color: tickColor, font: { size: 11, weight: 'bold' } },
                min: 0,
                suggestedMax: maxSpend * 1.12,
                grid: { color: gridColor },
                ticks: { color: tickColor, font: { size: 11 }, callback: (v) => '$' + v }
              },
              y: {
                title: { display: true, text: 'ROAS (x)', color: tickColor, font: { size: 11, weight: 'bold' } },
                min: 0,
                suggestedMax: maxRoas * 1.15,
                grid: { color: gridColor },
                ticks: { color: tickColor, font: { size: 11 }, callback: (v) => v + 'x' }
              }
            }
          }
        });
      }

      if (slices.length > 0) {
