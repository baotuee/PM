                  ${['BAU', 'Campaign', 'Mega', 'SMG'].map((t) => {
                    const val = state.flighting?.liveHours?.[st.id]?.[t] || '';
                    return `
                      <div class="flex items-center justify-between gap-2">
                        <span class="px-2 py-0.5 rounded font-bold text-[10px] w-20 text-center ${TIER_META[t].badge}">${t}</span>

                </div>
              `).join('')}

    function analyzeEcoLiveCsvText(text, filename, forcedBrand) {
      const lines = String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      if (lines.length < 2) return null;
      const sep = lines[0].includes('\t') ? '\t' : ',';
      const headers = parseDelimitedLine(lines[0], sep).map((h) => h.toLowerCase());
      const dateIdx = headers.findIndex((h) => h.includes('date') || h.includes('ngày'));
      const gmvIdx = headers.findIndex((h) => h.includes('gmv') || h.includes('revenue') || h.includes('doanh'));
      const spendIdx = headers.findIndex((h) => h.includes('spend') || h.includes('cost') || h.includes('chi'));
      const viewsIdx = headers.findIndex((h) => h.includes('view') || h.includes('xem'));
      const ordersIdx = headers.findIndex((h) => h.includes('order') || h.includes('đơn'));

      const brand = forcedBrand || ecoLiveCsvState.brand || 'OAP Skin';
      const streamId = brand === 'Lifebuoy' ? 'lifebuoy_live' : 'oap_skin_live';
      const rows = [];

      for (let i = 1; i < lines.length; i++) {
        const cols = parseDelimitedLine(lines[i], sep);
        const dt = normalizeDateToISO(cols[dateIdx >= 0 ? dateIdx : 0]);
        if (!dt) continue;
        const revenue = parseCsvNumber(cols[gmvIdx >= 0 ? gmvIdx : 1]);
        const spend = parseCsvNumber(cols[spendIdx >= 0 ? spendIdx : 2]);
        const views = viewsIdx >= 0 ? parseCsvNumber(cols[viewsIdx]) : 0;
        const orders = ordersIdx >= 0 ? parseCsvNumber(cols[ordersIdx]) : 0;
        const tier = getTierForDate(streamId, dt);
        const cir = revenue > 0 ? (spend / revenue) * 100 : 0;
        rows.push({ date: dt, tier, revenue, spend, views, orders, cir });
      }
      if (!rows.length) return null;

      rows.sort((a, b) => (a.date < b.date ? 1 : -1));
      if (!state.ecoLiveSaved) state.ecoLiveSaved = { brand, byBrand: {} };
      if (!state.ecoLiveSaved.byBrand) state.ecoLiveSaved.byBrand = {};
      state.ecoLiveSaved.brand = brand;
      state.ecoLiveSaved.byBrand[brand] = { filename, rows, benchmarks: {} };

      const mk = rows[0].date.slice(0, 7);
      if (!state.ecoDailyActuals) state.ecoDailyActuals = {};
      if (!state.ecoDailyActuals[mk]) state.ecoDailyActuals[mk] = {};
      state.ecoDailyActuals[mk][`${brand} — Livestream`] = rows.map((r) => ({
        date: r.date,
        tier: r.tier,
        spend: r.spend,
        revenue: r.revenue
      }));

      ecoLiveCsvState.brand = brand;
      ecoLiveCsvState.filename = filename;
      ecoLiveCsvState.rows = rows;
      return { filename, rows };
    }

    function handleEcoLiveCsvUpload(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const res = analyzeEcoLiveCsvText(ev.target.result, file.name, ecoLiveCsvState.brand);
        if (!res) {
          showToast('File CSV không có dòng ngày hợp lệ!', 'error');
          return;
        }
        const mk = res.rows[0].date.slice(0, 7);
        state.ecoTrackingMonth = mk;
        syncEcoTrackingFromDailyActuals(mk);
        saveState();
        render();
        showToast(`Đã phân tích ${res.rows.length} ngày Livestream (${ecoLiveCsvState.brand})!`, 'success');
      };
      reader.readAsText(file);
    }

          `📊 BÁO CÁO HIỆU SUẤT MAS (${todayIso})`,
          '====================================',
          '1. CHỈ SỐ TỔNG QUAN (Today | Yesterday | Last 7D):',
          `• Paid Ads Spend: $${rSpend[1] || '0'} | $${rSpend[2] || '0'} | $${rSpend[3] || '0'}`,
          `• Shopify GMV: $${rGmv[1] || '0'} | $${rGmv[2] || '0'} | $${rGmv[3] || '0'}`,
          `• Blended ROAS (MER): ${rMer[1] || '0'}x | ${rMer[2] || '0'}x | ${rMer[3] || '0'}x`,
          `• Tổng Đơn (CAC / LTV): ${rOrders[1] || '0'} (${rCac[1] || '0'} CAC / ${rLtv[1] || '0'} LTV) | Yest: ${rOrders[2] || '0'} (${rCac[2] || '0'} CAC / ${rLtv[2] || '0'} LTV)`,
          `• Facebook Ads: Spend $${rFb[1] || '0'} (ROAS ${rFbRoas[1] || '0'}x) | Yest: $${rFb[2] || '0'} (${rFbRoas[2] || '0'}x)`,
          `• Google Ads: Spend $${rGg[1] || '0'} (ROAS ${rGgRoas[1] || '0'}x) | Yest: $${rGg[2] || '0'} (${rGgRoas[2] || '0'}x)`,
          `• GA4 Australia Sessions: ${rAu[1] || '0'} (Today) | ${rAu[2] || '0'} (Yest)`,
          '',
          `2. ACTION & FOCUS TASKS MAS (${masTasks.length}):`,
          ...(masTasks.length ? masTasks.map((t) => `- ${t.title}${t.due ? ' (Due: ' + t.due + ')' : ''}`) : ['- Không có task tồn đọng']),
          '',
          `3. ORDER CONTENT / CREATIVE PIPELINE (${masBriefs.length}):`,
          ...(masBriefs.length ? masBriefs.slice(0, 6).map((c) => `- [${c.status}] ${c.title} (${c.channel})`) : ['- Đã hoàn tất các brief'])
        ].join('\n');
      }

      if (scope === 'ECO') {
        syncEcoTrackingFromDailyActuals(mk);
        const rows = getEcoMonthRows(mk);
        const ecoTasks = (state.tasks || []).filter((t) => !t.done && t.project === 'Eco');
        const openIssues = (state.ecoIssues || []).filter((i) => i.status !== 'Resolved');

        const liveScheduleLines = FLIGHTING_STREAMS.filter((s) => s.isLive).map((st) => {
          const tier = getTierForDate(st.id, todayIso);
          const customH = state.flighting?.customHours?.[st.id]?.[todayIso];
          const defaultH = state.flighting?.liveHours?.[st.id]?.[tier] || '';
          return `• ${st.brand}: Tier ${tier} — Khung giờ Live: ${customH || defaultH || 'Theo lịch chuẩn'}`;
        });

        return [
          `📡 BÁO CÁO VẬN HÀNH ECO — THÁNG ${mk} (${todayIso})`,
          '====================================',
          '1. TRACKING TARGET & CIR THEO BRAND:',
          ...rows.map((r) => {
            const pac = r.target > 0 ? ((r.revenue / r.target) * 100).toFixed(1) : '0.0';
            const cir = r.revenue > 0 ? ((r.spend / r.revenue) * 100).toFixed(1) : '0.0';
            const flag = Number(cir) > Number(r.maxCir) ? '⚠️ Vượt trần' : '✅ Đạt trần';
            return `• ${r.brand} (${r.format}): GMV ${formatVnd(r.revenue)} / ${formatVnd(r.target)} (${pac}%) | Spend ${formatVnd(r.spend)} | CIR ${cir}% / ${r.maxCir}% (${flag})`;
          }),
          '',
          '2. LỊCH TIER & KHUNG GIỜ LIVESTREAM HÔM NAY:',
          ...liveScheduleLines,
          '',
          `3. ISSUES & ACTION PLAN ĐANG XỬ LÝ (${openIssues.length}):`,
          ...(openIssues.length ? openIssues.map((i) => `- [${i.channel}] ${i.issue} → Next: ${i.nextAction}`) : ['- Không có issue tồn đọng']),
          '',
          `4. FOCUS TASKS ECO (${ecoTasks.length}):`,
          ...(ecoTasks.length ? ecoTasks.map((t) => `- ${t.title}`) : ['- Không có task tồn đọng'])
        ].join('\n');
      }

      return buildReportTextByScope('MAS') + '\n\n' + buildReportTextByScope('ECO');
    }

    function switchReportScope(scope) {
      const box = document.getElementById('report-box');
      if (box) box.value = buildReportTextByScope(scope);
      ['MAS', 'ECO', 'ALL'].forEach((sc) => {
        const btn = document.getElementById('rep-tab-' + sc);
        if (!btn) return;
        const active = sc === scope;
        btn.className = active
          ? 'px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-xs'
          : 'px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold';
      });
    }

    function openReportModal(defaultScope) {
      const initScope = defaultScope || (state.activeTab === 'eco' ? 'ECO' : 'MAS');
      const reportText = buildReportTextByScope(initScope);
      openModal(`
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h3 class="text-base font-bold">1-Click Daily Standup Report</h3>
          <div class="flex items-center gap-1.5">
            <button id="rep-tab-MAS" onclick="switchReportScope('MAS')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${initScope === 'MAS' ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Report MAS</button>
            <button id="rep-tab-ECO" onclick="switchReportScope('ECO')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${initScope === 'ECO' ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Report Eco</button>
            <button id="rep-tab-ALL" onclick="switchReportScope('ALL')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold ${initScope === 'ALL' ? 'bg-indigo-600 text-white shadow-xs' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">Tổng hợp cả 2</button>
          </div>
        </div>
        <textarea id="report-box" rows="15" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-xs leading-relaxed">${escapeHtml(reportText)}</textarea>
        <div class="flex justify-end gap-2 pt-3">
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs">Đóng</button>
          <button onclick="copyTextToClipboard(document.getElementById('report-box').value, 'Đã copy báo cáo!')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Copy Báo Cáo</button>
        </div>
      `);
    }

    let cloudSaveTimer = null;
    function autoCloudSaveSilent() {
      const url = (state.masSheetConfig?.webAppUrl || '').trim();
      if (!url) return;
      clearTimeout(cloudSaveTimer);
      updateCloudSyncBadge('Đang lưu...', true);
      cloudSaveTimer = setTimeout(() => backupEcoToGoogleSheet(true), 900);
    }

    function buildCloudPayload() {
      const cfg = getAuthConfig();
      return {
        __auth: cfg ? { alias: cfg.alias, pass: cfg.pass } : null,
        ecoTrackingMonth: state.ecoTrackingMonth,
        ecoMonthlyTargets: state.ecoMonthlyTargets,
        ecoDailyActuals: state.ecoDailyActuals,
        ecoTracking: state.ecoTracking,
        ecoLiveSaved: state.ecoLiveSaved,
        ecoIssues: state.ecoIssues,
        ecoLiveLogs: state.ecoLiveLogs,
        flighting: state.flighting,
        tasks: state.tasks,
        masContent: state.masContent,
        scheduleBlocks: state.scheduleBlocks,
        recurringTasks: state.recurringTasks
      };
    }

    function applyCloudPayloadToState(p, savedAt) {
      if (!p || typeof p !== 'object') return;
      if (p.__auth && p.__auth.pass) {
        const curUrl = state.masSheetConfig?.webAppUrl || localStorage.getItem(SAVED_URL_KEY) || '';
        localStorage.setItem(AUTH_KEY, JSON.stringify({
          alias: p.__auth.alias || 'mas_eco',
          url: curUrl,
          pass: p.__auth.pass
        }));
      }
      if (p.ecoTrackingMonth) state.ecoTrackingMonth = p.ecoTrackingMonth;
      if (p.ecoMonthlyTargets) state.ecoMonthlyTargets = p.ecoMonthlyTargets;
      if (p.ecoDailyActuals) state.ecoDailyActuals = p.ecoDailyActuals;
      if (Array.isArray(p.ecoTracking)) state.ecoTracking = p.ecoTracking;
      if (p.ecoLiveSaved) {
        state.ecoLiveSaved = p.ecoLiveSaved;
        const b = p.ecoLiveSaved.brand || 'OAP Skin';
        const bData = p.ecoLiveSaved.byBrand?.[b] || p.ecoLiveSaved;
        ecoLiveCsvState.brand = b;
        ecoLiveCsvState.filename = bData.filename || '';
        ecoLiveCsvState.rows = bData.rows || [];
        ecoLiveCsvState.benchmarks = bData.benchmarks || {};
      }
      if (Array.isArray(p.ecoIssues)) state.ecoIssues = p.ecoIssues;
      if (Array.isArray(p.ecoLiveLogs)) state.ecoLiveLogs = p.ecoLiveLogs;
      if (p.flighting) state.flighting = { ...state.flighting, ...p.flighting };
      if (Array.isArray(p.tasks)) state.tasks = p.tasks;
      if (Array.isArray(p.masContent)) state.masContent = p.masContent;
      if (Array.isArray(p.scheduleBlocks)) state.scheduleBlocks = p.scheduleBlocks;
      if (Array.isArray(p.recurringTasks)) state.recurringTasks = p.recurringTasks;

      const mk = state.ecoTrackingMonth || getCurrentMonthKey();
      syncEcoTrackingFromDailyActuals(mk);
      if (savedAt) {
        state.lastCloudBackup = savedAt;
        updateCloudSyncBadge(String(savedAt).split(' ').pop() || 'Đã đồng bộ', false);
      }
    }

    async function backupEcoToGoogleSheet(silent = false) {
      const url = (state.masSheetConfig?.webAppUrl || '').trim();
      if (!url) {
        if (!silent) showToast('Vui lòng dán Web App URL ở tab MAS → Performance Sync trước!', 'error');
        return;
      }
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ note: 'Auto Cloud Backup', state: buildCloudPayload() })
        });
        const data = await res.json();
        if (data && data.ok) {
          state.lastCloudBackup = data.savedAt;
          updateCloudSyncBadge(String(data.savedAt).split(' ').pop() || 'Đã lưu', false);
          if (!silent) showToast(`Đã lưu Cloud Backup lúc ${data.savedAt}!`, 'success');
        }
      } catch (err) {
        updateCloudSyncBadge('Lỗi lưu', false);
        if (!silent) showToast(`Lỗi Cloud Save: ${err.message}`, 'error');
      }
    }

    async function restoreEcoFromGoogleSheet() {
      const url = (state.masSheetConfig?.webAppUrl || '').trim();
      if (!url) {
        showToast('Vui lòng dán Web App URL trước khi Restore!', 'error');
        return;
      }
      try {
        const sep = url.includes('?') ? '&' : '?';
        const res = await fetch(`${url}${sep}sheet=Workspace_Backup`).then((r) => r.json());
        if (res && res.payload) {
          applyCloudPayloadToState(res.payload, res.savedAt);
          saveState(true);
          render();
          showToast(`Đã khôi phục dữ liệu từ bản lưu ${res.savedAt || ''}!`, 'success');
        } else {
          showToast(res?.error || 'Chưa có bản sao lưu trên Google Sheet.', 'error');
        }
      } catch (err) {
        showToast(`Lỗi Restore: ${err.message}`, 'error');
      }
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `mas_eco_backup_${offsetDate(0)}.json`;
      a.click();
    }

    function importJson(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state = { ...createDefaultState(false), ...parsed };
          saveState();
          render();
          showToast('Đã import file backup thành công!', 'success');
        } catch (err) {
          showToast('File JSON không hợp lệ!', 'error');
        }
      };
      reader.readAsText(file);
    }

    function confirmClearMock() {
      openModal(`
        <h3 class="text-base font-bold mb-2">Xóa toàn bộ dữ liệu mẫu?</h3>
        <p class="text-xs text-slate-500 mb-4">Thao tác này sẽ làm trống các task/issue mẫu (vẫn giữ nguyên Web App URL đã lưu của bạn).</p>
        <div class="flex justify-end gap-2">
          <button onclick="closeModal()" class="px-4 py-2 rounded-xl border text-xs">Hủy</button>
          <button onclick="const keepUrl=state.masSheetConfig.webAppUrl; state=createDefaultState(false); state.masSheetConfig.webAppUrl=keepUrl; saveState(); closeModal(); render(); showToast('Đã làm sạch dữ liệu mẫu!', 'success');" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">Xóa mẫu</button>
        </div>
      `);
    }

    // =========================================================================
    // 8. BOOTSTRAP ON WINDOW LOAD
    // =========================================================================
    window.onload = function () {
      applyTheme();
      // Trên thiết bị mới chưa từng đăng nhập nhưng đã có URL hoặc muốn đăng nhập bằng URL -> hiện form đăng nhập trực tiếp
      if (!getAuthConfig() && localStorage.getItem(SAVED_URL_KEY)) {
        localStorage.setItem(AUTH_KEY, JSON.stringify({ alias: '', url: localStorage.getItem(SAVED_URL_KEY), pass: '' }));
      }
      renderAuthGate();
      render();

      // Tự động kéo bản mới nhất từ Google Sheet mỗi khi mở lại tab trên ĐT hoặc Máy tính
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isSessionUnlocked && state.masSheetConfig?.webAppUrl) {
          syncMasFromGoogleSheet(true);
        }
      });
    };
  </script>
</body>
</html>
