<!DOCTYPE html>
<html lang="vi" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAS × Eco — Performance Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>

    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.45); border-radius: 9999px; }

  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased">

  <!-- Login / Workspace Gate Overlay -->
  <div id="auth-gate" class="fixed inset-0 z-[70] bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-2xl w-full max-w-md p-6 sm:p-7 space-y-5">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-base shadow-md">M×E</div>
        <div>
          <h2 class="text-base font-extrabold">MAS × Eco Command Center</h2>
          <p class="text-xs text-slate-500">Đăng nhập bằng từ khóa Web App URL &amp; mật khẩu cá nhân</p>
        </div>
      </div>
      <div id="auth-gate-body"></div>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app-shell" class="flex min-h-screen w-full">
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-30 hidden lg:hidden" onclick="toggleMobileSidebar(false)"></div>

    <!-- Sidebar -->

      <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div class="flex items-center gap-2.5">

          <div>
            <div class="text-xs font-extrabold tracking-tight">MAS × Eco</div>
            <div class="text-[10px] text-slate-400">Command Center</div>
          </div>
        </div>
        <button onclick="toggleMobileSidebar(false)" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <nav id="sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>

      <div class="p-3 border-t border-slate-100 dark:border-slate-800 space-y-2">
        <div id="cloud-sync-badge" class="px-2.5 py-1 rounded-lg bg-slate-50 dark:bg-slate-800/70 text-[10px] text-slate-500 flex items-center justify-between">

          <span id="cloud-sync-time" class="font-semibold text-emerald-600 dark:text-emerald-400">Sẵn sàng</span>
        </div>
        <button onclick="openReportModal()" class="w-full px-3 py-2 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-xs font-semibold hover:opacity-90 flex items-center justify-center gap-2">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 1-Click Report
        </button>
        <div class="grid grid-cols-2 gap-1.5">
          <button onclick="backupEcoToGoogleSheet()" class="px-2.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-semibold flex items-center justify-center gap-1">

          <button onclick="restoreEcoFromGoogleSheet()" class="px-2.5 py-1.5 rounded-xl border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold hover:bg-emerald-50 dark:hover:bg-emerald-950/40 flex items-center justify-center gap-1">

        <div class="grid grid-cols-2 gap-1.5">

            <i data-lucide="download" class="w-3 h-3"></i> Export

        </div>
        <div class="flex items-center justify-between pt-1">
          <button onclick="toggleTheme()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center gap-1.5">

            <span id="theme-label">Dark Mode</span>
          </button>
          <div class="flex items-center gap-1">
            <button onclick="openAuthSettingsModal()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/40">Tài khoản</button>
            <button onclick="logoutWorkspace()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">Khóa</button>
            <button onclick="confirmClearMock()" class="px-2 py-1.5 rounded-xl text-[11px] font-medium text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40">Xóa mẫu</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 bg-white/85 dark:bg-slate-900/85 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl border border-slate-200 dark:border-slate-700">
            <i data-lucide="menu" class="w-4 h-4"></i>
          </button>
          <div class="min-w-0">
            <h1 id="page-title" class="text-base sm:text-lg font-bold truncate">Command Center</h1>
            <p id="page-subtitle" class="text-xs text-slate-500 truncate">Tổng quan vận hành song song MAS &amp; Eco</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="openWorkspaceTaskModal()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold flex items-center gap-1.5 shadow-xs">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">Thêm Task</span>
          </button>
        </div>
      </header>

      <main id="app-main" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto"></main>
    </div>
  </div>

  <!-- Custom Modal Container -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
    <div id="modal-box" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-5"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[60] space-y-2 max-w-sm"></div>

  <script>
    // =========================================================================
    // 1. CONSTANTS, AUTH & CORE STATE MANAGEMENT
    // =========================================================================
    const STORAGE_KEY = 'mas_eco_command_center_v3';
    const AUTH_KEY = 'mas_eco_auth_v1';
    const PRIOR_MAS_STORAGE_KEY = 'mas_eco_command_center_v2';
    const PRIOR_MAS_AUTH_KEY = 'mas_eco_auth_v2';
    const SAVED_URL_KEY = 'mas_eco_saved_webapp_url';
    const DEFAULT_WEB_APP_URL = '';

    const TIER_META = {
      BAU: { label: 'BAU', short: 'B', cls: 'bg-slate-200 text-slate-800 dark:bg-slate-700 dark:text-slate-100', badge: 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300' },
      Campaign: { label: 'Campaign', short: 'C', cls: 'bg-sky-500 text-white', badge: 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300' },
      Mega: { label: 'Mega', short: 'M', cls: 'bg-indigo-600 text-white', badge: 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950/60 dark:text-indigo-300' },
      SMG: { label: 'Super Mega', short: 'S', cls: 'bg-amber-500 text-white', badge: 'bg-amber-100 text-amber-800 dark:bg-amber-950/60 dark:text-amber-300' },
      Off: { label: 'Off', short: '—', cls: 'bg-rose-100 text-rose-600 dark:bg-rose-950/50 dark:text-rose-300', badge: 'bg-rose-50 text-rose-600 dark:bg-rose-950/40 dark:text-rose-300' }
    };

    const FLIGHTING_STREAMS = [
      { id: 'oap_skin_live', brand: 'OAP Skin', format: 'Livestream', isLive: true },
      { id: 'lifebuoy_live', brand: 'Lifebuoy', format: 'Livestream', isLive: true },
      { id: 'mny_cpd', brand: 'MNY', format: 'Video CPD', isLive: false },
      { id: 'oap_cpd', brand: 'OAP', format: 'Video CPD', isLive: false }
    ];

    let isPaintingTier = false;
    let ecoLiveCsvState = {
      brand: 'OAP Skin',
      tierFilter: 'ALL',
      filename: '',
      rows: [],
      benchmarks: {}
    };

    function parseDelimitedLine(line, sep) {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQuotes && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === sep && !inQuotes) {
          out.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    }

    function normalizeDateToISO(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if (m) {
        const p1 = Number(m[1]), p2 = Number(m[2]), y = m[3];
        if (p1 > 12) return `${y}-${String(p2).padStart(2, '0')}-${String(p1).padStart(2, '0')}`;
        return `${y}-${String(p1).padStart(2, '0')}-${String(p2).padStart(2, '0')}`;
      }
      return '';
    }

    function getDefaultTierForDate(streamId, dateIso) {
      const day = Number(dateIso.split('-')[2] || 1);
      if (day === 11 || day === 12 || day === 25) return 'Mega';
      if (day === 15 || day === 20) return 'Campaign';
      if (day === 1) return 'SMG';
      return 'BAU';
    }

    function getTierForDate(streamId, dateIso) {
      const custom = state.flighting?.grid?.[streamId]?.[dateIso];
      if (custom) return custom;
      const day = Number((dateIso || '').slice(8, 10));
      if (!day) return 'BAU';
      if ([21, 22, 23].includes(day)) return 'SMG';
      if ([9, 10, 11, 24, 25, 26, 27].includes(day)) return 'Mega';
      if ([6, 7, 8, 12, 13, 14, 15].includes(day)) return 'Campaign';
      return 'BAU';
    }

    function getCurrentMonthKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    function offsetDate(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function parseCsvNumber(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (!val) return 0;
      let s = String(val).trim().replace(/[₫$%\s]/g, '');
      if (!s || s === '—' || s === '-') return 0;
      if (s.includes('.') && s.includes(',')) {
        if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
        else s = s.replace(/,/g, '');
      } else if (s.includes('.')) {
        if (/^\d{1,3}(\.\d{3}){2,}$/.test(s)) s = s.replace(/\./g, '');
      } else if (s.includes(',')) {
        if (/^\d{1,3}(,\d{3}){2,}$/.test(s)) s = s.replace(/,/g, '');
        else s = s.replace(',', '.');
      }
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function getCurrentUserPic() {
      return getAuthConfig()?.alias || 'Tuệ';
    }

    function formatDateISO(date) {
      return date.toISOString().slice(0, 10);
    }

    function formatVnd(n) {
      const num = Number(n) || 0;
      if (Math.abs(num) >= 1e9) return (num / 1e9).toFixed(2) + ' tỷ';
      if (Math.abs(num) >= 1e6) return (num / 1e6).toFixed(1) + ' tr';
      return Math.round(num).toLocaleString('vi-VN') + ' đ';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function createDefaultState(withSample = true) {
      const mk = getCurrentMonthKey();
      const savedUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
      return {
        theme: 'light',
        activeTab: 'overview',
        masSubTab: 'perf',
        ecoSubTab: 'live_deepdive',
        ecoTrackingMonth: mk,
        ecoMonthlyTargets: {},
        ecoDailyActuals: {},
        liveViewDate: offsetDate(0),
        lastCloudBackup: '',
        masRules: {
          scaleMinRoas: 2.5,
          scaleMinOrders: 1,
          scaleLabel: '+25% Budget',
          cutMinSpend: 15,
          cutMaxRoas: 1.8,
          cutLabel: 'ROAS thấp'
        },
        masSheetConfig: {
          sheetUrl: 'https://docs.google.com/spreadsheets/d/1ZJMMM1XWIQvBzMzha3qMEJgU0QaTpf6FWf1s5BUBDRk/edit',
          webAppUrl: savedUrl,
          lastSync: '',
          summaryRows: [],
          dailyAggRows: [],
          deepdive: {}
        },
        tasks: withSample ? [
          { id: 't1', title: 'Review FB & Google Ads Intraday Today', project: 'MAS', tag: 'Ads', status: 'Doing', priority: 'High', pic: 'Tuệ', progress: 60, due: offsetDate(0), focus: true, note: 'Kiểm tra các adset tiêu > $15 nhưng ROAS < 1.8x', done: false },
          { id: 't2', title: 'Chốt budget rephasing OAP Skin & Lifebuoy', project: 'Eco', tag: 'Live', status: 'To Do', priority: 'High', pic: 'Squad Eco', progress: 20, due: offsetDate(0), focus: true, note: 'Phân bổ lại ngân sách cho các ngày Mega cuối tháng', done: false }
        ] : [],
        masContent: withSample ? [
          { id: 'c1', title: 'Angle: Live Arrival Guarantee 100% AU', channel: 'FB Ads', status: 'In Production', priority: 'High', pic: 'Design / Video', deadline: offsetDate(2), link: '', note: 'Hook 3s đầu quay cảnh mở hộp tép cảnh khỏe mạnh tại Sydney' }
        ] : [],
        ecoTracking: [
          { id: 'et1', brand: 'OAP Skin', format: 'Livestream', target: 792356008, spend: 0, revenue: 0, maxCir: 14.6 },
          { id: 'et2', brand: 'Lifebuoy', format: 'Livestream', target: 3245884902, spend: 0, revenue: 0, maxCir: 13.5 },
          { id: 'et3', brand: 'MNY', format: 'Video CPD', target: 2153742912, spend: 0, revenue: 0, maxCir: 7.3 },
          { id: 'et4', brand: 'OAP', format: 'Video CPD', target: 2333699391, spend: 0, revenue: 0, maxCir: 7.3 }
        ],
        ecoLiveSaved: { brand: 'OAP Skin', byBrand: {} },
        ecoLiveLogs: [],
        ecoCustomStreams: [],
        ecoIssues: [
          { id: 'ei1', project: 'Eco', channel: 'Lifebuoy — Livestream', issue: 'Pacing 47.4% & CIR 14.7% (> Trần 13.5%)', rootCause: 'CPM ngày BAU tăng, CTOR khung chiều thấp', nextAction: 'Dồn budget vào ngày Mega/SMG & ghim Hero SKU', pic: 'Squad Ads', due: offsetDate(1), status: 'Open' }
        ],
        flighting: {
          monthKey: mk,
          activeBrush: 'Mega',
          grid: {},
          liveHours: {
            oap_skin_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' },
            lifebuoy_live: { BAU: '10h-14h, 19h-23h', Campaign: '9h-15h, 18h-24h', Mega: '0h-2h, 9h-24h', SMG: '24/24h' }
          },
          customHours: {}
        },
        scheduleBlocks: [
          { id: 'sb1', day: 1, project: 'MAS', time: '09:00 - 11:00', title: 'Check MER, FB/GG ROAS & Search Terms' },
          { id: 'sb2', day: 1, project: 'Eco', time: '14:00 - 16:00', title: 'Review Live CSV & Rephase Budget' }
        ],
        recurringTasks: [
          { id: 'rt1', title: 'Sync MAS Summary & kiểm tra Keyword lỗ', schedule: 'Hàng ngày', done: false },
          { id: 'rt2', title: 'Cập nhật CSV Livestream & đối soát CIR trần', schedule: 'Hàng ngày', done: false }
        ]
      };
    }

    function mergeWorkspaceState(base, incoming) {
      const {authConfig, ...data} = incoming;
      const merged = {
        ...base, ...data,
        masSheetConfig: {...base.masSheetConfig, ...data.masSheetConfig},
        flighting: {...base.flighting, ...data.flighting},
        ecoLiveSaved: {...base.ecoLiveSaved, ...data.ecoLiveSaved}
      };
      merged.tasks = (merged.tasks || []).map(task => ({...task, due: task.due || task.deadline || ''}));
      merged.masContent = (merged.masContent || []).map(item => ({...item, note: item.note || item.hook || ''}));
      if (!Object.hasOwn(data, 'ecoIssues') && Array.isArray(data.issues)) {
        merged.ecoIssues = data.issues.map(issue => ({
          ...issue, channel: issue.channel || issue.brand || '',
          nextAction: issue.nextAction || issue.action || '', due: issue.due || issue.deadline || ''
        }));
      }
      if (merged.masSubTab === 'deepdive') merged.masSubTab = 'fb_deepdive';
      if (merged.activeTab === 'report') merged.activeTab = 'overview';
      if (!Array.isArray(merged.ecoLiveLogs)) merged.ecoLiveLogs = [];
      const savedLive = merged.ecoLiveSaved;
      if (savedLive.brand && Array.isArray(savedLive.rows)) {
        const {filename, rows, benchmarks, ...settings} = savedLive;
        merged.ecoLiveSaved = {
          ...settings,
          byBrand: {[savedLive.brand]: {filename, rows, benchmarks}, ...savedLive.byBrand}
        };
      }
      const streams = Array.isArray(merged.ecoCustomStreams) ? merged.ecoCustomStreams : [];
      const previousBrands = Array.isArray(merged.ecoLiveLogBrands) ? merged.ecoLiveLogBrands : [];
      merged.ecoCustomStreams = normalizeEcoCustomStreams([
        ...streams, ...previousBrands.map(brand => ({brand, format: 'Livestream'}))
      ]);
      delete merged.ecoLiveLogBrands;
      if (merged.ecoSubTab === 'live_log') merged.ecoSubTab = 'live_issues';
      if (!['live_deepdive', 'tracking', 'rephasing', 'issues', 'live_issues'].includes(merged.ecoSubTab)) {
        merged.ecoSubTab = 'live_deepdive';
      }
      if (!merged.masSheetConfig.webAppUrl) {
        merged.masSheetConfig.webAppUrl = localStorage.getItem(SAVED_URL_KEY) || DEFAULT_WEB_APP_URL;
      }
      return merged;
    }

    let state = (() => {
      try {
        const oldEco = localStorage.getItem(STORAGE_KEY);
        if (oldEco) return mergeWorkspaceState(createDefaultState(false), JSON.parse(oldEco));
        const priorMas = localStorage.getItem(PRIOR_MAS_STORAGE_KEY);
        if (priorMas) return mergeWorkspaceState(createDefaultState(false), JSON.parse(priorMas));
      } catch (_) {}
      return createDefaultState(true);
    })();

    function restoreEcoCsvView() {
      ecoLiveCsvState.brand = state.ecoLiveSaved.brand || 'OAP Skin';
      const saved = getSavedEcoLiveBrand(ecoLiveCsvState.brand) || {};
      ecoLiveCsvState.filename = saved.filename || '';
      ecoLiveCsvState.rows = saved.rows || [];
      ecoLiveCsvState.benchmarks = saved.benchmarks || {};
    }

    restoreEcoCsvView();

    function updateCloudSyncBadge(text, busy = false) {
      const el = document.getElementById('cloud-sync-time');
      if (!el) return;
      el.textContent = text;
      el.className = busy
        ? 'font-semibold text-amber-600 dark:text-amber-400'
        : 'font-semibold text-emerald-600 dark:text-emerald-400';
    }

    function saveState(skipCloud = false) {
      try {
        const config = state.masSheetConfig;
        const url = config?.webAppUrl && getMasWebAppUrl(config.webAppUrl);
        if (url && masDurableSnapshotUrl === url) {
          const {summaryRows, dailyAggRows, deepdive, ...settings} = config;
          localStorage.setItem(STORAGE_KEY, JSON.stringify({...state, masSheetConfig: settings}));
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
      } catch (e) {
        try {
          const {summaryRows, dailyAggRows, deepdive, ...settings} = state.masSheetConfig;

    function accessMasSnapshot(url, snapshot) {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open('mas-command-center-reports', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('snapshots');
        open.onblocked = () => reject(new Error('Bộ nhớ đang được dùng ở tab khác.'));
        open.onerror = () => reject(open.error);
        open.onsuccess = () => {
          const db = open.result;
          const transaction = db.transaction('snapshots', snapshot ? 'readwrite' : 'readonly');
          const store = transaction.objectStore('snapshots');
          const request = snapshot ? store.put(snapshot, url) : store.get(url);
          transaction.oncomplete = () => {
            db.close();
            resolve(request.result);
          };
          transaction.onabort = () => {
            db.close();
            reject(transaction.error);
          };
        };
      });
    }

    function masSydneyToday() {
      const parts = new Intl.DateTimeFormat('en', {
        timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(({type, value}) => [type, value]));
      return values.year + '-' + values.month + '-' + values.day;
    }

    function masRefreshFrom(day) {

    }

    function getMasWebAppUrl(savedUrl) {
      let url;
      try { url = new URL(savedUrl); } catch (_) {}
      const validPath = /^\/(?:a\/macros\/[^/]+\/|macros\/)s\/[\w-]+\/exec$/;
      if (!url || url.origin !== 'https://script.google.com' || !validPath.test(url.pathname)) {
        throw new Error('Dán URL /exec của Web App trong Apps Script → Deploy → Manage deployments.');
      }
      url.hash = '';
      ['sheet', 'date_from', 'date_to', 'limit', 'offset', '_ts'].forEach(key => url.searchParams.delete(key));
      return url.href;
    }

    async function fetchMasSheetPage(webAppUrl, tab, params = {}, timeoutMs = 25000) {
      const requestUrl = new URL(webAppUrl);
      requestUrl.searchParams.set('sheet', tab);
      requestUrl.searchParams.set('_ts', String(Date.now()));
      Object.entries(params).forEach(([key, value]) => requestUrl.searchParams.set(key, value));
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      let response;
      let data;
      try {
        response = await fetch(requestUrl, {signal: controller.signal});
        if (!response.ok) {
          const error = new Error('Web App trả về HTTP ' + response.status + '.');
          error.tryPages = [413, 502, 503, 504].includes(response.status);
          throw error;
        }
        data = await response.json();
      } catch (err) {
        if (controller.signal.aborted) {
          const error = new Error('Web App mất hơn ' + (timeoutMs / 1000) + ' giây để trả dữ liệu.');
          error.tryPages = true;
          throw error;
        }
        if (!response) throw new Error('Trình duyệt không kết nối được Web App. Kiểm tra URL /exec và quyền truy cập.');
        if (!response.ok) throw err;
        throw new Error('Web App không trả JSON. Kiểm tra tài khoản Google và quyền truy cập.');
      } finally {
        clearTimeout(timeout);
      }
      if (data?.error) throw new Error(data.error);
      if (!Array.isArray(data?.rows) || data.sheet !== tab) {
        throw new Error('Phản hồi không đúng định dạng dữ liệu của tab.');
      }
      return data;
    }

    async function fetchMasDetailRows(url, tab, dates, current) {
      if (!current()) return null;
      const searchTerms = tab === 'GG_Ads_Search_Term';
      if (!searchTerms || dates.date_from || dates.date_to) {
        try {
          const {rows, totalRows} = await fetchMasSheetPage(url, tab, dates, 60000);
          if (rows.length <= 1 && totalRows === undefined) return rows;
          if (Number.isInteger(totalRows) && Math.max(0, rows.length - 1) === totalRows) return rows;
        } catch (err) {
          if (!err.tryPages) throw err;
        }
      }
      return fetchMasDetailPages(url, tab, dates, current, searchTerms);
    }

    async function fetchMasDetailPages(url, tab, dates, current, physicalPages = false) {
      const requestDates = physicalPages ? {} : dates;
      const filterLocally = physicalPages && (dates.date_from || dates.date_to);
      const limits = physicalPages ? [1000, 250, 80] : [1000, 250];
      let attemptSize = 0;
      let total;
      const rows = [];
      for (let offset = 0; current();) {
        let page;
        try {
          page = await fetchMasSheetPage(url, tab, {...requestDates, limit: limits[attemptSize], offset}, 60000);
        } catch (err) {
          if (!err.tryPages || attemptSize === limits.length - 1) {
            if (physicalPages && err.tryPages) throw new Error('Trang bắt đầu ở dòng ' + (offset + 2) + ': ' + err.message);
            throw err;
          }
          attemptSize++;
          continue;
        }
        if (!Number.isInteger(page.totalRows)) {
          if (offset === 0 && page.rows.length <= 1) return page.rows;
          throw new Error('Web App chưa trả số dòng phân trang.');
        }
        if (offset === 0) {
          total = page.totalRows;
          if (page.rows[0]) rows.push(page.rows[0]);
        } else if (page.totalRows !== total || JSON.stringify(page.rows[0]) !== JSON.stringify(rows[0])) {
          throw new Error('Tab thay đổi trong lúc tải. Bấm Sync để thử lại.');
        }
        const body = page.rows.slice(1);
        const loaded = offset + body.length;
        if (loaded > total || (loaded <= offset && loaded !== total)) {
          throw new Error('Web App trả thiếu dữ liệu phân trang.');
        }
        for (const row of body) {
          if (filterLocally) {
            const day = normalizeDateToISO(row[0]);
            if (!day || (dates.date_from && day < dates.date_from) || (dates.date_to && day > dates.date_to)) continue;
          }
          rows.push(row);
        }
        if (loaded === total) return rows;
        offset = loaded;
      }
      return null;
    }

    function mergeMasReportRows(previous, incoming) {
      if (incoming.length <= 1) return previous;
      const days = new Map();
      for (const row of incoming.slice(1)) {
        const day = normalizeDateToISO(row[0]);
        if (!day) throw new Error('Web App trả về dòng thiếu ngày.');
        if (!days.has(day)) days.set(day, []);
        days.get(day).push(row);
      }
      const retained = new Map();
      for (const row of previous.slice(1)) {
        const day = normalizeDateToISO(row[0]);
        if (days.has(day)) continue;
        if (!retained.has(day)) retained.set(day, []);
        retained.get(day).push(row);
      }
      const partitions = new Map([...retained, ...days]);
      const rows = [incoming[0]];
      [...partitions.keys()].sort().reverse().forEach(day => {
        partitions.get(day).forEach(row => rows.push(row));
      });
      return rows;
    }

    async function refreshMasDetail(url, tab, previous, today, current) {
      if (!previous) {
        const rows = await fetchMasDetailRows(url, tab, {}, current);
        return rows === null ? null : {rows, through: today};
      }
      const from = masRefreshFrom(today);
      const date_from = previous.through < from ? previous.through : from;
      const incoming = await fetchMasDetailRows(url, tab, {date_from, date_to: today}, current);
      if (incoming === null) return null;
      if (incoming.length && JSON.stringify(incoming[0]) !== JSON.stringify(previous.rows[0])) {
        const rows = await fetchMasDetailRows(url, tab, {}, current);
        return rows === null ? null : {rows, through: today};
      }
      return {rows: mergeMasReportRows(previous.rows, incoming), through: today};
    }

      MAS_DETAIL_TABS.forEach(tab => {

    async function syncMasFromGoogleSheet(silent = false) {
      const config = state.masSheetConfig;
      const savedUrl = config?.webAppUrl;
      if (!savedUrl) {
        if (!silent) showToast('Vui lòng nhập Google Apps Script Web App URL!', 'error');
        return;
      }
      if (masSyncInFlight?.config === config && masSyncInFlight.savedUrl === savedUrl) {
        if (!silent) showToast('Đang đồng bộ các tab MAS…', 'info');
        return;
      }
      const run = ++masSyncRun;
      masSyncInFlight = {run, config, savedUrl};
      const current = () => run === masSyncRun && state.masSheetConfig === config && config.webAppUrl === savedUrl;
      masSyncStatus = 'Đang mở bản sao dữ liệu MAS…';
      render();

      try {
        const url = getMasWebAppUrl(savedUrl);
        let snapshot = masMemorySnapshot?.url === url ? masMemorySnapshot : null;
        if (!snapshot) {
          try {
            snapshot = await accessMasSnapshot(url);
            if (snapshot) masDurableSnapshotUrl = url;
          } catch (_) {}
        }
        if (!current()) return;
        if (snapshot) showMasSnapshot(config, snapshot);
        const next = {
          url,
          summary: snapshot?.summary || config.summaryRows || [],
          summaryAt: snapshot?.summaryAt || config.lastSync || '',
          details: {...snapshot?.details}
        };
        const failures = [];
        let updated = 0;
        masSyncStatus = snapshot ? 'Đã mở bản sao. Đang tải thay đổi…' : 'Đang tải bản đầu tiên từ Google Sheet…';
        render();
        try {
          const {rows} = await fetchMasSheetPage(url, 'MAS_Summary');
          if (rows.length <= 1) throw new Error('Tab MAS_Summary chưa có dữ liệu.');
          next.summary = rows;
          next.summaryAt = new Date().toLocaleString('vi-VN');
          updated++;
          if (!current()) return;
          showMasSnapshot(config, next);
          render();
        } catch (err) {
          failures.push('MAS_Summary — ' + err.message);
        }
        const today = masSydneyToday();
        for (let i = 0; i < MAS_DETAIL_TABS.length && current(); i += 3) {
          const batch = MAS_DETAIL_TABS.slice(i, i + 3);
          await Promise.all(batch.map(async tab => {
            try {
              const report = await refreshMasDetail(url, tab, next.details[tab], today, current);
              if (!report || !current()) return;
              next.details[tab] = report;
              updated++;
            } catch (err) {
              failures.push(tab + ' — ' + err.message);
            }
          }));
          if (!current()) return;
          masSyncStatus = 'Đã xử lý ' + Math.min(i + batch.length, MAS_DETAIL_TABS.length) +
            '/' + MAS_DETAIL_TABS.length + ' tab chi tiết…';
          showMasSnapshot(config, next);
          render();
        }
        if (!current()) return;
        let stored = false;
        if (updated) {
          masMemorySnapshot = next;
          try {
            await accessMasSnapshot(url, next);
            masDurableSnapshotUrl = url;
            stored = true;
          } catch (_) {}
        }
        if (!current()) return;
        const backupStatus = stored ? 'Đã lưu bản sao trong trình duyệt.'
          : updated ? 'Trình duyệt chưa lưu được bản sao.' : '';
        masSyncStatus = failures.length ? 'Lỗi ở ' + failures.join(' · ') + ' ' + backupStatus
          : 'Đã đồng bộ tất cả tab. ' + backupStatus;
        saveState(true);
        render();
        if (!silent) showToast(masSyncStatus, failures.length || !stored ? 'error' : 'success');
      } catch (err) {
        if (!current()) return;
        masSyncStatus = 'Lỗi đồng bộ. ' + err.message;
        render();
        if (!silent) showToast(masSyncStatus, 'error');
      } finally {
        if (masSyncInFlight?.run === run) masSyncInFlight = null;
      }
    }

    function computeShopifyOnlineStoreRow() {
      const shopRows = (state.masSheetConfig?.deepdive?.Shopify_Orders || []).slice(1);
      if (!shopRows.length) return null;

      const dates = shopRows
        .map((r) => String(r[0] || '').trim().slice(0, 10))
        .filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d))
        .sort();
      const todayStr = dates.length ? dates[dates.length - 1] : offsetDate(0);
      let todayObj = new Date(todayStr + 'T12:00:00Z');
      if (isNaN(todayObj.getTime())) todayObj = new Date();
      const yestStr = new Date(todayObj.getTime() - 1 * 86400000).toISOString().slice(0, 10);
      const d7Str = new Date(todayObj.getTime() - 7 * 86400000).toISOString().slice(0, 10);
      const d30Str = new Date(todayObj.getTime() - 30 * 86400000).toISOString().slice(0, 10);

      const sum = { TODAY: 0, YESTERDAY: 0, L7D: 0, L30D: 0, ALL: 0 };
      shopRows.forEach((r) => {
        const dt = String(r[0] || '').trim().slice(0, 10);
        if (!dt) return;
        const src = String(r[3] || r[5] || '').toLowerCase();
        const isOnlineStore = src.includes('online store') || src === 'web' || src.includes('online_store');
        if (!isOnlineStore) return;
        const gmv = parseCsvNumber(r[9]);
        if (!gmv) return;
        sum.ALL += gmv;
        if (dt === todayStr) sum.TODAY += gmv;
        if (dt === yestStr) sum.YESTERDAY += gmv;
        if (dt >= d7Str && dt <= yestStr) sum.L7D += gmv;
        if (dt >= d30Str && dt <= yestStr) sum.L30D += gmv;
      });

      const fmtUsd = (v) => '$' + (Math.round(v * 100) / 100).toLocaleString('en-US');
      return [
        '  ↳ Shopify Online Store GMV',
        fmtUsd(sum.TODAY),
        fmtUsd(sum.YESTERDAY),
        fmtUsd(sum.L7D),
        fmtUsd(sum.L30D),
        fmtUsd(sum.ALL),
        'Kênh Online Store (Web)'
      ];
    }

    function submitMasTaskModal(e, existingId) {
      e.preventDefault();
      const status = document.getElementById('tm-status').value;
      const rawProg = Math.min(100, Math.max(0, Number(document.getElementById('tm-progress').value) || 0));
      const isDone = status === 'Done' || rawProg === 100;
      const obj = {
        id: existingId || 't_' + Date.now(),
        title: document.getElementById('tm-title').value.trim(),
        project: document.getElementById('tm-project').value,
        tag: document.getElementById('tm-tag').value,
        priority: document.getElementById('tm-priority').value,
        status: isDone ? 'Done' : status,
        progress: isDone ? 100 : rawProg,
        pic: document.getElementById('tm-pic').value.trim() || getCurrentUserPic(),
        due: document.getElementById('tm-deadline').value,
        note: document.getElementById('tm-note').value.trim(),
        done: isDone,
        archived: isDone
      };

      if (existingId) {
        const idx = state.tasks.findIndex((x) => x.id === existingId);
        if (idx !== -1) state.tasks[idx] = {...state.tasks[idx], ...obj};
      } else {
        state.tasks.unshift(obj);
      }
      saveState();
      closeModal();
      render();
      showToast(isDone ? 'Task hoàn thành & đã tự động lưu trữ!' : 'Đã lưu Task!', 'success');
    }

    function toggleMasTaskDone(id) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      const nextDone = !(t.done || t.archived || t.status === 'Done');
      t.done = nextDone;
      t.archived = nextDone;
      t.status = nextDone ? 'Done' : 'Doing';
      t.progress = nextDone ? 100 : Math.min(90, t.progress || 50);
      saveState();
      render();
      showToast(nextDone ? 'Đã hoàn thành & chuyển sang Archive!' : 'Đã khôi phục Task về Đang chạy!', 'info');
    }

    function updateMasTaskStatus(id, status) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      t.status = status;
      if (status === 'Done') {
        t.done = true;
        t.archived = true;
        t.progress = 100;
      } else {
        t.done = false;
        t.archived = false;
      }
      saveState();
      render();
    }

    function updateMasTaskProgress(id, val) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      const p = Math.min(100, Math.max(0, Number(val) || 0));
      t.progress = p;
      if (p === 100) {
        t.status = 'Done';
        t.done = true;
        t.archived = true;
      } else if (t.status === 'Done') {
        t.status = 'Doing';
        t.done = false;
        t.archived = false;
      }
      saveState();
      render();
    }

      state.tasks = state.tasks.filter((x) => x.id !== id);

    function renderMasSummaryTable() {
