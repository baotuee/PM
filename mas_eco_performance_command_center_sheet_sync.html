                          <input value="${Math.round(r.revenue)}" onchange="updateEcoTargetField('${r.id}', 'revenue', this.value)" class="w-36 px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-right font-bold text-emerald-600" />
                        </td>
                        <td class="px-3 py-3 text-right font-extrabold ${pacing >= 90 ? 'text-emerald-600' : 'text-amber-600'}">${pacing.toFixed(1)}%</td>
                        <td class="px-3 py-3 text-right whitespace-nowrap">
                          <span class="font-extrabold ${cirOk ? 'text-emerald-600' : 'text-rose-600'}">${cir.toFixed(1)}%</span> /
                          <input value="${r.maxCir}" onchange="updateEcoTargetField('${r.id}', 'maxCir', this.value)" class="w-14 px-1.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-right font-bold" />%
                        </td>
                        <td class="px-4 py-3 text-right">
                          <button data-brand="${escapeHtml(r.brand)}" data-format="${escapeHtml(r.format)}" onclick="pushLiveDayToIssue(this.dataset.brand, this.dataset.format, ${pacing}, ${cir}, ${r.maxCir})" class="text-rose-600 font-bold hover:underline">+ Issue</button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    let ecoRephaseState = {
      channel: 'OAP Skin — Livestream',
      mode: 'balanced',
      customBudget: null,
      customSpent: null
    };

    function getRephasingBaseline(channel, mk) {
      const rows = getEcoMonthRows(mk);
      const targetRow = rows.find(row => ecoStreamLabel(row) === channel);
      const streamObj = getEcoStreams().find(stream => ecoStreamLabel(stream) === channel) || FLIGHTING_STREAMS[0];

      const totalBudget = targetRow ? (targetRow.target * (targetRow.maxCir / 100)) : 0;
      const actualSpent = targetRow ? targetRow.spend : 0;
      const actualRev = targetRow ? targetRow.revenue : 0;
      const maxCir = targetRow ? targetRow.maxCir : 14.0;
      const targetGmv = targetRow ? targetRow.target : 0;

      const dailyList = (state.ecoDailyActuals?.[mk]?.[channel]) || [];
      const tiers = ['BAU', 'Campaign', 'Mega', 'SMG'];
      const tierStats = {};

      let numWithin = 0;
      let denWithin = 0;
      tiers.forEach((t) => {
        const sub = dailyList.filter((d) => (d.tier || getTierForDate(streamObj.id, d.date)) === t && d.spend > 0 && d.revenue > 0);
        if (sub.length >= 2) {
          const lnS = sub.map((d) => Math.log(d.spend));
          const lnG = sub.map((d) => Math.log(d.revenue));
          const mS = lnS.reduce((a, b) => a + b, 0) / lnS.length;
          const mG = lnG.reduce((a, b) => a + b, 0) / lnG.length;
          for (let i = 0; i < sub.length; i++) {
            numWithin += (lnS[i] - mS) * (lnG[i] - mG);
            denWithin += (lnS[i] - mS) * (lnS[i] - mS);
          }
        }
      });
      const rawBeta = denWithin > 0 ? numWithin / denWithin : 0.76;
      const baseBeta = Math.max(0.55, Math.min(0.88, rawBeta));

      const defaultMultipliers = { BAU: 1.0, Campaign: 1.5, Mega: 2.2, SMG: 3.0 };
      const fallbackDailySpend = totalBudget > 0 ? totalBudget / 35 : 5000000;
      const fallbackRoas = actualSpent > 0 && actualRev > 0 ? actualRev / actualSpent : (maxCir > 0 ? 100 / maxCir : 7);

      tiers.forEach((t, idx) => {
        const sub = dailyList.filter((d) => (d.tier || getTierForDate(streamObj.id, d.date)) === t && d.spend > 0);
        const beta = Math.max(0.52, Math.min(0.88, baseBeta + (idx - 1) * 0.02));
        if (sub.length) {
          const avgSpend = sub.reduce((s, d) => s + d.spend, 0) / sub.length;
          const avgGmv = sub.reduce((s, d) => s + d.revenue, 0) / sub.length;
          const cir = avgGmv > 0 ? (avgSpend / avgGmv) * 100 : maxCir;
          const roas = avgSpend > 0 ? avgGmv / avgSpend : fallbackRoas;
          const sortedSpends = sub.map((d) => d.spend).sort((a, b) => a - b);
          const p80 = sortedSpends[Math.min(sortedSpends.length - 1, Math.floor(sortedSpends.length * 0.8))];
          const feasibleCap = Math.min(avgSpend * 1.30, p80 * 1.15);
          tierStats[t] = {
            count: sub.length,
            isEstimated: false,
            avgSpend,
            avgGmv,
            cir,
            roas,
            beta,
            mRoas: beta * roas,
            feasibleCap
          };
        } else {
          const mult = defaultMultipliers[t];
          const avgSpend = fallbackDailySpend * mult;
          const avgGmv = avgSpend * fallbackRoas;
          tierStats[t] = {
            count: 0,
            isEstimated: true,
            avgSpend,
            avgGmv,
            cir: fallbackRoas > 0 ? 100 / fallbackRoas : maxCir,
            roas: fallbackRoas,
            beta,
            mRoas: beta * fallbackRoas,
            feasibleCap: avgSpend * 1.25
          };
        }
      });

      const bauBase = tierStats.BAU.avgSpend * Math.max(0.5, tierStats.BAU.mRoas);
      tiers.forEach((t) => {
        const cur = tierStats[t];
        const rawW = bauBase > 0 ? (cur.avgSpend * Math.max(0.5, cur.mRoas)) / bauBase : defaultMultipliers[t];
        cur.normWeight = t === 'BAU' ? 1.0 : Math.max(1.1, rawW);
      });

      return { targetRow, streamObj, totalBudget, actualSpent, actualRev, maxCir, targetGmv, dailyList, baseBeta, tierStats };
    }

    function renderEcoRephasing() {
      const mk = state.ecoTrackingMonth || getCurrentMonthKey();
      syncEcoTrackingFromDailyActuals(mk);
      if (!getEcoStreams().some(stream => ecoStreamLabel(stream) === ecoRephaseState.channel)) {
        ecoRephaseState.channel = ecoStreamLabel(getEcoStreams()[0]);
      }
      const info = getRephasingBaseline(ecoRephaseState.channel, mk);

      const budget = ecoRephaseState.customBudget !== null ? ecoRephaseState.customBudget : Math.round(info.totalBudget);
      const spent = ecoRephaseState.customSpent !== null ? ecoRephaseState.customSpent : Math.round(info.actualSpent);

      const [yy, mm] = mk.split('-').map(Number);
      const daysInMonth = new Date(yy, mm, 0).getDate();
      const lastActualDay = info.dailyList.length
        ? Math.max(...info.dailyList.map((d) => Number(d.date.slice(8, 10))))
        : 23;

      const remDays = [];
      for (let d = lastActualDay + 1; d <= daysInMonth; d++) {
        const dt = `${mk}-${String(d).padStart(2, '0')}`;
        const tier = getTierForDate(info.streamObj.id, dt);
        remDays.push({ date: dt, tier });
      }

      const rawRemBudget = Math.max(0, budget - spent);
      const curCir = info.actualRev > 0 ? (spent / info.actualRev) * 100 : 0;
      let targetRemBudget = rawRemBudget;
      let gamma = 1.0;

      if (ecoRephaseState.mode === 'max_gmv') {
        gamma = 2.0;
        if (curCir > 0 && curCir < info.maxCir) {
          targetRemBudget = rawRemBudget * 1.15;
        }
      } else if (ecoRephaseState.mode === 'strict_cir') {
        gamma = 1.8;
        if (curCir > info.maxCir) {
          targetRemBudget = rawRemBudget * 0.72;
        } else {
          targetRemBudget = rawRemBudget * 0.92;
        }
      }

      const dayWeights = remDays.map((rd) => {
        const st = info.tierStats[rd.tier] || info.tierStats.BAU;
        const cirFactor = st.cir > 0 ? Math.pow(info.maxCir / st.cir, gamma) : 1;
        return st.normWeight * Math.max(0.45, Math.min(2.2, cirFactor));
      });
      const sumW = dayWeights.reduce((a, b) => a + b, 0) || 1;

      let totalAllocRem = 0;
      let totalProjRemGmv = 0;
      const planRows = remDays.map((rd, idx) => {
        const st = info.tierStats[rd.tier] || info.tierStats.BAU;
        const rawAlloc = targetRemBudget * (dayWeights[idx] / sumW);
        const capped = rawAlloc > st.feasibleCap;
        const alloc = Math.min(rawAlloc, st.feasibleCap);
        const projGmv = st.avgSpend > 0 ? st.avgGmv * Math.pow(alloc / st.avgSpend, st.beta) : 0;
        const projCir = projGmv > 0 ? (alloc / projGmv) * 100 : 0;
        totalAllocRem += alloc;
        totalProjRemGmv += projGmv;
        return { ...rd, weight: st.normWeight, alloc, capped, projGmv, projCir };
      });

      const eomSpend = spent + totalAllocRem;
      const eomGmv = info.actualRev + totalProjRemGmv;
      const eomCir = eomGmv > 0 ? (eomSpend / eomGmv) * 100 : 0;
      const eomPacing = info.targetGmv > 0 ? (eomGmv / info.targetGmv) * 100 : 0;
      const unspentDueToCap = Math.max(0, targetRemBudget - totalAllocRem);

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3 text-xs">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="text-slate-500">
                Nguồn: <strong>${info.dailyList.length} ngày Actual</strong> (${mk}) • Ad Elasticity: <strong class="text-indigo-600">β = ${info.baseBeta.toFixed(2)}</strong> • Trần CIR: <strong>${info.maxCir}%</strong>
              </div>
              <div class="flex items-center gap-2">
                <select onchange="ecoRephaseState.mode=this.value; render();" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                  <option value="balanced" ${ecoRephaseState.mode === 'balanced' ? 'selected' : ''}>Chế độ: Cân bằng GMV &amp; Trần CIR</option>
                  <option value="max_gmv" ${ecoRephaseState.mode === 'max_gmv' ? 'selected' : ''}>Chế độ: Tối đa hóa GMV</option>
                  <option value="strict_cir" ${ecoRephaseState.mode === 'strict_cir' ? 'selected' : ''}>Chế độ: Khống chế chặt Trần CIR (${info.maxCir}%)</option>
                </select>
                <button onclick="ecoRephaseState.customBudget=null; ecoRephaseState.customSpent=null; render();" class="px-3 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 font-bold">Đồng bộ lại từ Target</button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              <div>
                <label class="text-slate-400 block mb-1">Kênh / Brand</label>
                <select onchange="ecoRephaseState.channel=this.value; ecoRephaseState.customBudget=null; ecoRephaseState.customSpent=null; render();" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                  ${renderEcoChannelOptions(ecoRephaseState.channel)}
                </select>
              </div>
              <div>
                <label class="text-slate-400 block mb-1">Tổng Budget trần tháng</label>
                <input value="${budget}" onchange="ecoRephaseState.customBudget=parseCsvNumber(this.value); render();" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
              </div>
              <div>
                <label class="text-slate-400 block mb-1">Đã tiêu (${info.dailyList.length} ngày)</label>
                <input value="${spent}" onchange="ecoRephaseState.customSpent=parseCsvNumber(this.value); render();" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
              </div>
              <div class="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                <div class="text-emerald-700 dark:text-emerald-300 text-[11px]">Ngân sách phân bổ (${remDays.length} ngày)</div>
                <div class="text-base font-extrabold text-emerald-600 mt-0.5">${Math.round(totalAllocRem).toLocaleString('vi-VN')} đ</div>
                ${unspentDueToCap > 0 ? `<div class="text-[10px] text-amber-600">Dư trần hấp thụ: ${formatVnd(unspentDueToCap)}</div>` : ''}
              </div>
              <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800">
                <div class="text-indigo-700 dark:text-indigo-300 text-[11px]">Dự phóng Cuối tháng (EOM)</div>
                <div class="text-sm font-extrabold mt-0.5">GMV: <span class="text-indigo-600">${eomPacing.toFixed(1)}%</span> • CIR: <span class="${eomCir <= info.maxCir ? 'text-emerald-600' : 'text-rose-600'}">${eomCir.toFixed(2)}%</span></div>
                <div class="text-[10px] text-slate-500">Hiện tại: CIR ${curCir.toFixed(2)}% / Trần ${info.maxCir}%</div>
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs">
              <span class="font-bold">Benchmark &amp; Trần hấp thụ theo Day Type (Chuẩn hóa BAU = 1.00x)</span>
              <span class="text-[11px] text-slate-400">Công thức: GMV = AvgGMV × (Alloc / AvgSpend)^β</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-2.5">Day Type</th>
                    <th class="px-3 py-2.5">Số ngày</th>
                    <th class="px-3 py-2.5 text-right">Avg Spend / ngày</th>
                    <th class="px-3 py-2.5 text-right">Trần khả thi / ngày</th>
                    <th class="px-3 py-2.5 text-right">Avg GMV / ngày</th>
                    <th class="px-3 py-2.5 text-right">Actual CIR</th>
                    <th class="px-3 py-2.5 text-right">Elasticity (β)</th>
                    <th class="px-3 py-2.5 text-right">Marginal ROAS</th>
                    <th class="px-4 py-2.5 text-right">Trọng số (vs BAU)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${['BAU', 'Campaign', 'Mega', 'SMG'].map((t) => {
                    const st = info.tierStats[t];
                    return `
                      <tr>
                        <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded font-bold text-[10px] ${TIER_META[t].badge}">${t}</span></td>
                        <td class="px-3 py-2.5 text-slate-500">${st.isEstimated ? 'Ước tính' : st.count + ' ngày'}</td>
                        <td class="px-3 py-2.5 text-right font-semibold">${Math.round(st.avgSpend).toLocaleString('vi-VN')} đ</td>
                        <td class="px-3 py-2.5 text-right text-slate-500">${Math.round(st.feasibleCap).toLocaleString('vi-VN')} đ</td>
                        <td class="px-3 py-2.5 text-right font-bold text-emerald-600">${Math.round(st.avgGmv).toLocaleString('vi-VN')} đ</td>
                        <td class="px-3 py-2.5 text-right font-bold ${st.cir <= info.maxCir ? 'text-emerald-600' : 'text-rose-600'}">${st.cir.toFixed(2)}%</td>
                        <td class="px-3 py-2.5 text-right font-bold text-indigo-600">${st.beta.toFixed(2)}</td>
                        <td class="px-3 py-2.5 text-right">${st.mRoas.toFixed(2)}x</td>
                        <td class="px-4 py-2.5 text-right font-extrabold text-indigo-600">${st.normWeight.toFixed(2)}x</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-3">Ngày còn lại</th>
                    <th class="px-3 py-3">Day Type (Ma trận)</th>
                    <th class="px-3 py-3 text-right">Trọng số tối ưu</th>
                    <th class="px-3 py-3 text-right">Budget đề xuất / ngày</th>
                    <th class="px-3 py-3 text-right">GMV kỳ vọng (theo β)</th>
                    <th class="px-4 py-3 text-right">CIR dự kiến</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${planRows.map((p) => `
                    <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                      <td class="px-4 py-2.5 font-bold">${p.date}</td>
                      <td class="px-3 py-2.5"><span class="px-2 py-0.5 rounded font-bold text-[10px] ${TIER_META[p.tier]?.badge || ''}">${p.tier}</span></td>
                      <td class="px-3 py-2.5 text-right font-semibold">${p.weight.toFixed(2)}x</td>
                      <td class="px-3 py-2.5 text-right font-extrabold text-emerald-600">${Math.round(p.alloc).toLocaleString('vi-VN')} đ ${p.capped ? '<span class="ml-1 px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 text-[9px]">Chạm trần</span>' : ''}</td>
                      <td class="px-3 py-2.5 text-right font-bold text-indigo-600">${Math.round(p.projGmv).toLocaleString('vi-VN')} đ</td>
                      <td class="px-4 py-2.5 text-right font-bold ${p.projCir <= info.maxCir ? 'text-emerald-600' : 'text-amber-600'}">${p.projCir.toFixed(2)}%</td>
                    </tr>
                  `).join('') || '<tr><td colspan="6" class="px-4 py-8 text-center text-slate-400">Không còn ngày trống trong tháng này.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function getEcoLiveIssue(id) {
      return (state.ecoIssues || []).find(issue => issue.liveLogId === id);
    }

    function ecoStreamLabel({brand, format}) {
      return brand + ' — ' + format;
    }

    function normalizeEcoCustomStreams(streams) {
      const existing = new Set(FLIGHTING_STREAMS.map(stream => ecoStreamLabel(stream).toLowerCase()));
      const added = [];
      for (const entry of streams) {
        const brand = String(entry?.brand || '').trim();
        const format = entry?.format;
        if (!brand || !['Livestream', 'Video CPD'].includes(format)) continue;
        const key = ecoStreamLabel({brand, format}).toLowerCase();
        if (existing.has(key)) continue;
        const isLive = format === 'Livestream';
        const code = [...brand.toLowerCase()].map(char => char.codePointAt(0).toString(36)).join('_');
        added.push({id: 'eco_' + code + (isLive ? '_live' : '_cpd'), brand, format, isLive});
        existing.add(key);
      }
      return added;
    }

    function getEcoStreams() {
      return [...FLIGHTING_STREAMS, ...(state.ecoCustomStreams || [])];
    }

    function renderEcoChannelOptions(selected) {
      return getEcoStreams().map(stream => {
        const label = ecoStreamLabel(stream);
        return `<option value="${escapeHtml(label)}" ${label === selected ? 'selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function renderEcoLiveLogBrandOptions() {
      const brands = new Map();
      getEcoStreams().forEach(({brand}) => {
        if (!brands.has(brand.toLowerCase())) brands.set(brand.toLowerCase(), brand);
      });
      return [...brands.values()].map(brand => `<option value="${escapeHtml(brand)}"></option>`).join('');
    }

    function openEcoBrandModal(fromLog = false) {
      openModal(`
        <form onsubmit="saveEcoBrand(event, ${fromLog})" class="space-y-3 text-xs">
          <h3 class="text-sm font-bold">Thêm Brand • Workspace Eco</h3>
          <label for="new-live-log-brand" class="block font-semibold">Tên brand</label>
          <input id="new-live-log-brand" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
          <label for="new-eco-brand-format" class="block font-semibold">Định dạng</label>
          <select id="new-eco-brand-format" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
            <option value="Livestream">Livestream</option>
            <option value="Video CPD">Video CPD</option>
          </select>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700">Hủy</button>
            <button type="submit" class="px-3 py-2 rounded-xl bg-emerald-600 text-white font-semibold">Lưu Brand</button>
          </div>
        </form>
      `);
    }

    function saveEcoBrand(event, fromLog = false) {
      event.preventDefault();
      const name = document.getElementById('new-live-log-brand').value.trim();
      const format = document.getElementById('new-eco-brand-format').value;
      if (!name || !['Livestream', 'Video CPD'].includes(format)) {
        showToast('Nhập tên brand và chọn định dạng.', 'error');
        return;
      }

      const streams = state.ecoCustomStreams || [];
      const next = normalizeEcoCustomStreams([...streams, {brand: name, format}]);
      const added = next.length > streams.length;
      state.ecoCustomStreams = next;
      const selected = getEcoStreams().find(stream => stream.brand.toLowerCase() === name.toLowerCase() && stream.format === format);
      if (added) saveState();
      closeModal();
      if (fromLog) {
        const options = document.getElementById('live-log-brands');
        const input = document.getElementById('live-log-brand');
        if (options) options.innerHTML = renderEcoLiveLogBrandOptions();
        if (input) input.value = selected.brand;
      } else {
        render();
      }
      showToast(added ? 'Đã lưu brand vào Workspace Eco.' : 'Brand đã có ở định dạng này.', added ? 'success' : 'info');
    }

    function renderEcoLiveIssueLog() {
      const logs = state.ecoLiveLogs || [];
      return `
        <div class="space-y-4 text-xs">
          <form onsubmit="addEcoLiveIssueLog(event)" class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 grid gap-3 sm:grid-cols-2">
            <div class="sm:col-span-2">
              <label for="live-log-brand" class="block font-semibold mb-1">Brand</label>
              <div class="flex items-center gap-2">
                <input id="live-log-brand" list="live-log-brands" required placeholder="Chọn hoặc nhập brand" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                <button type="button" onclick="openEcoBrandModal(true)" class="shrink-0 px-3 py-2 rounded-xl border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 font-semibold">+ Thêm Brand</button>
              </div>
              <datalist id="live-log-brands">${renderEcoLiveLogBrandOptions()}</datalist>
            </div>
            <div>
              <label for="live-log-session" class="block font-semibold mb-1">Phiên livestream</label>
              <input id="live-log-session" placeholder="VD: Ca 19h" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
            <div>
              <label for="live-log-owner" class="block font-semibold mb-1">PIC</label>
              <input id="live-log-owner" value="${escapeHtml(getCurrentUserPic())}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
            <div>
              <label for="live-log-issue" class="block font-semibold mb-1">Vấn đề trong phiên</label>
              <textarea id="live-log-issue" required rows="2" placeholder="VD: Mã giảm giá chưa áp dụng ở giỏ hàng" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"></textarea>
            </div>
            <div>
              <label for="live-log-action" class="block font-semibold mb-1">Đã xử lý / Bước tiếp theo</label>
              <textarea id="live-log-action" rows="2" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800"></textarea>
            </div>
            <div class="sm:col-span-2 flex justify-end">
              <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold">Ghi issue</button>
            </div>
          </form>

          <div class="overflow-x-auto rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800">
            <table class="w-full min-w-[680px] text-left">
              <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                <tr>
                  <th class="px-4 py-3">Giờ Việt Nam</th>
                  <th class="px-3 py-3">Brand / Phiên / PIC</th>
                  <th class="px-3 py-3">Vấn đề</th>
                  <th class="px-3 py-3">Hướng xử lý</th>
                  <th class="px-3 py-3">Trạng thái</th>
                  <th class="px-4 py-3 text-right">Theo dõi</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${logs.map(log => {
                  const issue = getEcoLiveIssue(log.id);
                  const status = issue?.status || log.status || 'Open';
                  return `
                    <tr>
                      <td class="px-4 py-3 whitespace-nowrap font-semibold">${escapeHtml(log.time)}<div class="text-slate-400">${escapeHtml(log.date)}</div></td>
                      <td class="px-3 py-3 font-semibold">${escapeHtml(log.brand)}<div class="font-normal text-slate-500">${escapeHtml([log.session, log.pic].filter(Boolean).join(' · ') || '—')}</div></td>
                      <td class="px-3 py-3 whitespace-pre-wrap">${escapeHtml(log.content)}</td>
                      <td class="px-3 py-3 whitespace-pre-wrap">${escapeHtml(issue?.nextAction || log.action || '—')}</td>
                      <td class="px-3 py-3">
                        <select data-live-id="${escapeHtml(log.id)}" aria-label="Trạng thái issue livestream" onchange="setEcoLiveIssueStatus(this.dataset.liveId, this.value)" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
                          ${[['Open', 'Mới'], ['In Progress', 'Đang xử lý'], ['Resolved', 'Đã xử lý']].map(([value, text]) =>
                            `<option value="${value}" ${status === value ? 'selected' : ''}>${text}</option>`).join('')}
                        </select>
                      </td>
                      <td class="px-4 py-3">
                        <div class="flex flex-wrap items-center justify-end gap-2 whitespace-nowrap">
                          ${issue
                            ? '<span class="text-slate-500">Đã chuyển</span>'
                            : `<button type="button" data-live-id="${escapeHtml(log.id)}" onclick="sendEcoLiveLogToIssues(this.dataset.liveId)" class="px-2 py-1 rounded-lg bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 font-semibold">Chuyển sang Issues</button>`}
                          <button type="button" data-live-id="${escapeHtml(log.id)}" onclick="openDeleteEcoLiveLog(this.dataset.liveId)" class="px-2 py-1 rounded-lg text-rose-600 hover:bg-rose-50 dark:text-rose-400 dark:hover:bg-rose-950 font-semibold">Xóa log</button>
                        </div>
                      </td>
                    </tr>
                  `;
                }).join('') || '<tr><td colspan="6" class="px-4 py-6 text-center text-slate-400">Chưa có issue livestream.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addEcoLiveIssueLog(event) {
      event.preventDefault();
      const value = id => document.getElementById(id).value.trim();
      const brand = value('live-log-brand');
      const content = value('live-log-issue');
      if (!brand || !content) {
        showToast('Nhập brand và nội dung issue.', 'error');
        return;
      }
      const now = new Date();
      const timeZone = 'Asia/Ho_Chi_Minh';
      const date = now.toLocaleDateString('vi-VN', {timeZone, day: '2-digit', month: '2-digit', year: 'numeric'});
      const time = now.toLocaleTimeString('vi-VN', {timeZone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
      state.ecoLiveLogs.unshift({
        id: 'live_' + (globalThis.crypto?.randomUUID?.() || now.getTime() + '_' + Math.random().toString(36).slice(2)),
        date, time, brand, session: value('live-log-session'), content, action: value('live-log-action'),
        pic: value('live-log-owner') || getCurrentUserPic(), status: 'Open'
      });
      saveState();
      render();
      showToast('Đã ghi issue livestream.', 'success');
    }

    function setEcoLiveIssueStatus(id, status) {
      if (!['Open', 'In Progress', 'Resolved'].includes(status)) return;
      const log = state.ecoLiveLogs.find(entry => entry.id === id);
      if (!log) return;
      log.status = status;
      const issue = getEcoLiveIssue(id);
      if (issue) issue.status = status;
      saveState();
      render();
    }

    function openDeleteEcoLiveLog(id) {
      const log = (state.ecoLiveLogs || []).find(entry => entry.id === id);
      if (!log) return;
      openModal(`
        <div class="space-y-3 text-xs">
          <h3 class="text-sm font-bold">Xóa log livestream?</h3>
          <p class="text-slate-600 dark:text-slate-300">${escapeHtml(log.brand)} · ${escapeHtml(log.time)} · ${escapeHtml(log.date)}</p>
          <p class="whitespace-pre-wrap break-words">${escapeHtml(log.content)}</p>
          ${getEcoLiveIssue(id) ? '<p class="text-slate-500">Issue đã chuyển vẫn xuất hiện trong Issues &amp; Action Plan.</p>' : ''}
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700">Hủy</button>
            <button type="button" data-live-id="${escapeHtml(id)}" onclick="deleteEcoLiveLog(this.dataset.liveId)" class="px-3 py-2 rounded-xl bg-rose-600 text-white font-semibold">Xóa log</button>
          </div>
        </div>
      `);
    }

    function deleteEcoLiveLog(id) {
      const logs = state.ecoLiveLogs || [];
      const remaining = logs.filter(entry => entry.id !== id);
      if (remaining.length === logs.length) return;
      state.ecoLiveLogs = remaining;
      saveState();
      closeModal();
      render();
      showToast('Đã xóa log livestream.', 'success');
    }

    function sendEcoLiveLogToIssues(id) {
      const log = state.ecoLiveLogs.find(entry => entry.id === id);
      if (!log || getEcoLiveIssue(id)) return;
      state.ecoIssues ||= [];
      state.ecoIssues.unshift({
        id: 'issue_' + id, liveLogId: id, project: 'Eco', channel: [log.brand, log.session].filter(Boolean).join(' · '),
        issue: log.content, rootCause: '', nextAction: log.action || '',
        pic: log.pic, due: '', status: log.status || 'Open'
      });
      saveState();
      render();
      showToast('Đã chuyển sang Issues & Action Plan.', 'success');
    }

    function renderEcoIssues() {
      const issues = (state.ecoIssues || []).filter(issue => issue.project !== 'MAS');
      return `
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3 text-xs">
          <div class="flex items-center justify-between">
            <h3 class="font-bold">Deepdive Issue &amp; Action Plan (${issues.length})</h3>
            <button onclick="openNewIssueModal()" class="px-3.5 py-1.5 rounded-xl bg-rose-600 text-white font-semibold">+ Thêm Issue</button>
          </div>
          <div class="divide-y divide-slate-100 dark:divide-slate-800">
            ${issues.map((i) => `
              <div class="py-3 flex flex-wrap items-center justify-between gap-3">
                <div class="space-y-0.5">
                  <div class="font-extrabold text-rose-600">${escapeHtml(i.channel)} — ${escapeHtml(i.issue)}</div>
                  <div class="text-slate-500">Root cause: ${escapeHtml(i.rootCause)} • Next: <strong>${escapeHtml(i.nextAction)}</strong></div>
                </div>
                <select onchange="updateIssueStatus('${i.id}', this.value)" class="px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                  ${['Open', 'In Progress', 'Resolved'].map((st) => `<option value="${st}" ${i.status === st ? 'selected' : ''}>${st}</option>`).join('')}
                </select>
              </div>
            `).join('') || '<p class="text-slate-400 py-8 text-center">Chưa có issue nào được ghi nhận.</p>'}
          </div>
        </div>
      `;
    }

    function openNewIssueModal() {
      openModal(`
        <h3 class="text-base font-bold mb-3">Thêm Deepdive Issue mới</h3>
        <form onsubmit="submitNewIssue(event)" class="space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Kênh / Brand</label>
            <input id="ni-ch" list="eco-issue-channel-options" placeholder="Chọn hoặc nhập Brand / Kênh" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            <datalist id="eco-issue-channel-options">${renderEcoChannelOptions()}</datalist>
          </div>
          <div>
            <label class="font-bold block mb-1">Vấn đề (Issue)</label>
            <input id="ni-issue" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
          </div>
          <div>
            <label class="font-bold block mb-1">Nguyên nhân (Root Cause)</label>
            <input id="ni-rc" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
          </div>
          <div>
            <label class="font-bold block mb-1">Hành động tiếp theo (Next Action)</label>
            <input id="ni-act" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-semibold">Lưu Issue</button>
          </div>
        </form>
      `);
    }

    function submitNewIssue(e) {
      e.preventDefault();
      state.ecoIssues.unshift({
        id: 'ei_' + Date.now(),
        channel: document.getElementById('ni-ch').value.trim(),
        issue: document.getElementById('ni-issue').value.trim(),
        rootCause: document.getElementById('ni-rc').value.trim(),
        nextAction: document.getElementById('ni-act').value.trim(),
        pic: 'Squad Eco',
        status: 'Open'
      });
      saveState();
      closeModal();
      render();
      showToast('Đã thêm Issue mới!', 'success');
    }

    function updateIssueStatus(id, val) {
      const it = state.ecoIssues.find((i) => i.id === id);
      if (it) { it.status = val; saveState(); }
    }

    function paintTierCell(streamId, dateIso) {
      if (!state.flighting.grid) state.flighting.grid = {};
      if (!state.flighting.grid[streamId]) state.flighting.grid[streamId] = {};
      state.flighting.grid[streamId][dateIso] = state.flighting.activeBrush || 'Mega';
      saveState();
      render();
    }

    function updateDefaultLiveHours(streamId, tier, val) {
      if (!state.flighting.liveHours) state.flighting.liveHours = {};
      if (!state.flighting.liveHours[streamId]) state.flighting.liveHours[streamId] = {};
      state.flighting.liveHours[streamId][tier] = val.trim();
      saveState();
      showToast(`Đã cập nhật giờ Live ${tier}!`, 'success');
    }

    function openCustomDayLiveHoursModal() {
      const mk = state.flighting?.monthKey || state.ecoTrackingMonth || getCurrentMonthKey();
      openModal(`
        <h3 class="text-base font-bold mb-3">Chỉnh khung giờ Live ngày lẻ (${mk})</h3>
        <form onsubmit="saveCustomDayLiveHours(event)" class="space-y-3 text-xs">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="font-bold block mb-1">Kênh Livestream</label>
              <select id="cdh-stream" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                ${getEcoStreams().filter(stream => stream.isLive).map(stream =>
                  `<option value="${escapeHtml(stream.id)}">${escapeHtml(ecoStreamLabel(stream))}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="font-bold block mb-1">Ngày cụ thể</label>
              <input id="cdh-date" type="date" value="${mk}-11" required class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
          </div>
          <div>
            <label class="font-bold block mb-1">Khung giờ Live riêng (để trống nếu dùng lại mặc định Tier)</label>
            <input id="cdh-hours" placeholder="VD: 8h-14h, 19h-24h (11 tiếng)" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold">Lưu giờ Live</button>
          </div>
        </form>
      `);
    }

    function saveCustomDayLiveHours(e) {
      e.preventDefault();
      const sid = document.getElementById('cdh-stream').value;
      const dt = document.getElementById('cdh-date').value;
      const hrs = document.getElementById('cdh-hours').value.trim();
      if (!state.flighting.customHours) state.flighting.customHours = {};
      if (!state.flighting.customHours[sid]) state.flighting.customHours[sid] = {};
      if (hrs) state.flighting.customHours[sid][dt] = hrs;
      else delete state.flighting.customHours[sid][dt];
      saveState();
      closeModal();
      render();
      showToast(`Đã lưu giờ Live riêng cho ngày ${dt}!`, 'success');
    }

    function renderFlighting() {
      const mk = state.flighting?.monthKey || state.ecoTrackingMonth || getCurrentMonthKey();
      const [yy, mm] = mk.split('-').map(Number);
      const daysInMonth = new Date(yy, mm, 0).getDate();
      const brush = state.flighting?.activeBrush || 'Mega';
      const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-bold">Tháng Ma trận:</span>
              <input type="month" value="${mk}" onchange="state.flighting.monthKey=this.value; state.ecoTrackingMonth=this.value; saveState(); render();" class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold" />
              <span class="text-slate-400 ml-2">Chọn cọ tô:</span>
              ${['BAU', 'Campaign', 'Mega', 'SMG', 'Off'].map((t) => `
                <button onclick="state.flighting.activeBrush='${t}'; render();" class="px-3 py-1.5 rounded-xl font-bold transition ${brush === t ? TIER_META[t].cls + ' ring-2 ring-offset-1 ring-indigo-500' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'}">${t}</button>
              `).join('')}
            </div>
            <button onclick="openCustomDayLiveHoursModal()" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white font-semibold">Chỉnh giờ Live ngày lẻ</button>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="overflow-x-auto no-select" onmouseup="isPaintingTier=false" onmouseleave="isPaintingTier=false">
              <table class="w-full text-center text-[11px] border-collapse">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-3 py-2.5 text-left sticky left-0 bg-slate-50 dark:bg-slate-800 z-10 min-w-[140px]">Brand / Kênh</th>
                    ${days.map((d) => `<th class="px-1.5 py-2.5 min-w-[28px]">${d}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${getEcoStreams().map((st) => `
                    <tr>
                      <td class="px-3 py-2.5 text-left font-bold sticky left-0 bg-white dark:bg-slate-900 z-10 border-r border-slate-100 dark:border-slate-800">
                        <div>${escapeHtml(st.brand)}</div>
                        <div class="text-[10px] font-normal text-slate-400">${st.format}</div>
                      </td>
                      ${days.map((d) => {
                        const dt = `${mk}-${String(d).padStart(2, '0')}`;
                        const tier = getTierForDate(st.id, dt);
                        const meta = TIER_META[tier] || TIER_META.BAU;
                        const customH = state.flighting?.customHours?.[st.id]?.[dt];
                        const defaultH = state.flighting?.liveHours?.[st.id]?.[tier] || '';
                        const tip = `${dt} • ${tier}${st.isLive ? ' • Giờ Live: ' + (customH || defaultH) : ''}`;
                        return `
                          <td onmousedown="isPaintingTier=true; paintTierCell('${st.id}', '${dt}')" onmouseenter="if(isPaintingTier) paintTierCell('${st.id}', '${dt}')" title="${escapeHtml(tip)}" class="p-0.5 cursor-pointer">
                            <div class="w-6 h-6 mx-auto rounded-md flex items-center justify-center font-extrabold text-[10px] ${meta.cls} ${customH ? 'ring-2 ring-indigo-500' : ''}">${meta.short}</div>
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 space-y-3 text-xs">
            <h3 class="font-bold">Cấu hình khung giờ Livestream mặc định theo từng Tier</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${getEcoStreams().filter((s) => s.isLive).map((st) => `
                <div class="p-3 rounded-xl border border-slate-100 dark:border-slate-800 space-y-2">
                  <div class="font-extrabold text-emerald-600">${escapeHtml(st.brand)} — Livestream</div>
                  ${['BAU', 'Campaign', 'Mega', 'SMG'].map((t) => {
                    const val = state.flighting?.liveHours?.[st.id]?.[t] || '';
                    return `
                      <div class="flex items-center justify-between gap-2">
                        <span class="px-2 py-0.5 rounded font-bold text-[10px] w-20 text-center ${TIER_META[t].badge}">${t}</span>
                        <input value="${escapeHtml(val)}" onchange="updateDefaultLiveHours('${st.id}', '${t}', this.value)" class="flex-1 px-2.5 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                      </div>
                    `;
                  }).join('')}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderSchedule() {
      const daysMap = { 0: 'Hàng ngày', 1: 'Thứ 2', 2: 'Thứ 3', 3: 'Thứ 4', 4: 'Thứ 5', 5: 'Thứ 6', 6: 'Thứ 7', 7: 'Chủ nhật' };
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
          <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Time-Block Vận hành</h2>
              <button onclick="openScheduleBlockModal()" class="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold">+ Thêm khung giờ</button>
            </div>
            <div class="divide-y divide-slate-100 dark:divide-slate-800">
              ${(state.scheduleBlocks || []).map((b) => `
                <div class="py-3 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-bold">${escapeHtml(b.title)}</div>
                    <div class="text-[11px] text-slate-400">${daysMap[b.day] || 'Hàng ngày'} • ${escapeHtml(b.time)}</div>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${b.project === 'MAS' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">${escapeHtml(b.project)}</span>
                    <button onclick="openScheduleBlockModal('${b.id}')" class="p-1 text-slate-400 hover:text-indigo-600"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                    <button onclick="deleteScheduleBlock('${b.id}')" class="p-1 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-sm font-bold">Checklist lặp lại</h2>
              <div class="flex items-center gap-1.5">
                <button onclick="resetRecurringChecklist()" class="px-2.5 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-semibold">Reset tích</button>
                <button onclick="openRecurringModal()" class="px-3 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-semibold">+ Thêm mục</button>
              </div>
            </div>
            <div class="divide-y divide-slate-100 dark:divide-slate-800">
              ${(state.recurringTasks || []).map((rt) => `
                <div class="py-3 flex items-center justify-between gap-2">
                  <label class="flex items-center gap-2.5 cursor-pointer">
                    <input type="checkbox" ${rt.done ? 'checked' : ''} onchange="toggleRecurringDone('${rt.id}')" class="w-4 h-4 rounded accent-emerald-600" />
                    <span class="text-xs font-medium ${rt.done ? 'line-through text-slate-400' : ''}">${escapeHtml(rt.title)}</span>
                  </label>
                  <div class="flex items-center gap-1.5">
                    <span class="text-[11px] text-slate-400">${escapeHtml(rt.schedule)}</span>
                    <button onclick="openRecurringModal('${rt.id}')" class="p-1 text-slate-400 hover:text-indigo-600"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>
                    <button onclick="deleteRecurringItem('${rt.id}')" class="p-1 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function openScheduleBlockModal(id) {
      const item = (state.scheduleBlocks || []).find((x) => x.id === id) || { id: '', day: 0, project: 'MAS', time: '09:00 - 11:00', title: '' };
      openModal(`
        <form onsubmit="saveScheduleBlock(event, '${item.id}')" class="space-y-3">
          <h3 class="text-sm font-bold">${item.id ? 'Sửa Time-Block' : 'Thêm Time-Block'}</h3>
          <div class="grid grid-cols-2 gap-2">
            <select id="sb-day" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
              ${[0,1,2,3,4,5,6,7].map((d) => `<option value="${d}" ${Number(item.day) === d ? 'selected' : ''}>${d === 0 ? 'Hàng ngày' : d === 7 ? 'Chủ nhật' : 'Thứ ' + (d + 1)}</option>`).join('')}
            </select>
            <select id="sb-proj" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
              <option value="MAS" ${item.project === 'MAS' ? 'selected' : ''}>MAS</option>
              <option value="Eco" ${item.project === 'Eco' ? 'selected' : ''}>Eco</option>
            </select>
          </div>
          <input id="sb-time" type="text" required value="${escapeHtml(item.time)}" placeholder="09:00 - 11:00" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          <input id="sb-title" type="text" required value="${escapeHtml(item.title)}" placeholder="Nội dung công việc..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl border text-xs">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Lưu</button>
          </div>
        </form>
      `);
    }

    function saveScheduleBlock(e, id) {
      e.preventDefault();
      const obj = { id: id || ('sb_' + Date.now()), day: Number(document.getElementById('sb-day').value), project: document.getElementById('sb-proj').value, time: document.getElementById('sb-time').value.trim(), title: document.getElementById('sb-title').value.trim() };
      if (id) state.scheduleBlocks = state.scheduleBlocks.map((x) => (x.id === id ? obj : x));
      else state.scheduleBlocks.push(obj);
      saveState(); closeModal(); render();
    }

    function deleteScheduleBlock(id) { state.scheduleBlocks = (state.scheduleBlocks || []).filter((x) => x.id !== id); saveState(); render(); }

    function openRecurringModal(id) {
      const item = (state.recurringTasks || []).find((x) => x.id === id) || { id: '', title: '', schedule: 'Hàng ngày', done: false };
      openModal(`
        <form onsubmit="saveRecurringItem(event, '${item.id}')" class="space-y-3">
          <h3 class="text-sm font-bold">${item.id ? 'Sửa Checklist' : 'Thêm Checklist'}</h3>
          <input id="rt-title" type="text" required value="${escapeHtml(item.title)}" placeholder="Tên checklist..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          <input id="rt-sched" type="text" required value="${escapeHtml(item.schedule)}" placeholder="Hàng ngày / Thứ 2 hàng tuần" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl border text-xs">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 text-white text-xs font-semibold">Lưu</button>
          </div>
        </form>
      `);
    }

    function saveRecurringItem(e, id) {
      e.preventDefault();
      const title = document.getElementById('rt-title').value.trim();
      const schedule = document.getElementById('rt-sched').value.trim();
      if (id) state.recurringTasks = state.recurringTasks.map((x) => (x.id === id ? { ...x, title, schedule } : x));
      else state.recurringTasks.push({ id: 'rt_' + Date.now(), title, schedule, done: false });
      saveState(); closeModal(); render();
    }

    function deleteRecurringItem(id) { state.recurringTasks = (state.recurringTasks || []).filter((x) => x.id !== id); saveState(); render(); }
    function toggleRecurringDone(id) { state.recurringTasks = (state.recurringTasks || []).map((x) => (x.id === id ? { ...x, done: !x.done } : x)); saveState(); render(); }
    function resetRecurringChecklist() { state.recurringTasks = (state.recurringTasks || []).map((x) => ({ ...x, done: false })); saveState(); render(); }

    function openQuickTaskModal() {
      openModal(`
        <form onsubmit="submitQuickTask(event)" class="space-y-3">
          <h3 class="text-sm font-bold">Thêm Task mới</h3>
          <input id="qt-title" type="text" required placeholder="Nội dung công việc..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          <div class="grid grid-cols-2 gap-2">
            <select id="qt-project" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs">
              <option value="MAS">MAS</option>
              <option value="Eco">Eco</option>
            </select>
            <input id="qt-due" type="date" value="${offsetDate(0)}" class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-3 py-2 rounded-xl border text-xs">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold">Tạo Task</button>
          </div>
        </form>
      `);
    }

    function submitQuickTask(e) {
      e.preventDefault();
      const title = document.getElementById('qt-title').value.trim();
      if (!title) return;
      state.tasks.unshift({ id: 't_' + Date.now(), title, project: document.getElementById('qt-project').value, due: document.getElementById('qt-due').value, done: false });
      saveState(); closeModal(); render();
    }

    function toggleTaskDone(id) { state.tasks = (state.tasks || []).map((t) => (t.id === id ? { ...t, done: !t.done } : t)); saveState(); render(); }

    // =========================================================================
    // 8. INITIALIZATION
    // =========================================================================
    window.onload = function () {
      applyTheme();
      renderAuthGate();
      render();
      function autoPullMas() {
        if (!isSessionUnlocked || !state.masSheetConfig?.webAppUrl ||
            Date.now() - lastAutoPullTs < MAS_AUTO_SYNC_INTERVAL_MS) return;
        lastAutoPullTs = Date.now();
        void syncMasFromGoogleSheet(true);
      }
      autoPullMas();
      setInterval(autoPullMas, MAS_AUTO_SYNC_INTERVAL_MS);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') autoPullMas();
      });
    };
  </script>
</body>
</html>
