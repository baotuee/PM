  <!-- Toast Thông Báo -->

  <script>
    const STORAGE_KEY = 'mas_eco_command_center_v2';
    const AUTH_KEY = 'mas_eco_auth_v2';
    let isSessionUnlocked = false;
    let isSidebarOpen = false;

    function getSavedAuth() {
      try {
        return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null');
      } catch (e) {
        return null;
      }
    }

    function getCurrentUserPic() {

      return alias || 'Tuệ';
    }

    function offsetDate(days) {

    function formatDateISO(d) {

    }

      ],

      ],
      masContent: [
        { id: 'c1', title: 'Video Unboxing Combo Tép Màu & Cây Thủy Sinh', channel: 'FB Ads', format: 'Video', hook: '3 giây đầu quay cận cảnh hồ thủy sinh lên màu rực rỡ', status: 'In Production', pic: getCurrentUserPic(), deadline: offsetDate(3), link: '' }
      ],

        { id: 'b1', name: 'Momby', targetGmv: 350000000, actualGmv: 218000000, liveHours: 42, orders: 640 },
        { id: 'b2', name: 'Beberia', targetGmv: 280000000, actualGmv: 192000000, liveHours: 36, orders: 510 },
        { id: 'b3', name: 'Lilibaby', targetGmv: 220000000, actualGmv: 145000000, liveHours: 28, orders: 430 },
        { id: 'b4', name: 'Gommu', targetGmv: 180000000, actualGmv: 112000000, liveHours: 24, orders: 320 }
      ],

        { id: 'ch2', name: 'TikTok Shop Live', gmv: 242000000, spend: 41000000, orders: 720, note: 'Cần thêm video ngắn kéo traffic vào phiên' },
        { id: 'ch3', name: 'Lazada & Website', gmv: 130000000, spend: 12000000, orders: 290, note: 'Duy trì voucher freeship' }
      ],
      ecoLiveLogs: [
        { id: 'll1', time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }), date: offsetDate(0), brand: 'Momby • Shopee Live', type: 'Winning Deal', content: 'Combo 3 gói khăn ướt + tặng túi zip chốt 42 đơn trong 15 phút đầu.', action: 'Lặp lại deal mồi này ở khung 21h tối nay', pic: 'Host Mai' }
      ],
      masSheetConfig: {
        webAppUrl: '',
        lastSync: '',
        summaryRows: [],
        dailyAggRows: [],
        deepdive: {
          FB_Campaign_Daily: [],
          FB_Ads: [],
          FB_Ads_Audience: [],
          FB_Ads_Demo: [],
          FB_Ads_Product: [],
          GG_Ads_Creative: [],
          GG_Ads_PMax: [],
          GG_Ads_Keyword: [],
          GG_Ads_Search_Term: [],
          GG_Ads_Product: [],
          Shopify_Orders: [],
          GA4_Australia: []
        }
      }
    };

    let state = loadState();

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseCsvNumber(val) {
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      let s = String(val ?? '').trim().replace(/[^0-9.,-]+/g, '');
      if (!s) return 0;
      const lastComma = s.lastIndexOf(',');
      const lastDot = s.lastIndexOf('.');
      if (lastComma > lastDot) {
        s = s.replace(/\./g, '').replace(',', '.');
      } else if (lastDot > lastComma) {
        s = s.replace(/,/g, '');
      } else if (lastComma !== -1 && lastDot === -1) {
        const parts = s.split(',');
        if (parts.length === 2 && parts[1].length <= 2) {
          s = parts[0] + '.' + parts[1];
        } else {
          s = s.replace(/,/g, '');
        }
      }
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }

    function normalizeDateToISO(raw) {
      const s = String(raw || '').trim();
      if (!s) return '';
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
      const dmy = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
      return '';
    }

    function showToast(msg, type = 'info') {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-900 text-white dark:bg-slate-800'
      };
      el.className = `pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs font-semibold transition-all ${colors[type] || colors.info}`;
      el.textContent = msg;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
      }, 3200);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
        const parsed = JSON.parse(raw);
        return {
          ...JSON.parse(JSON.stringify(DEFAULT_STATE)),
          ...parsed,
          masSheetConfig: {
            ...DEFAULT_STATE.masSheetConfig,
            ...(parsed.masSheetConfig || {}),
            deepdive: {
              ...DEFAULT_STATE.masSheetConfig.deepdive,
              ...((parsed.masSheetConfig && parsed.masSheetConfig.deepdive) || {})
            }
          }
        };
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_STATE));
      }
    }

    let cloudSyncTimer = null;
    function saveState(skipCloud = false) {
      try {
        const config = state.masSheetConfig;
        const url = config?.webAppUrl && getMasWebAppUrl(config.webAppUrl);
        if (url && masDurableSnapshotUrl === url) {
          const {summaryRows, dailyAggRows, deepdive, ...settings} = config;
          localStorage.setItem(STORAGE_KEY, JSON.stringify({...state, masSheetConfig: settings}));
        } else {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }
      } catch (e) {
        try {
          const {summaryRows, dailyAggRows, deepdive, ...settings} = state.masSheetConfig;
          localStorage.setItem(STORAGE_KEY, JSON.stringify({...state, masSheetConfig: settings}));
        } catch (_) {}
      }
      if (!skipCloud && state.masSheetConfig?.webAppUrl) {
        clearTimeout(cloudSyncTimer);
        cloudSyncTimer = setTimeout(() => pushBackupToCloud(true), 2500);
      }
    }

    function applyTheme() {
      if (state.theme === 'dark') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      saveState(true);
    }

    function toggleSidebar(force) {
      isSidebarOpen = typeof force === 'boolean' ? force : !isSidebarOpen;
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (!sb || !bd) return;
      if (isSidebarOpen) {
        sb.classList.remove('-translate-x-full');
        bd.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        bd.classList.add('hidden');
      }
    }

    // =========================================================================
    // CỔNG ĐĂNG NHẬP BẮT BUỘC KHI TRUY CẬP FILE HTML
    // =========================================================================
    function renderAuthGate() {
      const gate = document.getElementById('auth-gate');
      const shell = document.getElementById('app-shell');
      if (isSessionUnlocked) {
        gate.classList.add('hidden');
        shell.classList.remove('hidden');
        const badge = document.getElementById('sidebar-user-badge');
        if (badge) badge.textContent = `User: ${getCurrentUserPic()}`;
        return;
      }

      gate.classList.remove('hidden');
      shell.classList.add('hidden');
      const saved = getSavedAuth();
      const prefillAlias = saved?.alias || '';

      gate.innerHTML = `
        <div class="w-full max-w-md rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 shadow-2xl space-y-5">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-emerald-500 flex items-center justify-center text-white font-extrabold text-base shadow">M×E</div>
            <div>
              <h2 class="text-base font-extrabold">MAS × Eco Command Center</h2>
              <p class="text-xs text-slate-500 dark:text-slate-400">${saved ? 'Đăng nhập bằng Từ khóa & Mật khẩu để mở khóa' : 'Thiết lập Từ khóa, Web App URL & Mật khẩu truy cập'}</p>
            </div>
          </div>

          <form onsubmit="handleAuthSubmit(event)" class="space-y-3.5 text-xs">
            <div>
              <label class="block font-bold mb-1">Từ khóa định danh / Tên PIC (User Alias) *</label>
              <input id="auth-alias" required value="${escapeHtml(prefillAlias)}" placeholder="VD: Tuệ hoặc team_eco" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block font-bold mb-1">Google Apps Script Web App URL (Đồng bộ Sheet & Cloud)</label>
              <input id="auth-url" autocomplete="off" placeholder="Nhập URL nếu cần kết nối hoặc đổi Web App" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <div>
              <label class="block font-bold mb-1">Mật khẩu truy cập *</label>
              <input id="auth-pass" type="password" required placeholder="${saved ? 'Nhập mật khẩu đã lưu...' : 'Tạo mật khẩu mới...'}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold shadow transition">
              ${saved ? '🔓 Mở khóa Command Center' : '🚀 Lưu cấu hình & Đăng nhập'}
            </button>
          </form>
        </div>
      `;
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const alias = document.getElementById('auth-alias').value.trim();
      const url = document.getElementById('auth-url').value.trim();
      const pass = document.getElementById('auth-pass').value;
      const saved = getSavedAuth();

      if (saved && saved.pass && saved.pass !== pass) {
        showToast('Mật khẩu không chính xác!', 'error');
        return;
      }

      const authObj = { alias, webAppUrl: url || saved?.webAppUrl || state.masSheetConfig?.webAppUrl || '', pass };
      localStorage.setItem(AUTH_KEY, JSON.stringify(authObj));
      if (authObj.webAppUrl) {
        state.masSheetConfig.webAppUrl = authObj.webAppUrl;
      }
      isSessionUnlocked = true;
      saveState(true);
      renderAuthGate();
      render();
      startAutoSyncTimer();
      showToast(`Chào mừng ${alias}! Đang đồng bộ dữ liệu mới nhất...`, 'success');
      if (state.masSheetConfig?.webAppUrl) {
        await syncMasFromGoogleSheet(true);
      }
    }

    function lockSession() {
      isSessionUnlocked = false;
      renderAuthGate();
    }

    // =========================================================================
    // ĐỒNG BỘ GOOGLE SHEETS & CLOUD BACKUP
    // =========================================================================
    const MAS_DETAIL_TABS = [
      'Daily_Aggregate', 'FB_Ads', 'FB_Ads_Audience', 'FB_Ads_Demo', 'FB_Ads_Product',
      'GG_Ads_Creative', 'GG_Ads_PMax', 'GG_Ads_Keyword', 'GG_Ads_Search_Term',
      'GG_Ads_Product', 'Shopify_Orders', 'GA4_Australia'
    ];
    const MAS_REFRESH_DAYS = 14;
    let masSyncStatus = '';
    let masSyncRun = 0;
    let masSyncInFlight = null;
    let masMemorySnapshot = null;
    let masDurableSnapshotUrl = '';

    function accessMasSnapshot(url, snapshot) {
      return new Promise((resolve, reject) => {
        const open = indexedDB.open('mas-command-center-reports', 1);
        open.onupgradeneeded = () => open.result.createObjectStore('snapshots');
        open.onblocked = () => reject(new Error('Bộ nhớ đang được dùng ở tab khác.'));
        open.onerror = () => reject(open.error);
        open.onsuccess = () => {
          const db = open.result;
          const transaction = db.transaction('snapshots', snapshot ? 'readwrite' : 'readonly');
          const store = transaction.objectStore('snapshots');
          const request = snapshot ? store.put(snapshot, url) : store.get(url);
          transaction.oncomplete = () => {
            db.close();
            resolve(request.result);
          };
          transaction.onabort = () => {
            db.close();
            reject(transaction.error);
          };
        };
      });
    }

    function masSydneyToday() {
      const parts = new Intl.DateTimeFormat('en', {
        timeZone: 'Australia/Sydney', year: 'numeric', month: '2-digit', day: '2-digit'
      }).formatToParts(new Date());
      const values = Object.fromEntries(parts.map(({type, value}) => [type, value]));
      return values.year + '-' + values.month + '-' + values.day;
    }

    function masRefreshFrom(day) {
      const date = new Date(day + 'T00:00:00Z');
      date.setUTCDate(date.getUTCDate() - MAS_REFRESH_DAYS + 1);
      return date.toISOString().slice(0, 10);
    }

    function getMasWebAppUrl(savedUrl) {
      let url;
      try { url = new URL(savedUrl); } catch (_) {}
      const validPath = /^\/(?:a\/macros\/[^/]+\/|macros\/)s\/[\w-]+\/exec$/;
      if (!url || url.origin !== 'https://script.google.com' || !validPath.test(url.pathname)) {
        throw new Error('Dán URL /exec của Web App trong Apps Script → Deploy → Manage deployments.');
      }
      url.hash = '';
      ['sheet', 'date_from', 'date_to', 'limit', 'offset', '_ts'].forEach(key => url.searchParams.delete(key));
      return url.href;
    }

    async function fetchMasSheetPage(webAppUrl, tab, params = {}, timeoutMs = 25000) {
      const requestUrl = new URL(webAppUrl);
      requestUrl.searchParams.set('sheet', tab);
      requestUrl.searchParams.set('_ts', String(Date.now()));
      Object.entries(params).forEach(([key, value]) => requestUrl.searchParams.set(key, value));
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      let response;
      let data;
      try {
        response = await fetch(requestUrl, {signal: controller.signal});
        if (!response.ok) {
          const error = new Error('Web App trả về HTTP ' + response.status + '.');
          error.tryPages = [413, 502, 503, 504].includes(response.status);
          throw error;
        }
        data = await response.json();
      } catch (err) {
        if (controller.signal.aborted) {
          const error = new Error('Web App mất hơn ' + (timeoutMs / 1000) + ' giây để trả dữ liệu.');
          error.tryPages = true;
          throw error;
        }
        if (!response) throw new Error('Trình duyệt không kết nối được Web App. Kiểm tra URL /exec và quyền truy cập.');
        if (!response.ok) throw err;
        throw new Error('Web App không trả JSON. Kiểm tra tài khoản Google và quyền truy cập.');
      } finally {
        clearTimeout(timeout);
      }
      if (data?.error) throw new Error(data.error);
      if (!Array.isArray(data?.rows) || data.sheet !== tab) {
        throw new Error('Phản hồi không đúng định dạng dữ liệu của tab.');
      }
      return data;
    }

    async function fetchMasDetailRows(url, tab, dates, current) {
      if (!current()) return null;
      const searchTerms = tab === 'GG_Ads_Search_Term';
      if (!searchTerms || dates.date_from || dates.date_to) {
        try {
          const {rows, totalRows} = await fetchMasSheetPage(url, tab, dates, 60000);
          if (rows.length <= 1 && totalRows === undefined) return rows;
          if (Number.isInteger(totalRows) && Math.max(0, rows.length - 1) === totalRows) return rows;
        } catch (err) {
          if (!err.tryPages) throw err;
        }
      }
      return fetchMasDetailPages(url, tab, dates, current, searchTerms);
    }

    async function fetchMasDetailPages(url, tab, dates, current, physicalPages = false) {
      const requestDates = physicalPages ? {} : dates;
      const filterLocally = physicalPages && (dates.date_from || dates.date_to);
      const limits = physicalPages ? [1000, 250, 80] : [1000, 250];
      let attemptSize = 0;
      let total;
      const rows = [];
      for (let offset = 0; current();) {
        let page;
        try {
          page = await fetchMasSheetPage(url, tab, {...requestDates, limit: limits[attemptSize], offset}, 60000);
        } catch (err) {
          if (!err.tryPages || attemptSize === limits.length - 1) {
            if (physicalPages && err.tryPages) throw new Error('Trang bắt đầu ở dòng ' + (offset + 2) + ': ' + err.message);
            throw err;
          }
          attemptSize++;
          continue;
        }
        if (!Number.isInteger(page.totalRows)) {
          if (offset === 0 && page.rows.length <= 1) return page.rows;
          throw new Error('Web App chưa trả số dòng phân trang.');
        }
        if (offset === 0) {
          total = page.totalRows;
          if (page.rows[0]) rows.push(page.rows[0]);
        } else if (page.totalRows !== total || JSON.stringify(page.rows[0]) !== JSON.stringify(rows[0])) {
          throw new Error('Tab thay đổi trong lúc tải. Bấm Sync để thử lại.');
        }
        const body = page.rows.slice(1);
        const loaded = offset + body.length;
        if (loaded > total || (loaded <= offset && loaded !== total)) {
          throw new Error('Web App trả thiếu dữ liệu phân trang.');
        }
        for (const row of body) {
          if (filterLocally) {
            const day = normalizeDateToISO(row[0]);
            if (!day || (dates.date_from && day < dates.date_from) || (dates.date_to && day > dates.date_to)) continue;
          }
          rows.push(row);
        }
        if (loaded === total) return rows;
        offset = loaded;
      }
      return null;
    }

    function mergeMasReportRows(previous, incoming) {
      if (incoming.length <= 1) return previous;
      const days = new Map();
      for (const row of incoming.slice(1)) {
        const day = normalizeDateToISO(row[0]);
        if (!day) throw new Error('Web App trả về dòng thiếu ngày.');
        if (!days.has(day)) days.set(day, []);
        days.get(day).push(row);
      }
      const retained = new Map();
      for (const row of previous.slice(1)) {
        const day = normalizeDateToISO(row[0]);
        if (days.has(day)) continue;
        if (!retained.has(day)) retained.set(day, []);
        retained.get(day).push(row);
      }
      const partitions = new Map([...retained, ...days]);
      const rows = [incoming[0]];
      [...partitions.keys()].sort().reverse().forEach(day => {
        partitions.get(day).forEach(row => rows.push(row));
      });
      return rows;
    }

    async function refreshMasDetail(url, tab, previous, today, current) {
      if (!previous) {
        const rows = await fetchMasDetailRows(url, tab, {}, current);
        return rows === null ? null : {rows, through: today};
      }
      const from = masRefreshFrom(today);
      const date_from = previous.through < from ? previous.through : from;
      const incoming = await fetchMasDetailRows(url, tab, {date_from, date_to: today}, current);
      if (incoming === null) return null;
      if (incoming.length && JSON.stringify(incoming[0]) !== JSON.stringify(previous.rows[0])) {
        const rows = await fetchMasDetailRows(url, tab, {}, current);
        return rows === null ? null : {rows, through: today};
      }
      return {rows: mergeMasReportRows(previous.rows, incoming), through: today};
    }

    function showMasSnapshot(config, snapshot) {
      config.summaryRows = snapshot.summary;
      config.lastSync = snapshot.summaryAt;
      config.deepdive ||= {};
      delete config.deepdive.FB_Campaign_Daily;
      MAS_DETAIL_TABS.forEach(tab => {
        const report = snapshot.details[tab];
        if (!report) return;
        if (tab === 'Daily_Aggregate') config.dailyAggRows = report.rows;
        else config.deepdive[tab] = report.rows;
      });
    }

    async function syncMasFromGoogleSheet(silent = false) {
      const config = state.masSheetConfig;
      const savedUrl = config?.webAppUrl;
      if (!savedUrl) {
        if (!silent) showToast('Vui lòng nhập Google Apps Script Web App URL!', 'error');
        return;
      }
      if (masSyncInFlight?.config === config && masSyncInFlight.savedUrl === savedUrl) {
        if (!silent) showToast('Đang đồng bộ các tab MAS…', 'info');
        return;
      }
      const run = ++masSyncRun;
      masSyncInFlight = {run, config, savedUrl};
      const current = () => run === masSyncRun && state.masSheetConfig === config && config.webAppUrl === savedUrl;
      masSyncStatus = 'Đang mở bản sao dữ liệu MAS…';
      render();

      try {
        const url = getMasWebAppUrl(savedUrl);
        let snapshot = masMemorySnapshot?.url === url ? masMemorySnapshot : null;
        if (!snapshot) {
          try {
            snapshot = await accessMasSnapshot(url);
            if (snapshot) masDurableSnapshotUrl = url;
          } catch (_) {}
        }
        if (!current()) return;
        if (snapshot) showMasSnapshot(config, snapshot);
        const next = {
          url,
          summary: snapshot?.summary || config.summaryRows || [],
          summaryAt: snapshot?.summaryAt || config.lastSync || '',
          details: {...snapshot?.details}
        };
        const failures = [];
        let updated = 0;
        masSyncStatus = snapshot ? 'Đã mở bản sao. Đang tải thay đổi…' : 'Đang tải bản đầu tiên từ Google Sheet…';
        render();
        try {
          const {rows} = await fetchMasSheetPage(url, 'MAS_Summary');
          if (rows.length <= 1) throw new Error('Tab MAS_Summary chưa có dữ liệu.');
          next.summary = rows;
          next.summaryAt = new Date().toLocaleString('vi-VN');
          updated++;
          if (!current()) return;
          showMasSnapshot(config, next);
          render();
        } catch (err) {
          failures.push('MAS_Summary — ' + err.message);
        }
        const today = masSydneyToday();
        for (let i = 0; i < MAS_DETAIL_TABS.length && current(); i += 3) {
          const batch = MAS_DETAIL_TABS.slice(i, i + 3);
          await Promise.all(batch.map(async tab => {
            try {
              const report = await refreshMasDetail(url, tab, next.details[tab], today, current);
              if (!report || !current()) return;
              next.details[tab] = report;
              updated++;
            } catch (err) {
              failures.push(tab + ' — ' + err.message);
            }
          }));
          if (!current()) return;
          masSyncStatus = 'Đã xử lý ' + Math.min(i + batch.length, MAS_DETAIL_TABS.length) +
            '/' + MAS_DETAIL_TABS.length + ' tab chi tiết…';
          showMasSnapshot(config, next);
          render();
        }
        if (!current()) return;
        let stored = false;
        if (updated) {
          masMemorySnapshot = next;
          try {
            await accessMasSnapshot(url, next);
            masDurableSnapshotUrl = url;
            stored = true;
          } catch (_) {}
        }
        if (!current()) return;
        const backupStatus = stored ? 'Đã lưu bản sao trong trình duyệt.'
          : updated ? 'Trình duyệt chưa lưu được bản sao.' : '';
        masSyncStatus = failures.length ? 'Lỗi ở ' + failures.join(' · ') + ' ' + backupStatus
          : 'Đã đồng bộ tất cả tab. ' + backupStatus;
        saveState(true);
        render();
        if (!silent) showToast(masSyncStatus, failures.length || !stored ? 'error' : 'success');
      } catch (err) {
        if (!current()) return;
        masSyncStatus = 'Lỗi đồng bộ. ' + err.message;
        render();
        if (!silent) showToast(masSyncStatus, 'error');
      } finally {
        if (masSyncInFlight?.run === run) masSyncInFlight = null;
      }
    }

    async function pushBackupToCloud(silent = false) {
      const url = state.masSheetConfig?.webAppUrl;
      if (!url) {

          note: `Backup by ${getCurrentUserPic()}`,

          body: JSON.stringify(payload)
        });

    function importJsonBackup(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object' || (!Array.isArray(parsed.tasks) && !parsed.masSheetConfig)) {
            showToast('File JSON không đúng định dạng Command Center!', 'error');
            return;
          }
          window.__pendingJsonImport = parsed;
          openModal(`
            <div class="space-y-4 text-xs">

              <div class="p-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-800 space-y-1">
                <div>File: <strong>${escapeHtml(file.name)}</strong></div>
                <div>Tasks: <strong>${(parsed.tasks || []).length}</strong> • Issues: <strong>${(parsed.issues || []).length}</strong> • Content Briefs: <strong>${(parsed.masContent || []).length}</strong></div>

              </div>
            </div>
          `);
        } catch (err) {
          showToast('File JSON bị lỗi cú pháp!', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function renderTaskList(tasks) {
      return `

              <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">

                  <th class="px-3 py-3">Đầu việc & Ghi chú</th>

                  <th class="px-3 py-3">Trạng thái</th>

                </div>
                <div class="space-y-2">
                  ${list.map((t) => `
                    <div class="p-3 rounded-xl bg-white dark:bg-slate-800/90 border border-slate-200/80 dark:border-slate-700 shadow-sm space-y-2">
                      <div class="flex items-center justify-between gap-1 text-[10px]">
                        <span class="font-bold text-indigo-600">${escapeHtml(t.project)} • ${escapeHtml(t.tag || 'General')}</span>
                        <span class="font-extrabold">${t.progress || 0}%</span>

                      <div class="font-bold leading-snug">${escapeHtml(t.title)}</div>
                      <div class="w-full h-1.5 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden">

                      <div class="flex items-center justify-between pt-1 text-[10px] text-slate-500">

    function openTaskModal(taskId = null, defaultProject = 'MAS', prefill = null) {

      const t = existing || {
        title: prefill?.title || '',
        project: prefill?.project || defaultProject,
        tag: prefill?.tag || 'Ads',
        status: 'To Do',
        progress: 0,
        priority: prefill?.priority || 'High',

      openModal(`
        <form onsubmit="submitTaskModal(event, '${existing ? existing.id : ''}')" class="space-y-3.5 text-xs">

          <div>

                <option value="Eco" ${t.project === 'Eco' ? 'selected' : ''}>Eco (Live)</option>

            <div>

            <div>

              </select>
            </div>
            <div>
              <label class="block font-bold mb-1">Tiến độ (%)</label>

              <label class="block font-bold mb-1">Deadline</label>

          </div>
        </form>
      `);
    }

    function submitTaskModal(e, existingId) {
      e.preventDefault();
      const status = document.getElementById('tm-status').value;
      const rawProg = Math.min(100, Math.max(0, Number(document.getElementById('tm-progress').value) || 0));
      const isDone = status === 'Done' || rawProg === 100;
      const obj = {
        id: existingId || 't_' + Date.now(),
        title: document.getElementById('tm-title').value.trim(),
        project: document.getElementById('tm-project').value,
        tag: document.getElementById('tm-tag').value,
        priority: document.getElementById('tm-priority').value,
        status: isDone ? 'Done' : status,
        progress: isDone ? 100 : rawProg,
        pic: document.getElementById('tm-pic').value.trim() || getCurrentUserPic(),
        deadline: document.getElementById('tm-deadline').value,
        note: document.getElementById('tm-note').value.trim(),
        done: isDone,
        archived: isDone
      };

      if (existingId) {
        const idx = state.tasks.findIndex((x) => x.id === existingId);
        if (idx !== -1) state.tasks[idx] = obj;
      } else {
        state.tasks.unshift(obj);
      }
      saveState();
      closeModal();
      render();
      showToast(isDone ? 'Task hoàn thành & đã tự động lưu trữ!' : 'Đã lưu Task!', 'success');
    }

    function toggleTaskDone(id) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      const nextDone = !(t.done || t.archived || t.status === 'Done');
      t.done = nextDone;
      t.archived = nextDone;
      t.status = nextDone ? 'Done' : 'Doing';
      t.progress = nextDone ? 100 : Math.min(90, t.progress || 50);
      saveState();
      render();
      showToast(nextDone ? 'Đã hoàn thành & chuyển sang Archive!' : 'Đã khôi phục Task về Đang chạy!', 'info');
    }

    function updateTaskStatus(id, status) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      t.status = status;
      if (status === 'Done') {
        t.done = true;
        t.archived = true;
        t.progress = 100;
      } else {
        t.done = false;
        t.archived = false;
      }
      saveState();
      render();
    }

    function updateTaskProgress(id, val) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      const p = Math.min(100, Math.max(0, Number(val) || 0));
      t.progress = p;
      if (p === 100) {
        t.status = 'Done';
        t.done = true;
        t.archived = true;
      } else if (t.status === 'Done') {
        t.status = 'Doing';
        t.done = false;
        t.archived = false;
      }
      saveState();
      render();
    }

    function deleteTask(id) {
      state.tasks = state.tasks.filter((x) => x.id !== id);
      saveState();
      render();
      showToast('Đã xóa Task', 'info');
    }

          <div>

          <div>

          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block font-bold mb-1">PIC</label>
              <input id="im-pic" value="${escapeHtml(getCurrentUserPic())}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
            <div>
              <label class="block font-bold mb-1">Deadline</label>
              <input id="im-deadline" type="date" value="${offsetDate(1)}" class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
            </div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold">Hủy</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-rose-600 text-white font-bold">Lưu Issue</button>
          </div>
        </form>
      `);
    }

    function submitIssueModal(e) {
      e.preventDefault();
      state.issues.unshift({
        id: 'iss_' + Date.now(),
        project: document.getElementById('im-project').value,
        brand: document.getElementById('im-brand').value.trim(),
        issue: document.getElementById('im-issue').value.trim(),
        rootCause: document.getElementById('im-root').value.trim(),
        action: document.getElementById('im-action').value.trim(),
        pic: document.getElementById('im-pic').value.trim() || getCurrentUserPic(),
        deadline: document.getElementById('im-deadline').value,
        status: 'Open'
      });
      saveState();
      closeModal();
      render();
      showToast('Đã ghi nhận Issue mới!', 'success');
    }

    function updateIssueStatus(id, st) {
      const item = state.issues.find((x) => x.id === id);
      if (!item) return;
      item.status = st;
      saveState();
      render();
    }

    function deleteIssue(id) {
      state.issues = state.issues.filter((x) => x.id !== id);
      saveState();
      render();
    }

    function convertIssueToTask(id) {
      const item = state.issues.find((x) => x.id === id);
      if (!item) return;
      openTaskModal(null, item.project || 'MAS', {
        title: `[Fix Issue] ${item.action || item.issue}`,
        project: item.project || 'MAS',
        tag: item.project === 'Eco' ? 'Live' : 'Ads',
        priority: 'High',
        pic: item.pic || getCurrentUserPic(),
        deadline: item.deadline || offsetDate(1),
        note: `Từ Issue: ${item.issue}${item.rootCause ? ` | Root cause: ${item.rootCause}` : ''}`
      });
    }

    // =========================================================================
    // WORKSPACE MAS: EXECUTIVE SUMMARY + FB DEEPDIVE + GG DEEPDIVE + MIX CART + CONTENT + TASKS
    // =========================================================================
    function renderMas() {
      const sub = state.masSubTab || 'perf';
      const url = state.masSheetConfig?.webAppUrl || '';
      const lastSync = state.masSheetConfig?.lastSync || 'Chưa đồng bộ';
      const contentCount = (state.masContent || []).length;
      const masActiveTasks = (state.tasks || []).filter((t) => t.project === 'MAS' && !t.done && !t.archived && t.status !== 'Done').length;

      return `
        <div class="space-y-5">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <div class="flex flex-wrap items-center gap-1.5 text-xs font-bold">
              ${[
                { id: 'perf', label: 'Executive Summary' },
                { id: 'fb_deepdive', label: 'FB Deepdive' },
                { id: 'gg_deepdive', label: 'GG Deepdive' },
                { id: 'shopify', label: 'Shopify Product & Mix Cart' },
                { id: 'content', label: `Order Content (${contentCount})` },
                { id: 'tasks', label: `Tasks MAS (${masActiveTasks})` }
              ].map((tab) => `
                <button onclick="setMasSubTab('${tab.id}')" class="px-3.5 py-2 rounded-xl transition ${
                  sub === tab.id ? 'bg-indigo-600 text-white shadow-sm' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'
                }">${tab.label}</button>
              `).join('')}
            </div>

            <div class="flex items-center gap-2 text-xs">
              <span class="text-slate-400">Sync: ${escapeHtml(lastSync)}</span>
              <button onclick="syncMasFromGoogleSheet(false)" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold shadow-sm transition">🔄 Sync Data MAS ngay</button>
            </div>
          </div>

          ${masSyncStatus ? `<p role="status" class="text-xs text-slate-500">${escapeHtml(masSyncStatus)}</p>` : ''}

          ${!url ? `
            <div class="p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800 flex items-center justify-between text-xs">
              <span>Chưa kết nối Google Apps Script Web App URL.</span>
              <button onclick="openSheetConfigModal()" class="px-3 py-1.5 rounded-xl bg-amber-600 text-white font-bold">Cấu hình URL ngay</button>
            </div>
          ` : ''}

          ${
            sub === 'perf'
              ? renderMasSummaryTable()
              : sub === 'fb_deepdive'
                ? renderPlatformDeepdive('FB')
                : sub === 'gg_deepdive'
                  ? renderPlatformDeepdive('GG')
                  : sub === 'shopify'
                    ? renderMasShopifyMix()
                    : sub === 'tasks'
                      ? renderTasksAndIssuesHub('MAS')
                      : renderMasContentTab()
          }
        </div>
      `;
    }

    function setMasSubTab(t) {
      state.masSubTab = t;
      saveState(true);
      render();
    }

    function renderMasSummaryTable() {
      const rows = state.masSheetConfig?.summaryRows || [];
      if (rows.length < 4) {
        return `
          <div class="p-8 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center space-y-3 text-xs">
            <div class="font-bold text-sm">Chưa có dữ liệu Executive Summary</div>
            <p class="text-slate-500">Bấm "Sync Data MAS ngay" sau khi cấu hình Web App URL để nạp số liệu từ Google Sheets.</p>
          </div>
          ${renderExecDashboardBreakByDay()}
        `;
      }

      const headerRow = rows[3] || [];
      const bodyRows = rows.slice(4);

      return `
        <div class="space-y-6">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden text-xs">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/60 dark:bg-slate-800/40">
              <span class="font-extrabold">${escapeHtml(rows[0]?.[0] || 'MAS — EXECUTIVE PERFORMANCE SUMMARY')}</span>
              <span class="text-slate-400 text-[11px]">${escapeHtml(rows[1]?.[0] || '')}</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-600 dark:text-slate-300 font-bold">
                  <tr>
                    ${headerRow.map((h, i) => `<th class="px-4 py-2.5 ${i >= 1 && i <= 5 ? 'text-right' : ''}">${escapeHtml(h)}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${bodyRows.map((r) => {
                    const isSection = /^\d+\./.test(String(r[0] || '').trim());
                    return `
                      <tr class="${isSection ? 'bg-indigo-50/60 dark:bg-indigo-950/30 font-extrabold text-indigo-700 dark:text-indigo-300' : 'hover:bg-slate-50/70 dark:hover:bg-slate-800/40'}">
                        ${r.map((cell, idx) => `<td class="px-4 py-2 ${idx >= 1 && idx <= 5 ? 'text-right font-semibold' : ''}">${escapeHtml(cell)}</td>`).join('')}
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>

          ${renderExecDashboardBreakByDay()}
        </div>
      `;
    }

    // =========================================================================
    // EXECUTIVE SUMMARY: DASHBOARD BREAK BY DAY + FUNNEL + TOP SKU + CHANNELS
    // =========================================================================
    let execDashState = {
      range: 'L14D',
      from: offsetDate(-14),
      to: offsetDate(-1),
      compareMode: 'PREV'
    };
    let execDailyChartInstance = null;

    function renderExecDashboardBreakByDay() {
      const aggRows = (state.masSheetConfig?.dailyAggRows || []).slice(1);
      const yestIso = offsetDate(-1);
      let dFrom = execDashState.from;
      let dTo = execDashState.to;
      if (execDashState.range === 'L7D') { dFrom = offsetDate(-7); dTo = yestIso; }
      else if (execDashState.range === 'L14D') { dFrom = offsetDate(-14); dTo = yestIso; }
      else if (execDashState.range === 'L30D') { dFrom = offsetDate(-30); dTo = yestIso; }

      const daySpan = Math.max(1, Math.round((new Date(dTo) - new Date(dFrom)) / 86400000) + 1);
      let prevFrom, prevTo;
      if (execDashState.compareMode === 'MOM') {
        const fObj = new Date(dFrom); fObj.setMonth(fObj.getMonth() - 1);
        const tObj = new Date(dTo); tObj.setMonth(tObj.getMonth() - 1);
        prevFrom = formatDateISO(fObj);
        prevTo = formatDateISO(tObj);
      } else {
        prevTo = formatDateISO(new Date(new Date(dFrom).getTime() - 86400000));
        prevFrom = formatDateISO(new Date(new Date(prevTo).getTime() - (daySpan - 1) * 86400000));
      }

      const curDays = [];
      const prevTotals = { fbSpend: 0, fbGmv: 0, ggSpend: 0, ggGmv: 0, shopGmv: 0, onlineGmv: 0, orders: 0, sessions: 0, atc: 0, gaPurchases: 0 };
      const curTotals = { fbSpend: 0, fbGmv: 0, ggSpend: 0, ggGmv: 0, shopGmv: 0, onlineGmv: 0, orders: 0, sessions: 0, atc: 0, gaPurchases: 0 };

      aggRows.forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        if (!dt) return;
        const item = {
          date: dt,
          fbSpend: parseCsvNumber(r[1]),
          fbGmv: parseCsvNumber(r[5]),
          ggSpend: parseCsvNumber(r[6]),
          ggGmv: parseCsvNumber(r[10]),
          shopGmv: parseCsvNumber(r[11]),
          orders: parseCsvNumber(r[12]),
          sessions: parseCsvNumber(r[20]),
          atc: parseCsvNumber(r[22]),
          gaPurchases: parseCsvNumber(r[23]),
          onlineGmv: parseCsvNumber(r[24])
        };
        if (dt >= dFrom && dt <= dTo) {
          curDays.push(item);
          Object.keys(curTotals).forEach((k) => { curTotals[k] += item[k]; });
        } else if (dt >= prevFrom && dt <= prevTo) {
          Object.keys(prevTotals).forEach((k) => { prevTotals[k] += item[k]; });
        }
      });

      curDays.sort((a, b) => (a.date < b.date ? -1 : 1));
      window.__execDailySeries = curDays;

      let curCheckouts = 0, prevCheckouts = 0;
      (state.masSheetConfig?.deepdive?.GA4_Australia || []).slice(1).forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        const chk = parseCsvNumber(r[6]);
        if (dt >= dFrom && dt <= dTo) curCheckouts += chk;
        else if (dt >= prevFrom && dt <= prevTo) prevCheckouts += chk;
      });

      const curSkuMap = {}, prevSkuMap = {};
      const seenCurLine = new Set(), seenPrevLine = new Set();
      (state.masSheetConfig?.deepdive?.Shopify_Orders || []).slice(1).forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        const oid = String(r[1] || '').trim();
        const title = String(r[6] || '').trim();
        const qty = parseCsvNumber(r[7]);
        const rev = parseCsvNumber(r[8]);
        if (!dt || !title || qty <= 0) return;
        const lk = `${dt}|${oid}|${title}|${qty}|${rev}`;
        if (dt >= dFrom && dt <= dTo) {
          if (seenCurLine.has(lk)) return;
          seenCurLine.add(lk);
          if (!curSkuMap[title]) curSkuMap[title] = { title, rev: 0, qty: 0, orders: new Set() };
          curSkuMap[title].rev += rev;
          curSkuMap[title].qty += qty;
          if (oid) curSkuMap[title].orders.add(oid);
        } else if (dt >= prevFrom && dt <= prevTo) {
          if (seenPrevLine.has(lk)) return;
          seenPrevLine.add(lk);
          prevSkuMap[title] = (prevSkuMap[title] || 0) + rev;
        }
      });

      const topSkus = Object.values(curSkuMap)
        .map((s) => {
          const orderCnt = s.orders.size || 1;
          const prevRev = prevSkuMap[s.title] || 0;
          const delta = prevRev > 0 ? ((s.rev - prevRev) / prevRev) * 100 : null;
          return { title: s.title, rev: s.rev, qty: s.qty, orderCnt, aov: s.rev / orderCnt, delta };
        })
        .sort((a, b) => b.rev - a.rev)
        .slice(0, 12);

      function deltaBadge(cur, prev) {
        if (!prev || prev <= 0) return '<span class="text-slate-400 text-[10px]">—</span>';
        const pct = ((cur - prev) / prev) * 100;
        const cls = pct >= 0 ? 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950/50' : 'text-rose-600 bg-rose-50 dark:bg-rose-950/50';
        return `<span class="px-1.5 py-0.5 rounded font-bold text-[10px] ${cls}">${pct >= 0 ? '+' : ''}${pct.toFixed(1)}%</span>`;
      }

      const funnelSteps = [
        { label: '1. Sessions (AU)', cur: curTotals.sessions, prev: prevTotals.sessions, width: 100, color: 'from-sky-500 to-blue-600', rate: '100%' },
        { label: '2. Add to Cart', cur: curTotals.atc, prev: prevTotals.atc, width: 76, color: 'from-indigo-500 to-violet-600', rate: curTotals.sessions > 0 ? ((curTotals.atc / curTotals.sessions) * 100).toFixed(2) + '%' : '0%' },
        { label: '3. Reached Checkout', cur: curCheckouts, prev: prevCheckouts, width: 54, color: 'from-amber-500 to-orange-600', rate: curTotals.sessions > 0 ? ((curCheckouts / curTotals.sessions) * 100).toFixed(2) + '%' : '0%' },
        { label: '4. Ecommerce Purchases', cur: curTotals.gaPurchases, prev: prevTotals.gaPurchases, width: 36, color: 'from-emerald-500 to-teal-600', rate: curTotals.sessions > 0 ? ((curTotals.gaPurchases / curTotals.sessions) * 100).toFixed(2) + '%' : '0%' }
      ];

      const fbCurRoas = curTotals.fbSpend > 0 ? curTotals.fbGmv / curTotals.fbSpend : 0;
      const fbPrevRoas = prevTotals.fbSpend > 0 ? prevTotals.fbGmv / prevTotals.fbSpend : 0;
      const ggCurRoas = curTotals.ggSpend > 0 ? curTotals.ggGmv / curTotals.ggSpend : 0;
      const ggPrevRoas = prevTotals.ggSpend > 0 ? prevTotals.ggGmv / prevTotals.ggSpend : 0;

      return `
        <div class="space-y-5 text-xs">
          <!-- THANH LỌC DASHBOARD BREAK BY DAY -->
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 class="font-extrabold text-sm">📊 Dashboard Break by Day — Hiệu suất Toàn Shop, Kênh Ads, Funnel & Top SKU</h3>
              <p class="text-[11px] text-slate-500">Kỳ hiện tại: <strong>${dFrom} → ${dTo}</strong> • Đối chiếu: <strong>${prevFrom} → ${prevTo}</strong></p>
            </div>
            <div class="flex flex-wrap items-center gap-1.5">
              ${['L7D', 'L14D', 'L30D', 'CUSTOM'].map((rg) => `
                <button onclick="execDashState.range='${rg}'; render();" class="px-2.5 py-1.5 rounded-lg font-bold ${execDashState.range === rg ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'border border-slate-200 dark:border-slate-700'}">${rg === 'CUSTOM' ? 'Chọn ngày' : rg}</button>
              `).join('')}
              ${execDashState.range === 'CUSTOM' ? `
                <input type="date" value="${dFrom}" onchange="execDashState.from=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                <span>→</span>
                <input type="date" value="${dTo}" onchange="execDashState.to=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              ` : ''}
              <select onchange="execDashState.compareMode=this.value; render();" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                <option value="PREV" ${execDashState.compareMode === 'PREV' ? 'selected' : ''}>So sánh: Kỳ liền trước</option>
                <option value="MOM" ${execDashState.compareMode === 'MOM' ? 'selected' : ''}>So sánh: Cùng kỳ tháng trước</option>
              </select>
            </div>
          </div>

          <!-- BIỂU ĐỒ DOANH THU TOÀN SHOP + ONLINE STORE VS PAID ADS -->
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
            <div class="font-extrabold">Xu hướng Shopify Total GMV, Online Store GMV vs Chi tiêu Paid Ads theo Ngày</div>
            <div class="h-72">
              <canvas id="exec-daily-chart"></canvas>
            </div>
          </div>

          <!-- CONVERSION FUNNEL HÌNH PHỄU + HIỆU SUẤT KÊNH ADS -->
          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
              <div class="flex items-center justify-between">
                <h4 class="font-extrabold">🔻 Conversion Funnel (GA4 Australia)</h4>
                <span class="text-[11px] text-slate-400">So với kỳ đối chiếu</span>
              </div>
              <div class="space-y-2.5 pt-1 flex flex-col items-center">
                ${funnelSteps.map((st) => `
                  <div class="w-full flex flex-col items-center">
                    <div style="width:${st.width}%" class="py-2.5 px-3 rounded-xl bg-gradient-to-r ${st.color} text-white flex items-center justify-between shadow-sm">
                      <span class="font-bold truncate">${st.label}</span>
                      <span class="font-extrabold">${Math.round(st.cur).toLocaleString('en-US')} (${st.rate})</span>
                    </div>
                    <div class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1.5">
                      <span>Kỳ trước: ${Math.round(st.prev).toLocaleString('en-US')}</span>
                      ${deltaBadge(st.cur, st.prev)}
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
              <h4 class="font-extrabold">📣 Hiệu suất theo Kênh từ Trình Ads (So sánh & Break by Day)</h4>
              <div class="grid grid-cols-2 gap-3">
                <div class="p-3 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900 space-y-1">
                  <div class="font-extrabold text-indigo-700 dark:text-indigo-300">Facebook Ads (Reported)</div>
                  <div>Spend: <strong>$${curTotals.fbSpend.toFixed(2)}</strong> ${deltaBadge(curTotals.fbSpend, prevTotals.fbSpend)}</div>
                  <div>GMV: <strong>$${curTotals.fbGmv.toFixed(2)}</strong> ${deltaBadge(curTotals.fbGmv, prevTotals.fbGmv)}</div>
                  <div>ROAS: <strong>${fbCurRoas.toFixed(2)}x</strong> ${deltaBadge(fbCurRoas, fbPrevRoas)}</div>
                </div>
                <div class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/30 border border-amber-100 dark:border-amber-900 space-y-1">
                  <div class="font-extrabold text-amber-700 dark:text-amber-300">Google Ads (Reported)</div>
                  <div>Spend: <strong>$${curTotals.ggSpend.toFixed(2)}</strong> ${deltaBadge(curTotals.ggSpend, prevTotals.ggSpend)}</div>
                  <div>GMV: <strong>$${curTotals.ggGmv.toFixed(2)}</strong> ${deltaBadge(curTotals.ggGmv, prevTotals.ggGmv)}</div>
                  <div>ROAS: <strong>${ggCurRoas.toFixed(2)}x</strong> ${deltaBadge(ggCurRoas, ggPrevRoas)}</div>
                </div>
              </div>
              <div class="overflow-x-auto max-h-48 border border-slate-100 dark:border-slate-800 rounded-xl">
                <table class="w-full text-left text-[11px]">
                  <thead class="bg-slate-50 dark:bg-slate-800 text-slate-500 sticky top-0">
                    <tr>
                      <th class="px-2.5 py-1.5">Ngày</th>
                      <th class="px-2.5 py-1.5 text-right">FB Spend / ROAS</th>
                      <th class="px-2.5 py-1.5 text-right">GG Spend / ROAS</th>
                      <th class="px-2.5 py-1.5 text-right">Shop GMV</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                    ${[...curDays].reverse().map((d) => `
                      <tr>
                        <td class="px-2.5 py-1.5 font-bold">${d.date}</td>
                        <td class="px-2.5 py-1.5 text-right">$${d.fbSpend.toFixed(0)} • <strong>${d.fbSpend > 0 ? (d.fbGmv / d.fbSpend).toFixed(2) : '0.00'}x</strong></td>
                        <td class="px-2.5 py-1.5 text-right">$${d.ggSpend.toFixed(0)} • <strong>${d.ggSpend > 0 ? (d.ggGmv / d.ggSpend).toFixed(2) : '0.00'}x</strong></td>
                        <td class="px-2.5 py-1.5 text-right font-bold text-emerald-600">$${d.shopGmv.toFixed(0)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- TOP SẢN PHẨM BÁN CHẠY -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 font-extrabold">🏆 Top Sản Phẩm Bán Chạy (Doanh thu, Số đơn, AOV & Tăng/Giảm)</div>
            <div class="overflow-x-auto">
              <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-2.5">Sản phẩm (SKU)</th>
                    <th class="px-3 py-2.5 text-right">Doanh thu ($)</th>
                    <th class="px-3 py-2.5 text-right">Tăng / Giảm</th>
                    <th class="px-3 py-2.5 text-right">Số lượng</th>
                    <th class="px-3 py-2.5 text-right">Số đơn</th>
                    <th class="px-4 py-2.5 text-right">AOV đơn ($)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${topSkus.map((s) => `
                    <tr class="hover:bg-slate-50/70 dark:hover:bg-slate-800/40">
                      <td class="px-4 py-2 font-bold">${escapeHtml(s.title)}</td>
                      <td class="px-3 py-2 text-right font-extrabold text-emerald-600">$${s.rev.toFixed(2)}</td>
                      <td class="px-3 py-2 text-right">${s.delta === null ? '<span class="text-slate-400">—</span>' : `<span class="px-1.5 py-0.5 rounded font-bold text-[10px] ${s.delta >= 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">${s.delta >= 0 ? '+' : ''}${s.delta.toFixed(1)}%</span>`}</td>
                      <td class="px-3 py-2 text-right">${Math.round(s.qty)}</td>
                      <td class="px-3 py-2 text-right font-semibold">${s.orderCnt}</td>
                      <td class="px-4 py-2 text-right font-bold">$${s.aov.toFixed(2)}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="6" class="px-4 py-6 text-center text-slate-400">Chưa có dữ liệu đơn hàng Shopify trong khoảng đã chọn.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function renderExecDailyChart() {
      if (typeof Chart === 'undefined' || !window.__execDailySeries) return;
      const canvas = document.getElementById('exec-daily-chart');
      if (!canvas) return;
      if (execDailyChartInstance) {
        execDailyChartInstance.destroy();
        execDailyChartInstance = null;
      }
      const series = window.__execDailySeries;
      if (!series.length) return;
      const isDark = state.theme === 'dark';
      const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.22)';
      const tickColor = isDark ? '#94a3b8' : '#64748b';

      execDailyChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: series.map((d) => d.date.slice(5)),
          datasets: [
            {
              type: 'line',
              label: 'Shopify Total GMV ($)',
              data: series.map((d) => Number(d.shopGmv.toFixed(2))),
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.12)',
              borderWidth: 2.5,
              tension: 0.3,
              fill: true
            },
            {
              type: 'line',
              label: 'Shopify Online Store ($)',
              data: series.map((d) => Number((d.onlineGmv || 0).toFixed(2))),
              borderColor: '#0284c7',
              borderDash: [5, 4],
              borderWidth: 2,
              tension: 0.3,
              fill: false
            },
            {
              type: 'bar',
              label: 'FB Spend ($)',
              data: series.map((d) => Number(d.fbSpend.toFixed(2))),
              backgroundColor: '#6366f1',
              borderRadius: 4,
              stack: 'spend'
            },
            {
              type: 'bar',
              label: 'GG Spend ($)',
              data: series.map((d) => Number(d.ggSpend.toFixed(2))),
              backgroundColor: '#f59e0b',
              borderRadius: 4,
              stack: 'spend'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { labels: { color: tickColor, font: { size: 11, weight: 'bold' } } } },
          scales: {
            x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 10 } } },
            y: { grid: { color: gridColor }, ticks: { color: tickColor, font: { size: 10 } } }
          }
        }
      });
    }

    // =========================================================================
    // FB DEEPDIVE & GG DEEPDIVE
    // Luồng: Chart -> Hiệu suất từng Campaign trong kỳ -> Break by Date -> Issue -> Deepdive Chi tiết (Click Creative xem Break by Date)
    // =========================================================================
    let masPlatformDdState = {
      platform: 'FB',
      subSource: 'FB_Ads',
      range: 'L7D',
      from: offsetDate(-7),
      to: offsetDate(-1),
      compareMode: 'PREV',
      selectedCampaign: 'ALL',
      selectedCreativeKey: null,
      filter: 'ALL',
      sortBy: 'spend',
      sortDir: 'desc',
      search: '',
      rules: {
        minSpend: 15,
        scaleRoas: 3.5,
        cutRoas: 1.8,
        zeroOrderCutSpend: 20
      }
    };
    let platformDailyChartInstance = null;

    function getPlatformDateBounds(st) {
      const todayIso = masSydneyToday();
      const dayFromToday = offset => {
        const date = new Date(todayIso + 'T00:00:00Z');
        date.setUTCDate(date.getUTCDate() + offset);
        return formatDateISO(date);
      };
      const yestIso = dayFromToday(-1);
      let dFrom = st.from;
      let dTo = st.to;
      if (st.range === 'TODAY') { dFrom = todayIso; dTo = todayIso; }
      else if (st.range === 'YEST') { dFrom = yestIso; dTo = yestIso; }
      else if (st.range === 'L7D') { dFrom = dayFromToday(-7); dTo = yestIso; }
      else if (st.range === 'L30D') { dFrom = dayFromToday(-30); dTo = yestIso; }
      else if (st.range === 'ALL') { dFrom = '2000-01-01'; dTo = '2099-12-31'; }
      return { dFrom, dTo };
    }

    function parsePlatformRow(source, r) {
      const dt = normalizeDateToISO(r[0]);
      if (!dt) return null;
      const isCampLevel = source === 'FB_Campaign_Daily';
      const is3ColDim = source === 'GG_Ads_Product' || source === 'FB_Ads_Product';
      const dimIdx = isCampLevel ? 1 : (is3ColDim ? 2 : 3);
      const spendIdx = isCampLevel ? 2 : (is3ColDim ? 3 : 4);
      const impIdx = isCampLevel ? 3 : (is3ColDim ? 4 : 5);
      const clickIdx = isCampLevel ? 4 : (is3ColDim ? 5 : 6);
      const convIdx = isCampLevel ? 5 : (is3ColDim ? 6 : 7);
      const gmvIdx = isCampLevel ? 6 : (is3ColDim ? 7 : 8);

      const isDemo = source === 'FB_Ads_Demo';
      const isAud = source === 'FB_Ads_Audience';
      const campName = String(r[1] || '').trim();
      const dimName = isCampLevel
        ? campName
        : isDemo
          ? `${r[2] || 'All'} → ${r[3] || '(Ad)'}`
          : String(r[dimIdx] || r[1] || '(Unknown)').trim();
      const subMeta = isCampLevel
        ? 'Campaign Level (Ads Manager Exact)'
        : isAud
          ? `${r[2] || ''} • ${campName}`
          : isDemo
            ? `Campaign: ${campName}`
            : source === 'FB_Ads' && r[2]
              ? `${campName} • ${r[2]}`
              : campName;

      const spend = parseCsvNumber(r[spendIdx]);
      const imp = parseCsvNumber(r[impIdx]);
      const clicks = parseCsvNumber(r[clickIdx]);
      const conv = parseCsvNumber(r[convIdx]);
      const gmv = parseCsvNumber(r[gmvIdx]);
      const groupKey = source === 'FB_Ads'
        ? JSON.stringify([campName, String(r[13] || ''), String(r[15] || r[2] || ''), String(r[16] || dimName)])
        : `${campName} ||| ${dimName}`;

      return { dt, campName, dimName, subMeta, spend, imp, clicks, conv, gmv, groupKey };
    }

    function toggleSelectCreativeKey(encodedKey) {
      const key = decodeURIComponent(encodedKey);
      masPlatformDdState.selectedCreativeKey = masPlatformDdState.selectedCreativeKey === key ? null : key;
      render();
    }

    function renderPlatformDeepdive(platform) {
      const st = masPlatformDdState;
      const isFb = platform === 'FB';
      st.platform = platform;
      const fbSources = ['FB_Ads', 'FB_Ads_Audience', 'FB_Ads_Demo', 'FB_Ads_Product'];
      const ggSources = ['GG_Ads_Creative', 'GG_Ads_PMax', 'GG_Ads_Keyword', 'GG_Ads_Search_Term', 'GG_Ads_Product'];
      const sourceList = isFb ? fbSources : ggSources;
      if (!sourceList.includes(st.subSource)) {
        st.subSource = sourceList[0];
        st.selectedCampaign = 'ALL';
        st.selectedCreativeKey = null;
      }

      const rawRows = (state.masSheetConfig?.deepdive && state.masSheetConfig.deepdive[st.subSource]) || [];
      const dataRows = rawRows.slice(1);
      const campSourceKey = isFb ? 'FB_Ads' : st.subSource;
      const campDataRows = (state.masSheetConfig?.deepdive?.[campSourceKey] || []).slice(1);
      const { dFrom, dTo } = getPlatformDateBounds(st);

      const daySpan = Math.max(1, Math.round((new Date(dTo) - new Date(dFrom)) / 86400000) + 1);
      let prevFrom, prevTo;
      if (st.compareMode === 'MOM') {
        const fObj = new Date(dFrom); fObj.setMonth(fObj.getMonth() - 1);
        const tObj = new Date(dTo); tObj.setMonth(tObj.getMonth() - 1);
        prevFrom = formatDateISO(fObj);
        prevTo = formatDateISO(tObj);
      } else {
        prevTo = formatDateISO(new Date(new Date(dFrom).getTime() - 86400000));
        prevFrom = formatDateISO(new Date(new Date(prevTo).getTime() - (daySpan - 1) * 86400000));
      }

      const campByDateMap = {};
      const curCampMap = {};
      const prevCampMap = {};
      const curGroupMap = {};
      const prevGroupMap = {};
      const creativeByDateMap = {};

      const seenCampDay = new Set();
      campDataRows.forEach((r) => {
        const parsed = parsePlatformRow(campSourceKey, r);
        if (!parsed) return;
        const cdEntityKey = `${parsed.dt}|${parsed.campName}|${parsed.dimName}`;
        if (campSourceKey !== 'FB_Ads') {
          if (seenCampDay.has(cdEntityKey)) return;
          seenCampDay.add(cdEntityKey);
        }

        if (parsed.dt >= dFrom && parsed.dt <= dTo) {
          const cdKey = `${parsed.dt}|${parsed.campName}`;
          if (!campByDateMap[cdKey]) {
            campByDateMap[cdKey] = { date: parsed.dt, camp: parsed.campName, spend: 0, imp: 0, clicks: 0, conv: 0, gmv: 0 };
          }
          campByDateMap[cdKey].spend += parsed.spend;
          campByDateMap[cdKey].imp += parsed.imp;
          campByDateMap[cdKey].clicks += parsed.clicks;
          campByDateMap[cdKey].conv += parsed.conv;
          campByDateMap[cdKey].gmv += parsed.gmv;

          if (!curCampMap[parsed.campName]) {
            curCampMap[parsed.campName] = { camp: parsed.campName, spend: 0, imp: 0, clicks: 0, conv: 0, gmv: 0 };
          }
          curCampMap[parsed.campName].spend += parsed.spend;
          curCampMap[parsed.campName].imp += parsed.imp;
          curCampMap[parsed.campName].clicks += parsed.clicks;
          curCampMap[parsed.campName].conv += parsed.conv;
          curCampMap[parsed.campName].gmv += parsed.gmv;
        } else if (st.range !== 'ALL' && parsed.dt >= prevFrom && parsed.dt <= prevTo) {
          if (!prevCampMap[parsed.campName]) {
            prevCampMap[parsed.campName] = { spend: 0, gmv: 0, conv: 0 };
          }
          prevCampMap[parsed.campName].spend += parsed.spend;
          prevCampMap[parsed.campName].gmv += parsed.gmv;
          prevCampMap[parsed.campName].conv += parsed.conv;
        }
      });

      const seenEntityDay = new Set();
      dataRows.forEach((r) => {
        const parsed = parsePlatformRow(st.subSource, r);
        if (!parsed) return;
        const entityDayKey = `${parsed.dt}|${parsed.campName}|${parsed.dimName}`;
        if (st.subSource !== 'FB_Ads') {
          if (seenEntityDay.has(entityDayKey)) return;
          seenEntityDay.add(entityDayKey);
        }

        if (parsed.dt >= dFrom && parsed.dt <= dTo) {
          if (!curGroupMap[parsed.groupKey]) {
            curGroupMap[parsed.groupKey] = {
              groupKey: parsed.groupKey,
              name: parsed.dimName,
              campName: parsed.campName,
              camp: parsed.subMeta,
              spend: 0,
              imp: 0,
              clicks: 0,
              conv: 0,
              gmv: 0
            };
          }
          curGroupMap[parsed.groupKey].spend += parsed.spend;
          curGroupMap[parsed.groupKey].imp += parsed.imp;
          curGroupMap[parsed.groupKey].clicks += parsed.clicks;
          curGroupMap[parsed.groupKey].conv += parsed.conv;
          curGroupMap[parsed.groupKey].gmv += parsed.gmv;

          if (!creativeByDateMap[parsed.groupKey]) creativeByDateMap[parsed.groupKey] = {};
          if (!creativeByDateMap[parsed.groupKey][parsed.dt]) {
            creativeByDateMap[parsed.groupKey][parsed.dt] = { date: parsed.dt, spend: 0, imp: 0, clicks: 0, conv: 0, gmv: 0 };
          }
          creativeByDateMap[parsed.groupKey][parsed.dt].spend += parsed.spend;
          creativeByDateMap[parsed.groupKey][parsed.dt].imp += parsed.imp;
          creativeByDateMap[parsed.groupKey][parsed.dt].clicks += parsed.clicks;
          creativeByDateMap[parsed.groupKey][parsed.dt].conv += parsed.conv;
          creativeByDateMap[parsed.groupKey][parsed.dt].gmv += parsed.gmv;
        } else if (st.range !== 'ALL' && parsed.dt >= prevFrom && parsed.dt <= prevTo) {
          if (!prevGroupMap[parsed.groupKey]) {
            prevGroupMap[parsed.groupKey] = { spend: 0, gmv: 0, conv: 0 };
          }
          prevGroupMap[parsed.groupKey].spend += parsed.spend;
          prevGroupMap[parsed.groupKey].gmv += parsed.gmv;
          prevGroupMap[parsed.groupKey].conv += parsed.conv;
        }
      });

      function calcDelta(cur, prev) {
        if (st.range === 'ALL' || prev === undefined || prev === null || prev <= 0) return null;
        return ((cur - prev) / prev) * 100;
      }

      function renderDeltaChip(delta) {
        if (delta === null) return '<span class="text-slate-400 text-[10px]">—</span>';
        const cls = delta >= 0 ? 'text-emerald-600' : 'text-rose-600';
        return `<span class="text-[10px] font-bold ${cls}">${delta >= 0 ? '+' : ''}${delta.toFixed(0)}%</span>`;
      }

      let campList = Object.values(curCampMap)
        .map((c) => {
          const roas = c.spend > 0 ? c.gmv / c.spend : 0;
          const cpm = c.imp > 0 ? (c.spend / c.imp) * 1000 : 0;
          const cpc = c.clicks > 0 ? c.spend / c.clicks : 0;
          const prev = prevCampMap[c.camp];
          const prevRoas = prev && prev.spend > 0 ? prev.gmv / prev.spend : null;
          return {
            ...c,
            roas,
            cpm,
            cpc,
            ctr: c.imp > 0 ? (c.clicks / c.imp) * 100 : 0,
            cvr: c.clicks > 0 ? (c.conv / c.clicks) * 100 : 0,
            spendDelta: prev ? calcDelta(c.spend, prev.spend) : null,
            gmvDelta: prev ? calcDelta(c.gmv, prev.gmv) : null,
            roasDelta: prevRoas !== null ? calcDelta(roas, prevRoas) : null
          };
        })
        .sort((a, b) => b.spend - a.spend);

      if (st.search) {
        const q = st.search.toLowerCase();
        campList = campList.filter((c) => c.camp.toLowerCase().includes(q));
      }

      let campByDateRows = Object.values(campByDateMap)
        .filter((r) => st.selectedCampaign === 'ALL' || r.camp === st.selectedCampaign)
        .map((r) => ({
          ...r,
          roas: r.spend > 0 ? r.gmv / r.spend : 0,
          cpm: r.imp > 0 ? (r.spend / r.imp) * 1000 : 0,
          cpc: r.clicks > 0 ? r.spend / r.clicks : 0,
          ctr: r.imp > 0 ? (r.clicks / r.imp) * 100 : 0,
          cvr: r.clicks > 0 ? (r.conv / r.clicks) * 100 : 0
        }))
        .sort((a, b) => (a.date !== b.date ? (a.date < b.date ? 1 : -1) : b.spend - a.spend));

      if (st.search) {
        const q = st.search.toLowerCase();
        campByDateRows = campByDateRows.filter((r) => r.camp.toLowerCase().includes(q) || r.date.includes(q));
      }

      const dailyChartAgg = {};
      campByDateRows.forEach((r) => {
        if (!dailyChartAgg[r.date]) dailyChartAgg[r.date] = { date: r.date, spend: 0, gmv: 0, imp: 0, clicks: 0 };
        dailyChartAgg[r.date].spend += r.spend;
        dailyChartAgg[r.date].gmv += r.gmv;
        dailyChartAgg[r.date].imp += r.imp;
        dailyChartAgg[r.date].clicks += r.clicks;
      });
      if (isFb && st.selectedCampaign === 'ALL' && !st.search.trim()) {
        const aggregateRows = (state.masSheetConfig?.dailyAggRows || []).slice(1);
        aggregateRows.forEach(row => {
          const date = normalizeDateToISO(row[0]);
          if (!date || date < dFrom || date > dTo || row.length < 6) return;
          dailyChartAgg[date] = {
            date, spend: parseCsvNumber(row[1]), imp: parseCsvNumber(row[2]),
            clicks: parseCsvNumber(row[3]), gmv: parseCsvNumber(row[5])
          };
        });
      }
      window.__platformDailySeries = Object.values(dailyChartAgg)
        .sort((a, b) => (a.date < b.date ? -1 : 1))
        .map((d) => ({ ...d, roas: d.spend > 0 ? d.gmv / d.spend : 0 }));
      window.__platformDailyLabel = isFb ? 'Facebook Ads' : 'Google Ads';

      const rules = st.rules;
      let items = Object.entries(curGroupMap).map(([gKey, it]) => {
        const roas = it.spend > 0 ? it.gmv / it.spend : 0;
        const cpm = it.imp > 0 ? (it.spend / it.imp) * 1000 : 0;
        const cpc = it.clicks > 0 ? it.spend / it.clicks : 0;
        const ctr = it.imp > 0 ? (it.clicks / it.imp) * 100 : 0;
        const cvr = it.clicks > 0 ? (it.conv / it.clicks) * 100 : 0;
        const prev = prevGroupMap[gKey];
        const prevRoas = prev && prev.spend > 0 ? prev.gmv / prev.spend : null;

        let badge = { text: 'TEST • Đang học', cls: 'bg-sky-100 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300', type: 'TEST' };
        if (it.spend >= rules.zeroOrderCutSpend && it.conv === 0) {
          badge = { text: 'ISSUE / CUT • 0 đơn', cls: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300', type: 'CUT' };
        } else if (it.spend >= rules.minSpend && roas < rules.cutRoas) {
          badge = { text: `ISSUE / CUT • ROAS < ${rules.cutRoas}x`, cls: 'bg-rose-100 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300', type: 'CUT' };
        } else if (it.spend >= rules.minSpend && roas >= rules.scaleRoas) {
          badge = { text: 'SCALE • +25% Budget', cls: 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-300', type: 'SCALE' };
        }

        return {
          ...it,
          roas,
          cpm,
          cpc,
          ctr,
          cvr,
          spendDelta: prev ? calcDelta(it.spend, prev.spend) : null,
          gmvDelta: prev ? calcDelta(it.gmv, prev.gmv) : null,
          roasDelta: prevRoas !== null ? calcDelta(roas, prevRoas) : null,
          badge
        };
      });

      const issueItems = items.filter((i) => i.badge.type === 'CUT').sort((a, b) => b.spend - a.spend);
      const scaleItems = items.filter((i) => i.badge.type === 'SCALE').sort((a, b) => b.gmv - a.gmv);

      if (st.selectedCampaign !== 'ALL') {
        items = items.filter((i) => i.campName === st.selectedCampaign);
      }
      if (st.search) {
        const q = st.search.toLowerCase();
        items = items.filter((i) => i.name.toLowerCase().includes(q) || i.camp.toLowerCase().includes(q));
      }
      if (st.filter !== 'ALL') {
        items = items.filter((i) => i.badge.type === st.filter);
      }

      const sKey = st.sortBy;
      const sDir = st.sortDir === 'asc' ? 1 : -1;
      items.sort((a, b) => ((a[sKey] || 0) - (b[sKey] || 0)) * sDir);

      // Dữ liệu Break by Date cho Creative / Item đang được chọn
      const selectedCreativeObj = st.selectedCreativeKey ? curGroupMap[st.selectedCreativeKey] : null;
      const selectedCreativeDays = selectedCreativeObj && creativeByDateMap[st.selectedCreativeKey]
        ? Object.values(creativeByDateMap[st.selectedCreativeKey])
            .map((d) => ({
              ...d,
              roas: d.spend > 0 ? d.gmv / d.spend : 0,
              cpm: d.imp > 0 ? (d.spend / d.imp) * 1000 : 0,
              cpc: d.clicks > 0 ? d.spend / d.clicks : 0,
              ctr: d.imp > 0 ? (d.clicks / d.imp) * 100 : 0,
              cvr: d.clicks > 0 ? (d.conv / d.clicks) * 100 : 0
            }))
            .sort((a, b) => (a.date < b.date ? 1 : -1))
        : [];

      const totalRows = isFb ? window.__platformDailySeries : campList;
      const totSpend = totalRows.reduce((s, d) => s + d.spend, 0);
      const totGmv = totalRows.reduce((s, d) => s + d.gmv, 0);
      const totImp = totalRows.reduce((s, d) => s + d.imp, 0);
      const totClicks = totalRows.reduce((s, d) => s + d.clicks, 0);
      const totRoas = totSpend > 0 ? totGmv / totSpend : 0;
      const totCpm = totImp > 0 ? (totSpend / totImp) * 1000 : 0;
      const totCpc = totClicks > 0 ? totSpend / totClicks : 0;

      const sourceLabels = {
        FB_Ads: 'Creative',
        FB_Ads_Audience: 'Audience / LAL / Interest',
        FB_Ads_Demo: 'Tuổi × Giới × Content',
        FB_Ads_Product: 'Catalog Product',
        GG_Ads_Creative: 'Creative',
        GG_Ads_PMax: 'PMax Assets',
        GG_Ads_Keyword: 'Keyword',
        GG_Ads_Search_Term: 'Search Terms',
        GG_Ads_Product: 'Product'
      };

      const defaultChannel = isFb ? 'FB Ads' : 'Google Ads';

      return `
        <div class="space-y-5 text-xs">
          <!-- BỘ LỌC THỜI GIAN & SO SÁNH -->
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="font-extrabold text-sm ${isFb ? 'text-indigo-600 dark:text-indigo-400' : 'text-amber-600 dark:text-amber-400'}">
                ${isFb ? 'Facebook Ads — Campaign Overview → Break by Date → Issue → Creative Deepdive' : 'Google Ads — Campaign Overview → Break by Date → Issue → Deepdive'}
              </div>
              <div class="flex flex-wrap items-center gap-1.5">
                ${[
                  { id: 'TODAY', label: 'Today' },
                  { id: 'YEST', label: 'Yesterday' },
                  { id: 'L7D', label: 'Last 7D' },
                  { id: 'L30D', label: 'Last 30D' },
                  { id: 'ALL', label: 'All-Time' },
                  { id: 'CUSTOM', label: 'Chọn ngày' }
                ].map((rg) => `
                  <button onclick="masPlatformDdState.range='${rg.id}'; render();" class="px-2.5 py-1.5 rounded-lg font-bold transition ${st.range === rg.id ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300'}">${rg.label}</button>
                `).join('')}
                ${st.range === 'CUSTOM' ? `
                  <input type="date" value="${dFrom}" onchange="masPlatformDdState.from=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                  <span>→</span>
                  <input type="date" value="${dTo}" onchange="masPlatformDdState.to=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                ` : `<span class="text-slate-400 ml-1">(${dFrom} → ${dTo})</span>`}
                <select onchange="masPlatformDdState.compareMode=this.value; render();" class="px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold">
                  <option value="PREV" ${st.compareMode === 'PREV' ? 'selected' : ''}>vs Kỳ liền trước</option>
                  <option value="MOM" ${st.compareMode === 'MOM' ? 'selected' : ''}>vs Cùng kỳ tháng trước</option>
                </select>
              </div>
            </div>

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
              <div class="flex flex-wrap items-center gap-2">
                <span class="font-bold text-slate-500">Rule:</span>
                <label class="flex items-center gap-1 bg-slate-50 dark:bg-slate-800 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700">
                  <span>Min $</span>
                  <input type="number" value="${rules.minSpend}" onchange="masPlatformDdState.rules.minSpend=Number(this.value)||0; render();" class="w-11 bg-transparent font-bold text-right" />
                </label>
                <label class="flex items-center gap-1 bg-emerald-50 dark:bg-emerald-950/40 px-2 py-1 rounded-lg border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300">
                  <span>Scale ≥</span>
                  <input type="number" step="0.1" value="${rules.scaleRoas}" onchange="masPlatformDdState.rules.scaleRoas=Number(this.value)||0; render();" class="w-11 bg-transparent font-bold text-right" />x
                </label>
                <label class="flex items-center gap-1 bg-rose-50 dark:bg-rose-950/40 px-2 py-1 rounded-lg border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300">
                  <span>Cut &lt;</span>
                  <input type="number" step="0.1" value="${rules.cutRoas}" onchange="masPlatformDdState.rules.cutRoas=Number(this.value)||0; render();" class="w-11 bg-transparent font-bold text-right" />x
                </label>
              </div>
              <input value="${escapeHtml(st.search)}" oninput="masPlatformDdState.search=this.value; render();" placeholder="Tìm campaign / ad / keyword / product..." class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 w-64" />
            </div>
          </div>

          <!-- BƯỚC 1: BIỂU ĐỒ XU HƯỚNG & HIỆU SUẤT TỪNG CAMPAIGN TRONG KỲ -->
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2 bg-slate-50/60 dark:bg-slate-800/40">
              <div>
