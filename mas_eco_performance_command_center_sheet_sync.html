    function renderPlatformDailyChart() {
      if (typeof Chart === 'undefined' || !window.__platformDailySeries) return;
      const canvas = document.getElementById('platform-daily-chart');
      if (!canvas) return;
      if (platformDailyChartInstance) {
        platformDailyChartInstance.destroy();
        platformDailyChartInstance = null;
      }
      const series = window.__platformDailySeries;
      if (!series.length) return;
      const labelPrefix = window.__platformDailyLabel || 'Ads';
      const isDark = state.theme === 'dark';
      const gridColor = isDark ? 'rgba(148,163,184,0.12)' : 'rgba(148,163,184,0.22)';
      const tickColor = isDark ? '#94a3b8' : '#64748b';

      platformDailyChartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: series.map((d) => d.date.slice(5)),
          datasets: [
            {
              type: 'line',
              label: `${labelPrefix} Reported GMV ($)`,
              data: series.map((d) => Number(d.gmv.toFixed(2))),
              borderColor: '#10b981',
              backgroundColor: 'rgba(16, 185, 129, 0.14)',
              borderWidth: 2.5,
              tension: 0.3,
              fill: true,
              yAxisID: 'y'
            },
            {
              type: 'bar',
              label: `${labelPrefix} Spend ($)`,
              data: series.map((d) => Number(d.spend.toFixed(2))),
              backgroundColor: labelPrefix.includes('Facebook') ? '#6366f1' : '#f59e0b',
              borderRadius: 4,
              yAxisID: 'y'
            },

    // =========================================================================
    // SHOPIFY PRODUCT & MIX CART (CÓ LỌC NGÀY)
    // =========================================================================
    let shopMixState = { range: 'L30D', from: offsetDate(-30), to: offsetDate(0), search: '' };

    function renderMasShopifyMix() {
      const raw = (state.masSheetConfig?.deepdive?.Shopify_Orders || []).slice(1);
      const todayIso = offsetDate(0);
      const yestIso = offsetDate(-1);
      let dFrom = shopMixState.from, dTo = shopMixState.to;
      if (shopMixState.range === 'TODAY') { dFrom = todayIso; dTo = todayIso; }
      else if (shopMixState.range === 'YEST') { dFrom = yestIso; dTo = yestIso; }
      else if (shopMixState.range === 'L7D') { dFrom = offsetDate(-7); dTo = yestIso; }
      else if (shopMixState.range === 'L30D') { dFrom = offsetDate(-30); dTo = yestIso; }
      else if (shopMixState.range === 'ALL') { dFrom = '2000-01-01'; dTo = '2099-12-31'; }

      const orderItems = {};
      const skuStats = {};
      const seenLine = new Set();

      raw.forEach((r) => {
        const dt = normalizeDateToISO(r[0]);
        if (!dt || dt < dFrom || dt > dTo) return;
        const oid = String(r[1] || '').trim();
        const title = String(r[6] || '').trim();
        const qty = parseCsvNumber(r[7]);
        const rev = parseCsvNumber(r[8]);
        const seg = String(r[11] || '');
        if (!oid || !title || qty <= 0) return;

        const lk = `${dt}|${oid}|${title}|${qty}|${rev}`;
        if (seenLine.has(lk)) return;
        seenLine.add(lk);

        if (!orderItems[oid]) orderItems[oid] = new Set();
        orderItems[oid].add(title);

        if (!skuStats[title]) skuStats[title] = { title, cacRev: 0, ltvRev: 0, qty: 0 };
        if (seg.includes('LTV')) skuStats[title].ltvRev += rev;
        else skuStats[title].cacRev += rev;
        skuStats[title].qty += qty;
      });

      const pairCounts = {};
      Object.values(orderItems).forEach((set) => {
        const arr = Array.from(set).sort();
        for (let i = 0; i < arr.length; i++) {
          for (let j = i + 1; j < arr.length; j++) {
            const pk = `${arr[i]} ||| ${arr[j]}`;
            pairCounts[pk] = (pairCounts[pk] || 0) + 1;
          }
        }
      });

      const q = shopMixState.search.toLowerCase();
      const topPairs = Object.entries(pairCounts)
        .map(([k, count]) => {
          const [a, b] = k.split(' ||| ');
          return { a, b, count };
        })
        .filter((p) => !q || p.a.toLowerCase().includes(q) || p.b.toLowerCase().includes(q))
        .sort((a, b) => b.count - a.count)
        .slice(0, 20);

      const topSkus = Object.values(skuStats)
        .filter((s) => !q || s.title.toLowerCase().includes(q))
        .sort((a, b) => b.cacRev + b.ltvRev - (a.cacRev + a.ltvRev))
        .slice(0, 20);

      return `
        <div class="space-y-5 text-xs">
          <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
              ${['TODAY', 'YEST', 'L7D', 'L30D', 'ALL', 'CUSTOM'].map((rg) => `
                <button onclick="shopMixState.range='${rg}'; render();" class="px-2.5 py-1.5 rounded-lg font-bold ${shopMixState.range === rg ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900' : 'border border-slate-200 dark:border-slate-700'}">${rg === 'CUSTOM' ? 'Chọn ngày' : rg}</button>
              `).join('')}
              ${shopMixState.range === 'CUSTOM' ? `
                <input type="date" value="${dFrom}" onchange="shopMixState.from=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
                <span>→</span>
                <input type="date" value="${dTo}" onchange="shopMixState.to=this.value; render();" class="px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              ` : ''}
            </div>
            <input value="${escapeHtml(shopMixState.search)}" oninput="shopMixState.search=this.value; render();" placeholder="Tìm tên sản phẩm SKU..." class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 w-60" />
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 font-extrabold">Top Cặp Sản Phẩm Mua Cùng Nhau (Mix Cart)</div>
              <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-2.5">Sản phẩm A</th>
                    <th class="px-3 py-2.5">Mua kèm Sản phẩm B</th>
                    <th class="px-4 py-2.5 text-right">Số đơn</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${topPairs.map((p) => `
                    <tr>
                      <td class="px-4 py-2 font-semibold">${escapeHtml(p.a)}</td>
                      <td class="px-3 py-2 text-indigo-600 font-semibold">+ ${escapeHtml(p.b)}</td>
                      <td class="px-4 py-2 text-right font-extrabold">${p.count}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">Chưa có dữ liệu ghép đơn.</td></tr>'}
                </tbody>
              </table>
            </div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800 font-extrabold">Top SKU theo CAC (Khách mới) vs LTV (Khách quay lại)</div>
              <table class="w-full text-left">
                <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                  <tr>
                    <th class="px-4 py-2.5">Product Title</th>
                    <th class="px-3 py-2.5 text-right">CAC Rev ($)</th>
                    <th class="px-4 py-2.5 text-right">LTV Rev ($)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                  ${topSkus.map((s) => `
                    <tr>
                      <td class="px-4 py-2 font-semibold">${escapeHtml(s.title)}</td>
                      <td class="px-3 py-2 text-right font-bold text-indigo-600">$${Math.round(s.cacRev).toLocaleString('en-US')}</td>
                      <td class="px-4 py-2 text-right font-bold text-emerald-600">$${Math.round(s.ltvRev).toLocaleString('en-US')}</td>
                    </tr>
                  `).join('') || '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400">Chưa có dữ liệu SKU.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

            </select>
            <input id="ll-content" required placeholder="Diễn biến / Issue / Learning thực tế..." class="px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 md:col-span-2" />
            <div class="flex gap-1.5">
              <input id="ll-action" placeholder="Next action..." class="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800" />
              <button type="submit" class="px-3.5 py-2 rounded-xl bg-emerald-600 text-white font-bold shrink-0">+ Log</button>
            </div>
          </form>

          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden">
            <table class="w-full text-left">
              <thead class="bg-slate-50 dark:bg-slate-800/70 text-slate-500">
                <tr>
                  <th class="px-4 py-2.5">Thời gian</th>
                  <th class="px-3 py-2.5">Phiên Live / Loại</th>
                  <th class="px-3 py-2.5">Ghi nhận Real-Time</th>
                  <th class="px-3 py-2.5">Action / Learning</th>
                  <th class="px-4 py-2.5 text-right">Chuyển thành</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 dark:divide-slate-800">
                ${logs.map((l) => `
                  <tr>
                    <td class="px-4 py-2.5 font-bold whitespace-nowrap">${escapeHtml(l.time)}<div class="text-[10px] text-slate-400">${escapeHtml(l.date)}</div></td>
                    <td class="px-3 py-2.5 font-bold">${escapeHtml(l.brand)}<div class="text-[10px] text-emerald-600">${escapeHtml(l.type)}</div></td>
                    <td class="px-3 py-2.5">${escapeHtml(l.content)}</td>
                    <td class="px-3 py-2.5 font-medium">${escapeHtml(l.action || '—')}</td>
                    <td class="px-4 py-2.5 text-right whitespace-nowrap space-x-1">
                      <button onclick="promoteLiveLogToIssue('${l.id}')" class="px-2 py-1 rounded-lg bg-rose-50 text-rose-700 text-[10px] font-bold">+ Issue</button>
                      <button onclick="promoteLiveLogToTask('${l.id}')" class="px-2 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-[10px] font-bold">+ Task</button>
                    </td>
                  </tr>
                `).join('') || '<tr><td colspan="5" class="px-4 py-6 text-center text-slate-400">Chưa có log nào trong phiên hôm nay.</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addEcoLiveLog(e) {
      e.preventDefault();
      state.ecoLiveLogs.unshift({
        id: 'll_' + Date.now(),
        time: new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }),
        date: offsetDate(0),
        brand: document.getElementById('ll-brand').value.trim(),
        type: document.getElementById('ll-type').value,
        content: document.getElementById('ll-content').value.trim(),
        action: document.getElementById('ll-action').value.trim(),
        pic: getCurrentUserPic()
      });
      saveState();
      render();
      showToast('Đã lưu Log Live Real-Time!', 'success');
    }

    function promoteLiveLogToIssue(id) {
      const l = state.ecoLiveLogs.find((x) => x.id === id);
      if (!l) return;
      state.issues.unshift({
        id: 'iss_' + Date.now(),
        project: 'Eco',
        brand: l.brand,
        issue: l.content,
        rootCause: 'Ghi nhận trong phiên Live',
        action: l.action || 'Kiểm tra và khắc phục trước phiên tới',
        pic: getCurrentUserPic(),
        deadline: offsetDate(1),
        status: 'Open'
      });
      saveState();
      render();
      showToast('Đã chuyển Log thành Issue Eco!', 'success');
    }

    function promoteLiveLogToTask(id) {
      const l = state.ecoLiveLogs.find((x) => x.id === id);
      if (!l) return;
      openTaskModal(null, 'Eco', {
        title: `[Eco Live] ${l.action || l.content}`,
        project: 'Eco',
        tag: 'Live',
        priority: 'High',
        pic: getCurrentUserPic(),
        deadline: offsetDate(1),
        note: `Từ Live Log (${l.brand}): ${l.content}`
      });
    }

    // =========================================================================
    // 1-CLICK EXECUTIVE REPORT
    // =========================================================================
    function buildFullExecutiveReportText() {
      const sumRows = state.masSheetConfig?.summaryRows || [];
      const activeTasks = (state.tasks || []).filter((t) => !t.done && !t.archived && t.status !== 'Done');
      const doneTasks = (state.tasks || []).filter((t) => t.done || t.archived || t.status === 'Done');
      const openIssues = (state.issues || []).filter((i) => i.status !== 'Resolved');

      let lines = [
        `BÁO CÁO ĐIỀU HÀNH MAS × ECO — ${offsetDate(0)}`,
        `==================================================`,
        `1. TỔNG QUAN HIỆU SUẤT MAS (AU):`
      ];

      if (sumRows.length > 5) {
        sumRows.slice(5, 19).forEach((r) => {
          if (r[0] && r[1]) lines.push(`- ${r[0]}: Today ${r[1]} | Yesterday ${r[2]} | L7D ${r[3]}`);
        });
      } else {
        lines.push(`- Chưa đồng bộ dữ liệu MAS Summary.`);
      }

      lines.push(`\n2. TIẾN ĐỘ TASK ĐANG TRIỂN KHAI (${activeTasks.length} active • ${doneTasks.length} archived):`);
      activeTasks.forEach((t) => {
        lines.push(`- [${t.project}] ${t.title} (${t.status} • ${t.progress || 0}% • PIC: ${t.pic || '—'})`);
      });

      lines.push(`\n3. ISSUE & NEXT ACTION ĐANG MỞ (${openIssues.length}):`);
      openIssues.forEach((i) => {
        lines.push(`- [${i.project}] ${i.issue} -> Next Action: ${i.action} (PIC: ${i.pic || '—'})`);
      });

      lines.push(`\n4. LOG LIVE REAL-TIME GẦN NHẤT (${(state.ecoLiveLogs || []).length}):`);
      (state.ecoLiveLogs || []).slice(0, 5).forEach((l) => {
        lines.push(`- [${l.time} • ${l.brand}] (${l.type}) ${l.content} -> ${l.action || ''}`);
      });

      return lines.join('\n');
    }

    function renderReportTab() {
      const txt = buildFullExecutiveReportText();
      return `
        <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-4 text-xs">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="font-extrabold text-sm">📋 Báo cáo Tổng hợp 1-Click (MAS + Eco + Tasks + Issues)</h3>
              <p class="text-[11px] text-slate-500">Sao chép nhanh gửi Telegram / Slack / Zalo hoặc tải xuống file .txt</p>
            </div>
            <div class="flex gap-2">
              <button onclick="copyReportText()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white font-bold">📋 Copy Báo Cáo</button>
              <button onclick="downloadReportTxt()" class="px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold">⬇️ Tải file .TXT</button>
            </div>
          </div>
          <textarea id="report-output" rows="18" readonly class="w-full p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-xs leading-relaxed">${escapeHtml(txt)}</textarea>
        </div>
      `;
    }

    function copyReportText() {
      const el = document.getElementById('report-output');
      if (!el) return;
      el.select();
      document.execCommand('copy');
      showToast('Đã copy báo cáo vào clipboard!', 'success');
    }

    function downloadReportTxt() {
      const txt = buildFullExecutiveReportText();
      const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `MAS-Eco-Report-${offsetDate(0)}.txt`;
      a.click();
    }

    // =========================================================================
    // AUTO-SYNC 30 PHÚT/LẦN & KHỞI CHẠY
    // =========================================================================
    let autoSyncIntervalId = null;
    function startAutoSyncTimer() {
      if (autoSyncIntervalId) clearInterval(autoSyncIntervalId);
      autoSyncIntervalId = setInterval(() => {
        if (isSessionUnlocked && state.masSheetConfig?.webAppUrl) {
          syncMasFromGoogleSheet(true);
        }
      }, 30 * 60 * 1000);
    }

    window.onload = function () {
      applyTheme();
      renderAuthGate();
      render();
      startAutoSyncTimer();
      if (isSessionUnlocked && state.masSheetConfig?.webAppUrl) {
        syncMasFromGoogleSheet(true);
      }
    };
  </script>
</body>
</html>
